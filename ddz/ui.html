<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>斗地主 · 本地版</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --g1:#c0392b; --g2:#6d1410; --g3:#2a0706;
    --gold:#f7c95c; --gold-d:#dc9a1e; --gold-l:#ffeab4;
    --ink:#fff7ee; --dim:#e3b8a2;
    --red:#ff6b52; --line:rgba(255,255,255,.09);
  }
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink); overflow:hidden;
    background:radial-gradient(120% 90% at 50% -10%, #b02a1f 0%, #6f1611 46%, #3a0b07 100%);
    -webkit-font-smoothing:antialiased;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(60% 45% at 50% 0%, rgba(255,220,140,.12), transparent 70%),
      radial-gradient(120% 90% at 50% 118%, rgba(0,0,0,.34), transparent 62%),
      radial-gradient(80% 60% at 50% 46%, rgba(255,110,70,.07), transparent 72%);
  }
  .app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:12px}
  /* ---------- 存储不可用提示条 ---------- */
  .storebar{
    position:fixed;left:0;right:0;top:0;z-index:400;
    display:flex;align-items:center;gap:8px;justify-content:center;
    padding:7px 14px;font-size:11.5px;line-height:1.4;font-weight:600;
    color:#ffe2d2;background:linear-gradient(180deg,#7d241a,#5a150e);
    border-bottom:1px solid rgba(255,150,110,.5);
    box-shadow:0 6px 18px -8px rgba(0,0,0,.9);
  }
  .storebar b{color:#ffc9a8}
  .storebar .sk{flex:0 0 auto;font-size:13px}
  .storebar.soft{
    background:linear-gradient(180deg,#7a4a12,#54300a);
    border-bottom-color:rgba(255,196,120,.45);color:#ffe9c8;
  }
  .storebar.soft b{color:#ffd79a}
  .storebar .x{
    flex:0 0 auto;margin-left:6px;width:18px;height:18px;border-radius:50%;
    background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.2);
    color:#ffe9c8;font-size:10px;line-height:1;cursor:pointer;font-family:inherit;
  }
  .storebar .x:hover{background:rgba(0,0,0,.4)}
  body.storefail .app{padding-top:44px}
  body.storefail .storebar{display:flex !important}
  .screen{width:100%;height:100%;display:flex;flex-direction:column;min-height:0}
  .hidden{display:none !important}

  /* ---------- 通用控件 ---------- */
  .btn{
    font-family:inherit;font-size:13px;font-weight:700;color:#5a3a06;
    border:0;border-radius:11px;padding:9px 18px;cursor:pointer;white-space:nowrap;
    background:linear-gradient(180deg,var(--gold-l),var(--gold) 45%,var(--gold-d));
    box-shadow:0 3px 0 #a06f0c, 0 6px 14px -6px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .08s, box-shadow .08s, filter .15s;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a06f0c, 0 3px 8px -6px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.6)}
  .btn:disabled{filter:grayscale(.75) brightness(.62);cursor:not-allowed;box-shadow:0 1px 0 rgba(0,0,0,.4)}
  .btn.ghost{
    color:#ffe8d2;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)
  }
  .btn.ghost:active{transform:translateY(1px)}
  .btn.block{width:100%;padding:12px;font-size:15px;letter-spacing:4px}
  .btn.sm{padding:7px 14px;font-size:12px;border-radius:9px}
  .icon-btn{
    width:38px;height:38px;flex:0 0 auto;border-radius:11px;cursor:pointer;font-size:16px;
    color:#ffe8d2;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.14)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.off{opacity:.42;filter:grayscale(1)}

  .coin-ico{
    width:17px;height:17px;border-radius:50%;flex:0 0 auto;display:inline-block;
    background:radial-gradient(circle at 35% 30%, #fff3c4, #f9c94f 45%, #c8880f 100%);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55), 0 1px 3px rgba(0,0,0,.45);
    position:relative;
  }
  .coin-ico::after{
    content:"";position:absolute;inset:4px;border-radius:50%;
    border:1.5px solid rgba(140,88,0,.55);
  }
  .coin-pill{
    display:flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:20px;
    background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.26));
    border:1px solid rgba(255,214,120,.28);font-size:13px;font-weight:800;color:#ffe6a8;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07)
  }
  .coin-pill.sm{font-size:12px;padding:5px 10px 5px 8px}

  /* ---------- 登录：春节场景 ---------- */
  #scrAuth{
    position:relative;align-items:center;justify-content:center;
    overflow-y:auto;overflow-x:hidden;padding:18px 8px 22px;
    background:
      radial-gradient(120% 74% at 50% -6%, rgba(255,158,96,.18), transparent 62%),
      radial-gradient(64% 44% at 50% 106%, rgba(255,118,58,.16), transparent 72%);
  }
  .fw-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .auth-wrap{position:relative;z-index:3;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}

  /* 灯笼：悬在厅堂上方，暖光呼吸 + 慢摆 */
  .a-lantern{
    position:absolute;top:-8px;width:58px;height:118px;z-index:2;pointer-events:none;
    transform-origin:50% 0;animation:sway 6.6s ease-in-out infinite;
    filter:drop-shadow(0 12px 24px rgba(0,0,0,.62)) drop-shadow(0 0 22px rgba(255,118,58,.45));
  }
  .a-lantern.l{left:15%}
  .a-lantern.r{right:15%;animation-delay:-3.3s}
  .a-lantern svg{width:100%;height:92px;display:block}
  .a-lantern .tas{
    position:relative;display:block;width:6px;height:16px;margin:0 auto;border-radius:3px;
    background:linear-gradient(180deg,#ffe3a4,#e0a63c 60%,#a86f18);
    box-shadow:0 0 12px rgba(255,180,100,.55);
    animation:tasSwing 3.1s ease-in-out infinite;transform-origin:50% 0;
  }
  .a-lantern .tas::after{
    content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
    width:12px;height:18px;
    background:repeating-linear-gradient(90deg,#f0b64a 0 1.6px,transparent 1.6px 4px);
    clip-path:polygon(18% 0,82% 0,62% 100%,38% 100%);
  }
  .a-lantern::after{
    content:"";position:absolute;left:50%;top:34px;width:190px;height:190px;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,138,70,.26),rgba(255,120,60,.08) 42%,transparent 68%);
    animation:lampPulse 3.8s ease-in-out infinite;
  }
  .a-lantern.r::after{animation-delay:-1.9s}
  @keyframes lampPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.16)}}
  @keyframes tasSwing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

  /* 抱对联的人物 */
  .a-fig{
    position:absolute;bottom:74px;z-index:2;width:286px;height:406px;pointer-events:none;
  }
  .a-fig.l{left:clamp(2px,3.6vw,72px)}
  .a-fig.r{right:clamp(2px,3.6vw,72px)}
  .a-fig::before{
    content:"";position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    width:246px;height:74px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 72%);
  }
  .a-fig .fig{
    position:absolute;left:0;bottom:0;width:238px;height:357px;
    animation:figBob 5.6s ease-in-out infinite;transform-origin:50% 100%;
  }
  .a-fig.r .fig{left:auto;right:0;animation-delay:-1.8s}
  @keyframes figBob{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-5px) rotate(.5deg)}}
  .a-fig .fig .av{width:100%;height:100%;filter:drop-shadow(0 16px 24px rgba(0,0,0,.55))}

  /* 春联 */
  .duilian{
    position:absolute;bottom:96px;width:70px;height:252px;z-index:2;
    display:flex;align-items:center;justify-content:center;border-radius:3px;
    border:1.5px solid #ecbc5c;
    background:
      repeating-linear-gradient(0deg, rgba(255,214,140,.09) 0 1px, transparent 1px 17px),
      radial-gradient(circle at 28% 16%, rgba(255,226,160,.26), transparent 46%),
      linear-gradient(180deg,#d02f21,#a8180f 54%,#7c0d07);
    box-shadow:0 12px 24px -10px rgba(0,0,0,.9),
      inset 0 0 0 3px rgba(84,6,4,.32), inset 0 0 20px rgba(0,0,0,.3);
    transform-origin:50% 92%;
  }
  .a-fig.l .duilian{left:188px;animation:dipL 6.6s ease-in-out infinite}
  .a-fig.r .duilian{right:188px;animation:dipR 6.6s ease-in-out infinite}
  @keyframes dipL{0%,100%{transform:rotate(4.5deg)}50%{transform:rotate(5.6deg) translateY(-3px)}}
  @keyframes dipR{0%,100%{transform:rotate(-4.5deg)}50%{transform:rotate(-5.6deg) translateY(-3px)}}
  .duilian span{
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:34px;line-height:1.06;letter-spacing:7px;font-weight:900;
    color:#ffe7a6;text-shadow:0 2px 0 #6f0a05, 0 0 14px rgba(255,196,96,.55);
  }
  .duilian::before,.duilian::after{
    content:"";position:absolute;left:-3px;right:-3px;height:9px;border-radius:2px;
    background:linear-gradient(180deg,#ffe6ad,#e6ac42 58%,#b0761c);
    box-shadow:0 1px 4px rgba(0,0,0,.55);
  }
  .duilian::before{top:-6px}
  .duilian::after{bottom:-6px;height:7px}

  /* 厅堂团花（衬在卡片后面，填补中部空白） */
  .a-hall{
    position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
    width:min(74vw,660px);aspect-ratio:1/1;z-index:0;pointer-events:none;opacity:.85;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480' viewBox='0 0 480 480'><g fill='none' stroke='%23ffd08a' stroke-width='1.3'><circle cx='240' cy='240' r='230' stroke-opacity='.16'/><circle cx='240' cy='240' r='221' stroke-opacity='.07'/><circle cx='240' cy='240' r='172' stroke-opacity='.10' stroke-dasharray='1 11' stroke-linecap='round'/><circle cx='240' cy='240' r='120' stroke-opacity='.06'/><circle cx='240' cy='240' r='58' stroke-opacity='.05'/><g stroke-opacity='.11'><path d='M240 108 l24 24 -24 24 -24 -24 z'/><path d='M240 372 l24 -24 -24 -24 -24 24 z'/><path d='M108 240 l24 24 -24 24 -24 -24 z'/><path d='M372 240 l24 24 -24 24 -24 -24 z'/></g></g></svg>") center/contain no-repeat,
      radial-gradient(circle, rgba(255,150,80,.13), transparent 66%);
  }
  /* 地台：元宝铜钱云纹 */
  .a-ground{
    position:absolute;left:0;right:0;bottom:0;height:112px;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(26,4,3,.34) 58%,rgba(16,2,2,.66));
  }
  .a-ground svg{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:min(1180px,100%);height:auto}

  /* 底部卖点 */
  .a-tags{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:10.5px;color:#e9bfa0;letter-spacing:.6px;opacity:.92;
  }
  .a-tags i{width:3px;height:3px;border-radius:50%;background:rgba(247,201,92,.62)}
  @media (max-width:1080px){
    .a-fig{width:224px;height:318px;bottom:62px}
    .a-fig .fig{width:186px;height:279px}
    .duilian{width:56px;height:200px;bottom:82px}
    .a-fig.l .duilian{left:150px}
    .a-fig.r .duilian{right:150px}
    .duilian span{font-size:27px;letter-spacing:5px}
    .a-lantern{width:48px;height:102px}
    .a-lantern svg{height:80px}
    .a-lantern.l{left:11.5%}
    .a-lantern.r{right:11.5%}
  }
  @media (max-width:980px){
    /* 中等宽度：人物放大到接近满尺寸，对联挂在身侧（不遮脸、不挡腿） */
    .a-fig{width:190px;height:300px;bottom:22px}
    .a-fig.l{left:4px}
    .a-fig.r{right:4px}
    .a-fig .fig{width:188px;height:282px}
    .duilian{width:42px;height:136px;bottom:38px}
    .a-fig.l .duilian{left:130px}
    .a-fig.r .duilian{right:130px}
    .duilian span{font-size:19px;letter-spacing:3px}
    .a-lantern{width:44px;height:94px}
    .a-lantern svg{height:74px}
    .a-lantern.l{left:10%}
    .a-lantern.r{right:10%}
  }
  @media (max-width:820px){
    /* 网页内嵌面板通常只有 700~800 宽：卡片收窄腾出边，人保持够大 */
    .auth-wrap{max-width:332px}
    .a-fig{width:182px;height:292px;bottom:18px}
    .a-fig.l{left:2px}
    .a-fig.r{right:2px}
    .a-fig::before{width:172px;height:52px}
    .a-fig .fig{width:182px;height:276px}
    .a-fig .fig .av{filter:drop-shadow(0 12px 20px rgba(0,0,0,.62)) drop-shadow(0 0 20px rgba(255,170,96,.3))}
    .duilian{width:38px;height:128px;bottom:34px}
    .a-fig.l .duilian{left:124px}
    .a-fig.r .duilian{right:124px}
    .duilian span{font-size:17px;letter-spacing:2.6px}
    .a-lantern{width:42px;height:90px}
    .a-lantern svg{height:70px}
    .a-lantern.l{left:7%}
    .a-lantern.r{right:7%}
  }
  @media (max-width:660px){
    /* 再窄一档：卡片收窄腾出边，人物继续缩小但仍留在场上 */
    .auth-wrap{max-width:318px}
    .a-fig{width:140px;height:226px;bottom:16px}
    .a-fig::before{width:132px;height:40px}
    .a-fig .fig{width:140px;height:210px}
    .duilian{width:32px;height:94px;bottom:10px}
    .a-fig.l .duilian{left:74px}
    .a-fig.r .duilian{right:74px}
    .duilian span{font-size:14px;letter-spacing:2px}
    #scrAuth .hint{font-size:11px;line-height:1.5}
    .a-lantern{width:32px;height:70px}
    .a-lantern svg{height:54px}
    .a-lantern.l{left:5%}
    .a-lantern.r{right:5%}
  }
  @media (max-width:570px){
    /* 手机竖屏真的放不下，才隐藏 */
    .a-fig,.a-lantern{display:none}
    .a-ground{height:86px}
  }
  @media (prefers-reduced-motion:reduce){
    .a-lantern,.a-lantern .tas,.a-fig,.a-fig .fig,.duilian{animation:none !important}
  }
  .brand-big{text-align:center;transform:translateY(-4px);position:relative}

  .brand-big .logo{
    font-size:34px;font-weight:900;letter-spacing:8px;color:#ffe7ad;
    text-shadow:0 2px 0 #8a5b06, 0 10px 24px rgba(0,0,0,.55);
  }
  .brand-big .sub{font-size:11.5px;color:var(--dim);letter-spacing:2px;margin-top:6px}
  .auth-card{
    background:linear-gradient(180deg,rgba(64,12,10,.96),rgba(38,7,6,.96));
    border:1px solid rgba(255,210,120,.22);border-radius:20px;padding:16px;
    box-shadow:0 28px 60px -24px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .tabs{display:flex;gap:6px;background:rgba(0,0,0,.3);padding:4px;border-radius:12px;margin-bottom:14px}
  .tab{
    flex:1;padding:8px;border:0;border-radius:9px;background:transparent;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;color:#d9ab94;transition:.15s
  }
  .tab.on{background:linear-gradient(180deg,var(--gold-l),var(--gold) 50%,var(--gold-d));color:#5a3a06;box-shadow:0 2px 8px -3px rgba(0,0,0,.6)}
  .form{display:flex;flex-direction:column;gap:10px}
  .form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#e6bca4;font-weight:600}
  .form input{
    font-family:inherit;font-size:14px;color:#fff6ea;padding:11px 12px;border-radius:10px;
    background:rgba(0,0,0,.26);border:1px solid rgba(255,206,132,.2);outline:none;transition:.15s
  }
  .form input::placeholder{color:#b98a76}
  .form input:focus{border-color:rgba(247,201,92,.55);box-shadow:0 0 0 3px rgba(247,201,92,.1)}
  .err{font-size:11.5px;color:#ff9b8a;min-height:15px;line-height:15px}
  .hint{font-size:10.5px;color:#b98a76;text-align:center;line-height:1.5}
  .avatar-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:2px 0;justify-items:center}
  .avatar-pick button{
    width:38px;height:38px;border-radius:50%;font-size:19px;cursor:pointer;
    background:rgba(255,255,255,.06);border:2px solid transparent;transition:.15s;line-height:1
  }
  .avatar-pick button.on{border-color:var(--gold);background:rgba(247,201,92,.2);transform:scale(1.06)}

  /* ---------- 大厅 ---------- */
  #scrLobby{gap:12px;max-width:980px;margin:0 auto;position:relative}
  #scrLobby::before{
    content:"";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    width:min(84vw,620px);height:min(84vw,620px);pointer-events:none;z-index:0;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480' viewBox='0 0 480 480'><g fill='none' stroke='%23ffd08a' stroke-width='1.4'><circle cx='240' cy='240' r='228' stroke-opacity='.14'/><circle cx='240' cy='240' r='219' stroke-opacity='.06'/><circle cx='240' cy='240' r='168' stroke-opacity='.12' stroke-dasharray='1 10' stroke-linecap='round'/><circle cx='240' cy='240' r='96' stroke-opacity='.06'/><g stroke-opacity='.10'><path d='M240 120 l22 22 -22 22 -22 -22 z'/><path d='M240 360 l22 -22 -22 -22 -22 22 z'/><path d='M120 240 l22 22 -22 22 -22 -22 z'/><path d='M360 240 l22 22 -22 22 -22 -22 z'/></g></g></svg>") center/contain no-repeat
  }
  #scrLobby > *{position:relative;z-index:1}
  .lobby-top{display:flex;align-items:center;gap:10px}
  .user-card{
    display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:32px;
    background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.24));
    border:1px solid rgba(255,210,120,.24);cursor:pointer;color:inherit;font-family:inherit;
    transition:.15s;min-width:0
  }
  .user-card:hover{border-color:rgba(255,210,120,.5)}
  .ava{
    width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:22px;line-height:1;flex:0 0 auto;
    background:radial-gradient(circle at 35% 25%,#d3563f,#7d1d14);
    box-shadow:0 0 0 2px rgba(247,201,92,.75), 0 3px 8px rgba(0,0,0,.5)
  }
  .uinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
  .uname{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
  .uid{font-size:10px;color:#d9ab94;letter-spacing:.4px}
  .uid b{color:#ffe3c8;font-variant-numeric:tabular-nums}
  .lobby-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;overflow-y:auto;padding-bottom:4px}
  .welcome{padding:2px 4px 0}
  .w-title{font-size:20px;font-weight:900;letter-spacing:1px;color:#fff4d8;text-shadow:0 2px 10px rgba(0,0,0,.4)}
  .w-title::before{
    content:"";display:inline-block;width:7px;height:7px;margin-right:10px;border-radius:1px;
    background:linear-gradient(180deg,#ffeab4,#dc9a1e);
    transform:rotate(45deg) translateY(-2px);vertical-align:middle;
    box-shadow:0 0 10px rgba(247,201,92,.6)
  }
  .w-sub{font-size:12px;color:var(--dim);margin-top:5px}
  .modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:auto 0}
  .mode-card{
    position:relative;overflow:hidden;text-align:left;cursor:pointer;font-family:inherit;color:inherit;
    padding:16px;border-radius:18px;border:1px solid rgba(255,210,120,.32);
    display:flex;flex-direction:column;min-height:172px;
    background:linear-gradient(150deg,rgba(180,46,33,.96),rgba(82,15,11,.97));

  /* ---------- 牌桌 ---------- */

  .table{
    flex:1;min-height:0;position:relative;overflow:hidden;
    display:flex;gap:8px;
    border-radius:24px;padding:20px 22px 16px;
    background:
      linear-gradient(176deg,rgba(255,214,160,.16),rgba(255,214,160,0) 22%),
      repeating-linear-gradient(93deg, rgba(255,214,160,.045) 0 1px, rgba(0,0,0,.05) 1px 3px, rgba(0,0,0,0) 3px 11px),
      linear-gradient(180deg,#8b4c26 0%,#6c3216 18%,#4d2211 52%,#33150b 82%,#24100a 100%);
    border:1px solid rgba(255,206,132,.36);
    box-shadow:
      0 28px 64px -32px rgba(0,0,0,.95),
      inset 0 2px 0 rgba(255,222,176,.30),
      inset 0 -4px 12px rgba(0,0,0,.6),
      inset 0 0 46px rgba(0,0,0,.42);
  }
  /* 桌面木纹高光 */
  .table::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;border-radius:23px;
    background:
      radial-gradient(120% 60% at 50% -14%,rgba(255,196,120,.16),transparent 62%),
      repeating-linear-gradient(90deg,rgba(255,240,210,.04) 0 2px,transparent 2px 13px);
    mix-blend-mode:screen;opacity:.6;
  }
  /* 桌沿鎏金铜钱 */
  .table::after{
    content:"";position:absolute;inset:16px;z-index:0;pointer-events:none;border-radius:16px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='52' height='52' viewBox='0 0 52 52'><g fill='none' stroke='%23ffd08a' stroke-width='1.2'><circle cx='26' cy='26' r='11' stroke-opacity='.22'/><rect x='21.5' y='21.5' width='9' height='9' stroke-opacity='.22'/><g stroke-opacity='.12'><path d='M26 9 v5 M26 38 v5 M9 26 h5 M38 26 h5'/></g></g></svg>");
    background-position:14px 12px, calc(100% - 14px) 12px, 14px calc(100% - 12px), calc(100% - 14px) calc(100% - 12px);
    background-size:34px 34px;
    background-repeat:no-repeat;
  }
  .table > *{min-width:0;position:relative;z-index:1}
  .table > .t-scene{z-index:0;position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:23px}
  /* 桌面木沿（内圈抛光） */
  .t-rim{
    position:absolute;inset:9px;border-radius:19px;
    background:
      linear-gradient(178deg,rgba(255,214,160,.24) 0%,rgba(255,214,160,.04) 16%,rgba(0,0,0,.16) 100%),
      linear-gradient(180deg,#62300f,#3f1c0a 58%,#2a1006);
    box-shadow:
      inset 0 1px 0 rgba(255,226,180,.34),
      inset 0 -2px 6px rgba(0,0,0,.6),
      0 3px 10px rgba(0,0,0,.45);
  }
  /* 台呢 */
  .t-felt{
    position:absolute;inset:16px;border-radius:14px;overflow:hidden;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' seed='7'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.5'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480' viewBox='0 0 480 480'><g fill='none' stroke='%23ffd08a'><circle cx='240' cy='240' r='226' stroke-width='2' stroke-opacity='.22'/><circle cx='240' cy='240' r='214' stroke-width='1' stroke-opacity='.10'/><circle cx='240' cy='240' r='164' stroke-width='1.4' stroke-opacity='.18' stroke-dasharray='1 11' stroke-linecap='round'/><circle cx='240' cy='240' r='88' stroke-width='1' stroke-opacity='.10'/><g stroke-width='1.6' stroke-opacity='.20'><path d='M240 116 l26 26 -26 26 -26 -26 z'/><path d='M240 364 l26 -26 -26 -26 -26 26 z'/><path d='M116 240 l26 26 -26 26 -26 -26 z'/><path d='M364 240 l26 26 -26 26 -26 -26 z'/></g><g stroke-width='1' stroke-opacity='.10'><circle cx='240' cy='240' r='128'/><circle cx='240' cy='240' r='58'/></g></g></svg>"),
      radial-gradient(64% 50% at 50% 30%,rgba(255,150,104,.26),rgba(255,150,104,0) 72%),
      radial-gradient(30% 34% at 8% 2%,rgba(255,196,120,.18),transparent 70%),
      radial-gradient(30% 34% at 92% 2%,rgba(255,196,120,.18),transparent 70%),
      radial-gradient(126% 118% at 50% 42%,#b02e22 0%,#8f2019 38%,#681410 72%,#480b08 100%);
    background-position:0 0, center, 0 0, 0 0, 0 0, 0 0;
    background-size:180px 180px, min(64%,460px) auto, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
    background-repeat:repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat;
    background-blend-mode:overlay, normal, normal, normal, normal, normal;
    box-shadow:
      inset 0 0 0 1px rgba(255,206,132,.24),
      inset 0 0 0 5px rgba(0,0,0,.22),
      inset 0 0 0 6px rgba(255,206,132,.10),
      inset 0 18px 42px rgba(0,0,0,.46),
      inset 0 -14px 34px rgba(0,0,0,.38),
      inset 0 0 120px rgba(0,0,0,.30);
  }
  /* 台呢织纹 */
  .t-felt::after{
    content:"";position:absolute;inset:0;
    background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.017) 0 1px,transparent 1px 2px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 2px);
  }
  .t-glow{
    position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:80%;height:300px;
    background:radial-gradient(ellipse at 50% 0%,rgba(255,204,140,.34),rgba(255,198,124,.10) 44%,transparent 74%);
    mix-blend-mode:screen;
  }
  .t-lamp{position:absolute;top:0;width:34px;height:66px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.65)) drop-shadow(0 0 14px rgba(255,150,90,.35))}

  .t-lamp.r svg{animation-delay:-3s}
  .table-main{flex:1;min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;grid-template-columns:minmax(0,1fr)}


  .seats{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}

  /* ---------- 手里拿着的牌（扇形牌背） ---------- */
  .handfan{position:absolute;pointer-events:none;z-index:4}

    position:absolute;left:calc(var(--i) * 7px);bottom:calc(var(--i) * 2px);
    width:18px;height:25px;border-radius:4px;
    background:
      repeating-linear-gradient(45deg, rgba(255,206,132,.26) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(-45deg, rgba(255,206,132,.12) 0 1px, transparent 1px 6px),

    border:1.5px solid rgba(255,206,132,.5);
    box-shadow:inset 2px 0 0 rgba(255,232,190,.28), 0 3px 7px rgba(0,0,0,.5);
    transform:rotate(calc(-19deg + var(--i) * 7.6deg));transform-origin:50% 100%
  }

  /* ================= 人物立绘 ================= */
  .av{display:block;width:100%;height:100%;overflow:visible}
  .av-head-only{width:100%;height:100%}
  .av .av-all{transform-box:fill-box;transform-origin:50% 100%;animation:avbreathe 4.4s ease-in-out infinite}
  @keyframes avbreathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.6px) scaleY(1.012)}}
  .av .av-sway{transform-box:fill-box;transform-origin:50% 96%;animation:avsway 6.4s ease-in-out infinite}
  @keyframes avsway{
    0%,100%{transform:rotate(-1.8deg) translateY(0)}
    35%{transform:rotate(1.4deg) translateY(-1.2px)}
    70%{transform:rotate(-.4deg) translateY(.6px)}
  }
  .av .av-head{transform-box:fill-box;transform-origin:50% 92%;transition:transform .42s cubic-bezier(.2,1.2,.4,1)}
  .av .av-eyes{transform-box:fill-box;transform-origin:center;animation:avblink 6.2s infinite}
  @keyframes avblink{0%,41.5%,44.5%,96.4%,100%{transform:scaleY(1)}42.4%,43.6%,97.4%,98.6%{transform:scaleY(.06)}}
  .av .av-tuft{transform-box:fill-box;transform-origin:0% 100%;animation:avtuft 3.2s ease-in-out infinite}
  @keyframes avtuft{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
  .av .av-arm{transform-box:fill-box;transform-origin:50% 4%;transition:transform .34s cubic-bezier(.2,1.2,.4,1)}
  .av .av-armL{animation:avarmL 4.2s ease-in-out infinite}
  @keyframes avarmL{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(2.2deg)}}
  .av .m,.av .b{display:none}
  .av .eye-happy,.av .eye-smug{display:none}
  .av[data-mood="happy"] .eye-open,.av[data-mood="smug"] .eye-open{display:none}
  .av[data-mood="happy"] .eye-happy{display:block}
  .av[data-mood="smug"] .eye-smug{display:block}
  .av[data-mood="smug"] .m-smug,.av[data-mood="smug"] .b-smug{display:block}
  .av[data-mood="smug"] .av-head{transform:rotate(7deg) translateY(-4px)}
  .av[data-mood="smug"] .av-eyes{animation:none}
  .av[data-mood="smug"] .av-all{animation:avsmug 2.2s ease-in-out infinite}
  @keyframes avsmug{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(.8deg)}}
  /* 出牌 / 抢地主：抬手 */
  .av.throwing .av-armR{transform:rotate(-78deg) translateY(-6px)}
  .av.throwing .av-armL{transform:rotate(12deg)}
  .av.doing .av-head{transform:rotate(-8deg) translateY(-3px)}
  .av[data-mood="idle"] .m-idle,.av[data-mood="think"] .m-think,
  .av[data-mood="happy"] .m-happy,.av[data-mood="sad"] .m-sad,.av[data-mood="angry"] .m-angry,
  .av[data-mood="play"] .m-happy{display:block}
  .av[data-mood="idle"] .b-idle,.av[data-mood="think"] .b-idle,
  .av[data-mood="happy"] .b-happy,.av[data-mood="sad"] .b-sad,.av[data-mood="angry"] .b-angry,
  .av[data-mood="play"] .b-happy{display:block}
  .av[data-mood="happy"] .av-all{animation:avhop .82s ease-in-out infinite}
  @keyframes avhop{0%,100%{transform:translateY(0) scaleY(1)}42%{transform:translateY(-12px) scaleY(1.03)}70%{transform:translateY(0) scaleY(.97)}}
  .av[data-mood="happy"] .av-armL{animation:avcheerL .82s ease-in-out infinite}
  @keyframes avcheerL{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
  .av[data-mood="play"] .av-all{animation:avnod 1.7s ease-in-out infinite}
  @keyframes avnod{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-3px) rotate(-1.5deg)}}
  .av[data-mood="sad"] .av-head{transform:translateY(7px) rotate(-5deg)}
  .av[data-mood="sad"] .av-all{animation:avsag 3.4s ease-in-out infinite}
  @keyframes avsag{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
  .av[data-mood="angry"] .av-head{transform:translateY(-2px) scale(1.03)}
  .av[data-mood="angry"] .av-all{animation:avshake .28s ease-in-out infinite}
  @keyframes avshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}}
  .av[data-mood="think"] .av-head{transform:rotate(-6deg) translateY(-2px)}
  .av[data-mood="think"] .av-sway{animation:none}
  .av .av-tear{opacity:0}
  .av[data-mood="sad"] .av-tear{opacity:.9;animation:avtear 2.6s infinite}
  @keyframes avtear{0%{transform:translateY(0);opacity:0}30%{opacity:.9}100%{transform:translateY(14px);opacity:0}}
  .av-head-only .av-tuft{animation:none}

  function sha256(msg) {
    const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const l = msg.length, bl = Math.ceil((l + 9) / 64) * 64;
    const b = new Uint8Array(bl); b.set(msg); b[l] = 0x80;
    const bits = l * 8;
    for (let i = 0; i < 4; i++) b[bl - 1 - i] = (bits >>> (8 * i)) & 0xff;
    const w = new Uint32Array(64);
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let off = 0; off < bl; off += 64) {
      for (let i = 0; i < 16; i++) {
        w[i] = ((b[off + i * 4] << 24) | (b[off + i * 4 + 1] << 16) | (b[off + i * 4 + 2] << 8) | b[off + i * 4 + 3]) >>> 0;
      }
      for (let i = 16; i < 64; i++) {
        const s0 = (rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3)) >>> 0;
        const s1 = (rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10)) >>> 0;
        w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
      }
      let a = H[0], bb = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (let i = 0; i < 64; i++) {
        const S1 = (rotr(e,6) ^ rotr(e,11) ^ rotr(e,25)) >>> 0;
        const ch = ((e & f) ^ (~e & g)) >>> 0;
        const t1 = (h + S1 + ch + K256[i] + w[i]) >>> 0;
        const S0 = (rotr(a,2) ^ rotr(a,13) ^ rotr(a,22)) >>> 0;
        const mj = ((a & bb) ^ (a & c) ^ (bb & c)) >>> 0;
        const t2 = (S0 + mj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = bb; bb = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + bb) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
    }
    const out = new Uint8Array(32);
    for (let i = 0; i < 8; i++) {
      out[i*4] = (H[i] >>> 24) & 0xff; out[i*4+1] = (H[i] >>> 16) & 0xff;

    if (window.crypto && crypto.subtle && crypto.subtle.importKey) {

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dayDiff(a, b) {
    return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  }
  function signState() {
    const t = todayStr(), s = user.sign || { last: '', streak: 0 };
    if (s.last === t) return { done: true, day: Math.min(7, s.streak || 1) };
    const next = s.last && dayDiff(s.last, t) === 1 ? (s.streak || 0) + 1 : 1;
    return { done: false, day: Math.min(7, next) };
  }

  let modelNet = null;
  function getModel() {
    if (modelNet === null) {
      if (typeof WEIGHTS !== 'undefined' && WEIGHTS && WEIGHTS.W1 && WEIGHTS.W1.length > 0) {
        modelNet = D.MLP.fromJSON(WEIGHTS);

  function policyFor(level) {
    if (level === 'hard' || level === 'grand') {
      const net = getModel();
      if (net) {
        return D.makeEnsemblePolicy(net, level === 'grand'
          ? { name: 'grand', passMargin: 0.01, epsilon: 0.02 }
          : { name: 'ensemble' });
      }
      return D.HeuristicBot;
    }
    if (level === 'easy') {
      const base = D.HeuristicBot;
      return {
        name: 'easy',
        chooseBid: function (g, s) { return Math.random() < 0.5 ? 0 : base.chooseBid(g, s); },
        chooseMove: function (g, s) {
          if (Math.random() < 0.38) {
            const ms = D.genMoves(g.hands[s], g.lastSeat === s ? null : g.lastMove);
            if (!ms.length) return null;
            if (g.canPass() && Math.random() < 0.5) return null;
            return ms[(Math.random() * ms.length) | 0];
          }
          return base.chooseMove(g, s);
        }
      };
    }
    return D.HeuristicBot;
  }

  let AC = null;
  function ac() {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
    } catch (e) { AC = null; }
    return AC;
  }
  function sfx(kind) {
    const c = ac(); if (!c) return;
    const t = c.currentTime;
    try {
      if (kind === 'flick' || kind === 'deal') {
        const dur = 0.09;
        const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.6);
        const src = c.createBufferSource(); src.buffer = buf;
        const bp = c.createBiquadFilter(); bp.type = 'bandpass';
        bp.frequency.value = kind === 'deal' ? 1500 : 2200; bp.Q.value = 0.9;
        const g = c.createGain(); g.gain.value = kind === 'deal' ? 0.14 : 0.24;
        src.connect(bp); bp.connect(g); g.connect(c.destination);
        src.start(t);
        return;
      }
      if (kind === 'thud') {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(148, t);
        o.frequency.exponentialRampToValueAtTime(56, t + 0.18);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.22);
        return;
      }
      if (kind === 'bid' || kind === 'coin') {
        const base = kind === 'bid' ? 900 : 1220;
        [0, 0.075].forEach((dt, i) => {
          const o = c.createOscillator(), g = c.createGain();
          o.type = 'triangle'; o.frequency.value = base * (i ? 1.5 : 1);
          g.gain.setValueAtTime(0.0001, t + dt);
          g.gain.exponentialRampToValueAtTime(0.17, t + dt + 0.014);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.17);
          o.connect(g); g.connect(c.destination);
          o.start(t + dt); o.stop(t + dt + 0.2);
        });
        return;
      }
      if (kind === 'pass') {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(430, t);
        o.frequency.exponentialRampToValueAtTime(300, t + 0.13);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.09, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.19);
      }
    } catch (e) { }
  }

    setTimeout(() => { if (b.parentNode) b.remove(); }, 3300);
  }

  function npcSay(seat, kind) {
    const arr = NPC_LINES[kind];
    if (!arr || !arr.length) return;
    setTimeout(() => say(seat, arr[(Math.random() * arr.length) | 0]), 300);
  }

  /* ---------- 剩牌告急（<=2 张）---------- */
  const LOW_LINES = {
    2: ['我就剩两张牌了！', '就两张，你说怎么拦？'],
    1: ['最后一张牌，接得住吗？', '一张牌，我赢定了！']
  };
  const LOW_TAUNT = {
    2: ['小心，他就剩两张了！', '别放他走，他两张牌了'],
    1: ['他就一张牌了，快压死他！']
  };
  let lowWarned = { 0: false, 1: false, 2: false };
  let lowTimer = null;

  function checkLowCards() {
    if (!game || game.phase !== 'play' || roundOver) return;
    if (lowTimer) return;
    lowTimer = setTimeout(() => {
      lowTimer = 0;
      if (!game || game.phase !== 'play' || roundOver) return;
      for (const s of [1, 2]) {
        const n = game.handSize(s);
        if (n > 0 && n <= 2 && !lowWarned[s]) {
          lowWarned[s] = true;
          say(s, LOW_LINES[n][(Math.random() * LOW_LINES[n].length) | 0]);
          setSeatMood(s, 'smug', 3200);
          speak(n === 2 ? '我就剩两张牌了' : '我就剩一张牌了', s);
          flashAvatar(s, 520);
          setMood(el('tbAv'), 'angry', 1300);
          el('thMood').textContent = '小心！他只剩 ' + n + ' 张';
        }
      }
      const hn = game.handSize(HUMAN);
      if (hn > 0 && hn <= 2 && !lowWarned[0]) {
        lowWarned[0] = true;
        const who = Math.random() < 0.5 ? 1 : 2;
        say(who, LOW_TAUNT[hn][(Math.random() * LOW_TAUNT[hn].length) | 0]);
        setSeatMood(who, 'smug', 2800);
        speak(hn === 2 ? '他就剩两张牌了' : '他就剩一张牌了', who);
      }
    }, 420);
  }

  /* ---------- 手持牌扇 ---------- */
  function fanHtml(n, max) {
    if (!n) return '';
    const k = Math.max(1, Math.min(max || 6, Math.ceil(n / 3)));
    let h = '';
    for (let i = 0; i < k; i++) h += '<i style="--i:' + i + '"></i>';
    return h;
  }

  function paintHandFans() {
    if (!game) return;
    const playing = !roundOver && (game.phase === 'play' || game.phase === 'bid');
    for (const s of [1, 2]) {
      const box = el('hand' + s);
      if (!box) continue;
      const n = playing ? game.handSize(s) : 0;
      box.innerHTML = fanHtml(n, 5);
      box.classList.toggle('hide', !n);
    }
    const hb = el('heroHand');
    if (hb) {
      const n = playing ? game.handSize(HUMAN) : 0;
      hb.innerHTML = fanHtml(n, 6);
      hb.classList.toggle('hide', !n);
    }
  }

  /* ---------- 飞牌 ---------- */
  function playSlot(seat) {
    return playsEl.querySelector('.playslot[data-seat="' + seat + '"]');
  }

  function flyCards(fromRect, targets, ids, seat) {
    const layer = el('flyLayer');
    if (!layer || !fromRect || !targets.length) return false;
    sfx('flick');
    ids.forEach((id, i) => {
      const t = targets[Math.min(i, targets.length - 1)];
      if (!t) return;
      const r = t.getBoundingClientRect();
      const c = cardEl(id, { small: true });
      c.classList.add('flyc');
      c.style.left = Math.round(fromRect.left + fromRect.width / 2 - 21) + 'px';
      c.style.top = Math.round(fromRect.top + fromRect.height / 2 - 30) + 'px';
      layer.appendChild(c);
      const dx = (r.left + r.width / 2) - (fromRect.left + fromRect.width / 2);
      const dy = (r.top + r.height / 2) - (fromRect.top + fromRect.height / 2);
      const rot = Math.random() * 32 - 16;
      c.animate([
        { transform: 'translate(0,0) rotate(' + (rot * 1.7) + 'deg) scale(.9)', opacity: 1, offset: 0 },
        { transform: 'translate(' + (dx * 0.5) + 'px,' + (dy * 0.5 - 34) + 'px) rotate(' + (rot * 0.5) + 'deg) scale(1.06)', opacity: 1, offset: 0.5 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(0deg) scale(1)', opacity: 1, offset: 1 }
      ], { duration: 330, delay: i * 32, easing: 'cubic-bezier(.3,.75,.35,1)', fill: 'forwards' }).onfinish = () => {
        c.remove();
        t.classList.remove('incoming');
        t.classList.add('landed');
      };
    });
    setTimeout(() => sfx('thud'), 330);
    return true;
  }

  function throwToTable(seat, ids, fromRect) {
    if (!ids || !ids.length) return;
    const slot = playSlot(seat);
    if (!slot) return;
    const targets = Array.prototype.slice.call(slot.querySelectorAll('.cards .c'));
    if (!targets.length) return;
    targets.forEach(t => t.classList.add('incoming'));
    requestAnimationFrame(() => {
      if (!flyCards(fromRect, targets, ids, seat)) targets.forEach(t => t.classList.remove('incoming'));
    });
    setTimeout(() => targets.forEach(t => t.classList.remove('incoming')), 1500);
  }

  function handRect(seat) {
    const n = seat === HUMAN ? el('heroHand') : el('hand' + seat);
    if (n && !n.classList.contains('hide')) return n.getBoundingClientRect();
    const f = seat === HUMAN ? el('tbAv') : el('seat' + seat);
    return f ? f.getBoundingClientRect() : null;
  }

  /* ---------- 抢地主：飞分牌 ---------- */
  function throwBidToken(seat, score) {
    const layer = el('flyLayer');
    const src = seat === HUMAN ? el('tbAv') : el('seat' + seat);
    const dst = el('bottomCards');
    if (!layer || !src || !dst) return;
    const a = src.getBoundingClientRect(), b = dst.getBoundingClientRect();
    const tok = document.createElement('div');
    tok.className = 'flytoken';
    tok.textContent = score > 0 ? score + ' 分' : '不叫';
    tok.style.left = Math.round(a.left + a.width / 2 - 26) + 'px';
    tok.style.top = Math.round(a.top + a.height * 0.4) + 'px';
    layer.appendChild(tok);
    const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
    const dy = (b.top - 26) - (a.top + a.height * 0.4);
    sfx('bid');
    flashAvatar(seat, 500);
    tok.animate([
      { transform: 'translate(0,0) scale(.6)', opacity: 0, offset: 0 },
      { transform: 'translate(' + (dx * 0.5) + 'px,' + (dy * 0.5 - 30) + 'px) scale(1.1)', opacity: 1, offset: 0.42 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.92)', opacity: 1, offset: 1 }
    ], { duration: 470, easing: 'cubic-bezier(.3,.8,.3,1)', fill: 'forwards' }).onfinish = () => {
      tok.animate([{ opacity: 1, transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.92)' },
                   { opacity: 0, transform: 'translate(' + dx + 'px,' + (dy - 16) + 'px) scale(.8)' }],
        { duration: 260, fill: 'forwards' });
      setTimeout(() => tok.remove(), 300);
    };
  }

  function isBombMove(mv) {
    if (!mv) return false;
    if (mv[16] && mv[17]) return true;
    for (let r = 3; r <= 15; r++) if (mv[r] === 4) return true;
    return false;
  }

  function buildChat() {
    const p = el('chatPanel');
    p.innerHTML =
      '<div class="chat-quick">' +
        QUICK_LINES.map((t, i) => '<button data-say="' + i + '" type="button">' + t + '</button>').join('') +
      '</div><div class="chat-emo">' +
        EMOJIS.map((e, i) => '<button data-emo="' + i + '" type="button">' + e + '</button>').join('') +
      '</div>';
    p.querySelectorAll('[data-say]').forEach(b => {
      b.onclick = () => { say(HUMAN, QUICK_LINES[+b.dataset.say]); p.classList.remove('show'); };
    });
    p.querySelectorAll('[data-emo]').forEach(b => {
      b.onclick = () => { say(HUMAN, EMOJIS[+b.dataset.emo], true); p.classList.remove('show'); };
    });
  }

  /* ================= 渲染 ================= */
  const handEl = el('hand'), playsEl = el('plays'), actionsEl = el('actions');
  const tipEl = el('tip'), overlay = el('overlay');

  function cardEl(id, opts) {
    opts = opts || {};
    const d = document.createElement('div');
    d.className = 'c' + (opts.small ? ' small' : '');
    d.dataset.id = String(id);
    const r = D.cardRank(id);
    const suit = ['♠', '♥', '♣', '♦'][id & 3];
    if (r >= 16) {
      d.classList.add('joker');
      if (r === 17) d.classList.add('red');
      d.innerHTML = '<span class="corner"><span class="r">' + (r === 16 ? '小王' : '大王') + '</span></span>';
    } else {
      if (suit === '♥' || suit === '♦') d.classList.add('red');
      d.innerHTML = '<span class="corner"><span class="r">' + D.rankLabel(r) + '</span><span class="s">' + suit + '</span></span>';
    }
    if (opts.onclick) d.addEventListener('click', opts.onclick);
    return d;
  }

  function renderHand() {
    handEl.innerHTML = '';
    const ids = D.sortIds(game.ids[HUMAN]);
    const myTurn = game.phase === 'play' && game.turn === HUMAN && !roundOver;
    for (const id of ids) {
      const c = cardEl(id, { onclick: myTurn ? () => toggleCard(id) : null });
      if (selected.has(id)) c.classList.add('sel');
      if (game.phase === 'play' && game.turn !== HUMAN) c.classList.add('dim');
      handEl.appendChild(c);
    }
    el('cnt0').textContent = game.handSize(HUMAN);
    layoutHand();
  }

  function layoutHand() {
    const wrap = handEl.parentElement;
    const cards = handEl.children;
    const n = cards.length;
    if (!n || !wrap || !wrap.clientWidth) return;
    const cw = cards[0].offsetWidth || 50;
    const avail = wrap.clientWidth - 4;
    let ov = Math.round(cw * 0.34);
    if (n > 1 && n * cw - (n - 1) * ov > avail) {
      ov = Math.ceil((n * cw - avail) / (n - 1));
    }
    if (ov < 0) ov = 0;
    handEl.style.setProperty('--ov', ov + 'px');
  }

  function toggleCard(id) {
    if (busy || roundOver) return;
    if (selected.has(id)) selected.delete(id); else selected.add(id);
    hintIdx = 0;
    renderHand();
    updateActions();
  }

  function renderSeats() {
    for (let s = 1; s <= 2; s++) {
      const hn = game.handSize(s);
      el('cnt' + s).textContent = hn;
      el('seat' + s).dataset.low = (game.phase === 'play' && !roundOver && hn > 0 && hn <= 2) ? '1' : '';
      const isL = game.landlord === s;
      const role = el('role' + s);
      role.textContent = isL ? '地主' : '农民';
      role.className = 'role' + (isL ? '' : ' farmer');
      el('seat' + s).classList.toggle('active', game.phase === 'play' && game.turn === s && !roundOver);
    }
    const r0 = el('role0');
    const isLH = game.landlord === HUMAN;
    r0.textContent = game.landlord < 0 ? '待定' : (isLH ? '地主' : '农民');
    r0.className = 'role' + (isLH || game.landlord < 0 ? '' : ' farmer');
    paintHandFans();
    checkLowCards();
  }

  function renderBottomCards() {
    const box = el('bottomCards');
    box.innerHTML = '<span class="lbl">底牌</span>';
    if (game.landlord < 0) {
      for (let i = 0; i < 3; i++) {
        const c = cardEl(0, { small: true });
        c.innerHTML = '';
        c.classList.add('cback');
        box.appendChild(c);
      }
      return;
    }
    for (const id of game.bottom) box.appendChild(cardEl(id, { small: true }));
  }

  function renderPlays() {
    playsEl.innerHTML = '';
    const order = [1, HUMAN, 2];
    const names = { 0: '我', 1: '电脑 A', 2: '电脑 B' };
    for (let i = 0; i < order.length; i++) {
      const s = order[i];
      const v = tableCards[s];
      /* 没有出牌记录的座位不渲染，但用显式列号占住位置，避免列位左右跳动 */
      if (v !== 'pass' && !(v && v.length)) continue;
      const slot = document.createElement('div');
      slot.className = 'playslot';
      slot.dataset.seat = String(s);
      slot.style.gridColumn = String(i + 1);
      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = names[s];
      slot.appendChild(nm);
      const wrap = document.createElement('div');
      wrap.className = 'cards';
      if (v === 'pass') {
        const p = document.createElement('div');
        p.className = 'passmark';
        p.textContent = '不出';
        wrap.appendChild(p);
      } else if (v && v.length) {
        const sorted = D.sortIds(v);
        for (const id of sorted) wrap.appendChild(cardEl(id, { small: true }));
      }
      slot.appendChild(wrap);
      playsEl.appendChild(slot);
    }
  }

  function updateActions() {
    actionsEl.innerHTML = '';
    if (roundOver) return;

    if (game.phase === 'bid') {
      if (game.bidTurn !== HUMAN) {
        const t = document.createElement('span');
        t.className = 'wait';
        t.textContent = '等待其他玩家叫分…';
        actionsEl.appendChild(t);
        return;
      }
      const box = document.createElement('div');
      box.className = 'bidbox';
      const need = game.bestBid + 1;
      const mk = (label, score) => {
        const b = document.createElement('button');
        b.className = 'btn ' + (score === 0 ? 'ghost' : 'gold');
        b.type = 'button';
        b.textContent = label;
        b.disabled = score > 0 && score < need;
        b.onclick = () => humanBid(score);
        box.appendChild(b);
      };
      mk('不叫', 0); mk('1 分', 1); mk('2 分', 2); mk('3 分', 3);
      actionsEl.appendChild(box);
      return;
    }

    if (game.phase !== 'play') return;
    if (game.turn !== HUMAN) {
      const t = document.createElement('span');
      t.className = 'wait';
      t.textContent = '等待出牌…';
      actionsEl.appendChild(t);
      return;
    }

    const hintBtn = document.createElement('button');
    hintBtn.className = 'btn ghost'; hintBtn.type = 'button';
    hintBtn.textContent = '提示'; hintBtn.onclick = humanHint;

    const clearBtn = document.createElement('button');
    clearBtn.className = 'btn ghost'; clearBtn.type = 'button';
    clearBtn.textContent = '重选';
    clearBtn.onclick = () => { selected.clear(); hintIdx = 0; renderHand(); updateActions(); };

    const passBtn = document.createElement('button');
    passBtn.className = 'btn ghost'; passBtn.type = 'button';
    passBtn.textContent = '不出';
    passBtn.disabled = !game.canPass();
    passBtn.onclick = humanPass;

    const playBtn = document.createElement('button');
    playBtn.className = 'btn gold'; playBtn.type = 'button';
    playBtn.textContent = '出牌';
    playBtn.disabled = selected.size === 0;
    playBtn.onclick = humanPlay;

    actionsEl.appendChild(hintBtn);
    actionsEl.appendChild(clearBtn);
    actionsEl.appendChild(passBtn);
    actionsEl.appendChild(playBtn);
  }

  function render() {
    renderSeats();
    renderBottomCards();
    renderPlays();
    renderHand();
    updateActions();
    refreshCoins();
  }

  /* ================= 叫分 ================= */
  function humanBid(score) {
    if (game.phase !== 'bid' || game.bidTurn !== HUMAN) return;
    game.bid(HUMAN, score);
    setMood(el('tbAv'), score > 0 ? 'smug' : 'think', 1500);
    throwBidToken(HUMAN, score);
    speak(score > 0 ? score + '分' : '不叫', HUMAN);
    callout(HUMAN, score > 0 ? score + ' 分' : '不叫');
    el('bid1').textContent = '';
    el('bid2').textContent = '';
    afterBid();
  }

  function afterBid() {
    if (game.phase === 'redeal') {
      toast('三家都不叫，重新发牌');
      setTimeout(() => startRound(), 900);
      return;
    }
    if (game.phase === 'play') {
      tableCards = [null, null, null];
      render();
      tipEl.innerHTML = '叫分 <b>' + game.base + '</b> 分 · ' + (game.landlord === HUMAN ? '你是地主，先出牌' : '电脑是地主，先出牌');
      scheduleStep(700);
      return;
    }
    render();
    scheduleStep(750);
  }

  /* ================= 主循环 ================= */
  function scheduleStep(delay) { setTimeout(step, delay === undefined ? 700 : delay); }

  function step() {
    if (roundOver || !game) return;
    if (game.phase === 'bid') {
      if (game.bidTurn === HUMAN) {
        render();
        setMood(el('tbAv'), 'think');
        el('thMood').textContent = '要不要叫？';
        return;
      }
      const seat = game.bidTurn;
      const p = policyFor(mode.ai);
      let sc = 0;
      try { sc = p.chooseBid(game, seat); } catch (e) { sc = 0; }
      if (!game.bid(seat, sc)) game.bid(seat, 0);
      el('bid' + seat).textContent = sc > 0 ? '（' + sc + ' 分）' : '（不叫）';
      throwBidToken(seat, sc);
      speak(sc > 0 ? sc + '分' : '不叫', seat);
      callout(seat, sc > 0 ? sc + ' 分' : '不叫');
      setSeatMood(seat, sc >= 3 ? 'smug' : sc > 0 ? 'happy' : 'think', 1500);
      afterBid();
      return;
    }
    if (game.phase === 'play') {
      if (game.turn === HUMAN) {
        render();
        if (!roundOver) { setMood(el('tbAv'), 'think'); el('thMood').textContent = '轮到你了'; }
        return;
      }
      const seat = game.turn;
      const p = policyFor(mode.ai);
      let mv = null;
      try { mv = p.chooseMove(game, seat); } catch (e) { mv = null; }
      applySeatMove(seat, mv);
      return;
    }
  }

  function applySeatMove(seat, mv) {
    busy = true;
    const srcRect = handRect(seat);
    if (mv === null || mv === undefined) {
      if (!game.pass(seat)) {
        const ms = game.legalMoves(seat);
        if (ms.length) mv = ms[0]; else { game.pass(seat); mv = null; }
      }
      tableCards[seat] = 'pass';
    }
    if (mv) {
      const played = D.countsToIds(game.ids[seat], mv);
      if (!game.play(seat, mv)) {
        const ms = game.legalMoves(seat);
        if (ms.length) {
          const m2 = ms[0];
          const p2 = D.countsToIds(game.ids[seat], m2);
          game.play(seat, m2);
          tableCards[seat] = p2;
        } else { game.pass(seat); tableCards[seat] = 'pass'; }
      } else {
        tableCards[seat] = played;
      }
    }
    const playedIds = tableCards[seat];
    const isPass = playedIds === 'pass';

    if (isPass) {
      sfx('pass');
    } else if (playedIds && playedIds.length) {
      const line = moveVoice(mv);
      callout(seat, line);
      speak(line, seat);
      setSeatMood(seat, isBombMove(mv) ? 'angry' : 'play', 1200);
      flashAvatar(seat, 470);
    }

    if (game.phase === 'over') {
      roundOver = true;
      render();
      if (!isPass) throwToTable(seat, playedIds, srcRect);
      setTimeout(() => { roundOver = false; busy = false; finish(); }, isPass ? 80 : 480);
      return;
    }
    busy = false;
    if (isPass) {
      if (Math.random() < 0.28) npcSay(seat, 'pass');
    } else if (mv && isBombMove(mv)) {
      if (Math.random() < 0.55) npcSay(seat, 'bomb');
      setMood(el('tbAv'), 'sad', 1000);
      el('thMood').textContent = '被炸了';
    }
    render();
    if (!isPass) throwToTable(seat, playedIds, srcRect);
    else setSeatMood(seat, 'think', 900);
    scheduleStep(560);
  }

  /* ================= 玩家操作 ================= */
  function selectedMove() {
    const m = new Int8Array(18);
    for (const id of selected) m[D.cardRank(id)]++;
    return m;
  }

  function humanPlay() {
    if (game.turn !== HUMAN || busy) return;
    if (!selected.size) return;
    const m = selectedMove();
    const last = game.lastSeat === HUMAN ? null : game.lastMove;
    const a = D.analyze(m);
    if (!a) { toast('这不是合法牌型'); return; }
    if (!D.beats(a, last ? D.analyze(last) : null)) { toast('压不过上家，换一手'); return; }
    const selEls = [];
    selected.forEach(id => {
      const node = handEl.querySelector('.c[data-id="' + id + '"]');
      if (node) selEls.push(node);
    });
    let fromRect = handRect(HUMAN);
    if (selEls.length) {
      const a0 = selEls[0].getBoundingClientRect();
      const a1 = selEls[selEls.length - 1].getBoundingClientRect();
      fromRect = {
        left: a0.left, top: Math.min(a0.top, a1.top),
        width: Math.max(a0.width, a1.right - a0.left),
        height: Math.max(a0.height, a1.height)
      };
    }
    const played = D.countsToIds(game.ids[HUMAN], m);
    if (!game.play(HUMAN, m)) { toast('出牌失败，请重试'); return; }
    tableCards[HUMAN] = played;
    selected.clear();
    hintIdx = 0;
    const line = moveVoice(m);
    setMood(el('tbAv'), isBombMove(m) ? 'smug' : 'play', 1100);
    el('thMood').textContent = isBombMove(m) ? '放炸弹' : '出牌';
    flashAvatar(HUMAN, 470);
    callout(HUMAN, line);
    speak(line, HUMAN);
    if (game.phase === 'over') {
      roundOver = true;
      render();
      throwToTable(HUMAN, played, fromRect);
      setTimeout(() => { roundOver = false; finish(); }, 480);
      return;
    }
    render();
    throwToTable(HUMAN, played, fromRect);
    scheduleStep(520);
  }

  function humanPass() {
    if (game.turn !== HUMAN || busy) return;
    if (!game.canPass()) { toast('你是本轮首出，必须出牌'); return; }
    game.pass(HUMAN);
    tableCards[HUMAN] = 'pass';
    selected.clear();
    sfx('pass');
    setMood(el('tbAv'), 'think', 900);
    callout(HUMAN, '不出');
    render();
    scheduleStep(520);
  }

  function humanHint() {
    if (game.turn !== HUMAN) return;
    const ms = game.legalMoves(HUMAN);
    if (!ms.length) { toast('没有能压过的牌，只能不出'); return; }
    lastLegal = ms.slice().sort((x, y) => {
      const ax = D.analyze(x), ay = D.analyze(y);
      if (ax.n !== ay.n) return ax.n - ay.n;
      return ax.r - ay.r;
    });
    if (hintIdx >= lastLegal.length) { hintIdx = 0; toast('已循环到最小一手'); }
    const m = lastLegal[hintIdx++];
    selected.clear();
    const ids = D.countsToIds(game.ids[HUMAN], m);
    for (const id of ids) selected.add(id);
    renderHand();
    updateActions();
  }

  /* ================= 结算 ================= */
  function finish() {
    roundOver = true;
    busy = false;
    render();

    const L = game.landlord;
    const landlordWon = game.winner === L;
    const iAmLandlord = HUMAN === L;
    const iWon = iAmLandlord === landlordWon;

    const share = iAmLandlord ? 2 : 1;
    const stake = mode.base * game.base * game.multiplier;
    let delta = stake * share * (iWon ? 1 : -1);
    if (!mode.coin) delta = 0;

    const extras = [];
    if (user) {
      ensureProfile(user);
      if (delta > 0 && user.buff.doubleUntil > Date.now()) {
        delta *= 2;
        extras.push('翻倍卡 ×2');
      }
      if (delta < 0 && user.buff.shield > 0) {
        user.buff.shield--;
        delta = Math.ceil(delta / 2);
        extras.push('护身符减半');
      }
      const lvBefore = levelOf(user.exp);
      user.exp = (user.exp || 0) + 30 + (iWon ? 25 : 0);
      const lvAfter = levelOf(user.exp);
      if (lvAfter > lvBefore) {
        const bonus = 200 * lvAfter;
        user.coins += bonus;
        extras.push('升到 Lv.' + lvAfter + ' · +' + bonus);
      }
    }

    let broke = false;
    if (user) {
      user.stats = user.stats || { games: 0, wins: 0, best: 0 };
      user.stats.games++;
      if (iWon) user.stats.wins++;
      if (delta !== 0) {
        const after = user.coins + delta;
        if (after < 0) { delta = -user.coins; broke = true; }   /* 赔不起就按剩余金币结算 */
        user.coins = Math.max(0, user.coins + delta);
        if (user.coins > (user.stats.best || 0)) user.stats.best = user.coins;
      }
      saveUser();
    }
    refreshCoins();

    if (iWon) { setMood(el('tbAv'), 'happy'); el('thMood').textContent = '赢麻了'; }
    else { setMood(el('tbAv'), 'sad'); el('thMood').textContent = '下次赢回来'; }
    if (iWon) npcSay(Math.random() < 0.5 ? 1 : 2, 'lose');
    else npcSay(game.winner === HUMAN ? 1 : game.winner, 'win');

    el('ovTitle').textContent = iWon ? '你赢了' : '你输了';
    const bits = [];
    bits.push(landlordWon ? '地主获胜' : '农民获胜');
    if (game.spring) bits.push((landlordWon ? '春天' : '反春天') + ' ×2');
    if (game.bombCount > 0) bits.push('炸弹 ' + game.bombCount + ' 次');
    if (mode.coin) {
      bits.push('底分 ' + mode.base + ' × 叫分 ' + game.base + ' × 倍数 ' + game.multiplier + ' × ' + share + ' 份');
    }
    if (broke) bits.push('金币不足，已按剩余金币结算');
    for (const x of extras) bits.push(x);
    el('ovSub').innerHTML = bits.join(' · ');

    const dEl = el('ovDelta');
    if (delta === 0) {
      dEl.className = 'delta zero';
      dEl.innerHTML = '—';
      el('ovBal').textContent = '当前金币 ' + fmt(user ? user.coins : 0);
    } else {
      dEl.className = 'delta ' + (delta > 0 ? 'win' : 'lose');
      dEl.innerHTML = fmtSigned(delta) + '<span class="u">金币</span>';
      el('ovBal').textContent = '余额 ' + fmt(user.coins) + ' 金币';
    }
    overlay.classList.add('show');
  }

  /* ================= 开局 ================= */
  function startRound() {
    overlay.classList.remove('show');
    roundOver = false;
    busy = false;
    selected.clear();
    hintIdx = 0;
    tableCards = [null, null, null];
    lowWarned = { 0: false, 1: false, 2: false };
    clearTimeout(lowTimer);
    lowTimer = 0;
    document.querySelectorAll('.callout, .flyc, .flytoken').forEach(n => n.remove());
    el('bid1').textContent = '';
    el('bid2').textContent = '';
    el('chatPanel').classList.remove('show');
    paintTableHero('idle', '准备中');
    game = new D.Game();
    tipEl.innerHTML = '叫分抢地主，最高分者当地主';
    render();
    if (game.bidTurn === HUMAN) return;
    scheduleStep(800);
  }

  /* ================= 抽屉 ================= */
  const drawer = el('drawer'), drawerBody = el('drawerBody');
  function openDrawer(html) {
    drawerBody.innerHTML = html;
    drawer.classList.add('show');
  }
  function closeDrawer() { drawer.classList.remove('show'); }
  drawer.addEventListener('click', e => { if (e.target === drawer) closeDrawer(); });

  document.addEventListener('click', e => {
    if (e.target.closest('[data-close-drawer]')) closeDrawer();
  });

  /* ================= 活动面板 ================= */
  function openSign() {
    ensureProfile(user);
    const ss = signState();
    let cells = '';
    for (let i = 0; i < 7; i++) {
      const day = i + 1;
      const got = ss.done ? day <= ss.day : day < ss.day;
      const today = !ss.done && day === ss.day;
      cells += '<div class="sign-cell' + (got ? ' got' : '') + (today ? ' today' : '') + '">' +
        '<div class="d">第 ' + day + ' 天</div><div class="r">' + SIGN_REWARDS[i] + '</div>' +
        '<div class="st">' + (got ? '已领' : today ? '可领' : '') + '</div></div>';
    }
    openDrawer(
      '<h3>每日签到<button class="icon-btn" data-close-drawer type="button">✕</button></h3>' +
      '<div style="font-size:11.5px;color:#e8bda6;margin-bottom:10px">连签奖励逐日递增，断签从第 1 天重来</div>' +
      '<div class="sign-grid">' + cells + '</div>' +
      '<div class="row-btns"><button class="btn gold" id="sgGo" type="button"' + (ss.done ? ' disabled' : '') + '>' +
        (ss.done ? '今日已签到' : '领取 ' + SIGN_REWARDS[ss.day - 1] + ' 金币') + '</button></div>'
    );
    const go = el('sgGo');
    if (go) go.onclick = () => {
      const st = signState();
      if (st.done) return;
      const gain = SIGN_REWARDS[st.day - 1];
      user.sign = { last: todayStr(), streak: st.day };
      user.coins += gain;
      saveUser(); refreshCoins(); paintLobby(); closeDrawer();
      toast('签到成功，+' + gain + ' 金币');
      setMood(el('heroAv'), 'happy', 1700);
    };
  }

  function openLevel() {
    ensureProfile(user);
    const lv = levelOf(user.exp);
    let rows = '';
    for (let i = 1; i <= 10; i++) {
      const need = (i - 1) * LEVEL_STEP;
      const got = (user.exp || 0) >= need;
      rows += '<div class="lvl-row' + (got ? ' done' : '') + '">' +
        '<span class="tag">Lv.' + i + '</span><span class="nm">' + levelTitle(i) + '</span>' +
        '<span class="rw">' + (i === 1 ? '—' : 200 * i + ' 金币') + '</span></div>';
    }
    openDrawer(
      '<h3>升级奖励<button class="icon-btn" data-close-drawer type="button">✕</button></h3>' +
      '<div style="font-size:11.5px;color:#e8bda6;margin-bottom:8px">每局 +30 经验，赢局再 +25。当前 Lv.' + lv + ' ' + levelTitle(lv) + '</div>' +
      '<div class="hero-exp" style="margin:0 0 12px"><i style="width:' +
        Math.round(((user.exp || 0) % LEVEL_STEP) / LEVEL_STEP * 100) + '%"></i></div>' +
      '<div class="lvl-list">' + rows + '</div>' +
      '<div style="font-size:10px;color:#b98a76;margin-top:10px">升级那一刻奖励自动到账，不用手动领</div>'
    );
  }

  function priceOf(id) {
    if (id.indexOf('outfit_') === 0) { const o = OUTFITS[id.slice(7)]; return o ? o.price : 0; }
    if (ACC[id]) return ACC[id].price;
    if (ITEMS[id]) return ITEMS[id].price;
    return 0;
  }

  function openShop(tab) {
    tab = tab || 'skin';
    ensureProfile(user);
    let body = '';
    if (tab === 'skin') {
      body = Object.keys(OUTFITS).map(k => {
        const o = OUTFITS[k], id = 'outfit_' + k;
        const owned = o.price === 0 || owns(id);
        return skuRow(o.name, o.desc, o.price, owned, id, '衣服', o.cloth);
      }).join('');
    } else if (tab === 'acc') {
      body = Object.keys(ACC).map(k => {
        const a = ACC[k];
        return skuRow(a.icon + ' ' + a.name, a.desc, a.price, owns(k), k, '饰品', '');
      }).join('');
    } else {
      body = Object.keys(ITEMS).map(k => {
        const it = ITEMS[k], n = user.bag[k] || 0;
        return '<div class="sku"><div class="thumb">' + it.icon + '</div><div class="body">' +
          '<div class="nm">' + it.name + (n ? ' · 已有 ' + n : '') + '</div>' +
          '<div class="ds">' + it.desc + '</div><div class="pr">' + it.price + ' 金币</div></div>' +
          '<button class="btn sm gold" data-buy="' + k + '" type="button">购买</button></div>';
      }).join('');
    }
    openDrawer(
      '<h3>商城<button class="icon-btn" data-close-drawer type="button">✕</button></h3>' +
      '<div class="shop-tabs">' +
        '<button data-tab="skin" class="' + (tab === 'skin' ? 'on' : '') + '" type="button">衣服</button>' +
        '<button data-tab="acc" class="' + (tab === 'acc' ? 'on' : '') + '" type="button">饰品</button>' +
        '<button data-tab="item" class="' + (tab === 'item' ? 'on' : '') + '" type="button">道具</button>' +
      '</div><div class="shop-grid">' + body + '</div>' +
      '<div style="font-size:10px;color:#b98a76;margin-top:10px">余额 <b style="color:#ffe3b0">' +
        fmt(user.coins) + '</b> 金币 · 买到的衣服饰品在「换装」里穿</div>'
    );
    drawerBody.querySelectorAll('.shop-tabs button').forEach(b => {
      b.onclick = () => openShop(b.dataset.tab);
    });
    drawerBody.querySelectorAll('[data-buy]').forEach(b => {
      b.onclick = () => buy(b.dataset.buy);
    });
    drawerBody.querySelectorAll('[data-wear]').forEach(b => {
      b.onclick = () => wearOutfit(b.dataset.wear);
    });
    drawerBody.querySelectorAll('[data-dress]').forEach(b => {
      b.onclick = () => dressAcc(b.dataset.dress);
    });
  }

  function skuRow(name, desc, price, owned, id, cat, color) {
    const thumb = color
      ? '<div class="thumb" style="background:' + color + ';border-color:rgba(0,0,0,.18)"></div>'
      : '<div class="thumb">' + (ACC[id] ? ACC[id].icon : '🎁') + '</div>';
    const act = owned
      ? '<button class="btn sm ghost" data-' + (cat === '衣服' ? 'wear' : 'dress') + '="' + id + '" type="button">' +
          (cat === '衣服' ? '穿上' : '戴/取') + '</button>'
      : '<button class="btn sm gold" data-buy="' + id + '" type="button">购买</button>';
    return '<div class="sku">' + thumb + '<div class="body"><div class="nm">' + name + '</div>' +
      '<div class="ds">' + desc + '</div><div class="pr">' + (owned ? '已拥有' : price + ' 金币') + '</div></div>' + act + '</div>';
  }

  function buy(id) {
    const p = priceOf(id);
    if (!p) return;
    if (user.coins < p) { toast('金币不够，先去打几局'); return; }
    user.coins -= p;
    if (ITEMS[id]) {
      user.bag[id] = (user.bag[id] || 0) + 1;
      toast('已购买 ' + ITEMS[id].name);
      saveUser(); refreshCoins(); paintLobby();
      openShop('item');
    } else {
      if (user.owned.indexOf(id) < 0) user.owned.push(id);
      toast('已购买，可以穿上了');
      saveUser(); refreshCoins(); paintLobby();
      openShop(id.indexOf('outfit_') === 0 ? 'skin' : 'acc');
    }
  }

  function wearOutfit(id) {
    user.look.outfit = id.slice(7);
    saveUser(); paintHero();
    toast('已换上 ' + (OUTFITS[user.look.outfit] ? OUTFITS[user.look.outfit].name : ''));
  }

  function dressAcc(id) {
    const a = ACC[id];
    if (!a) return;
    user.look[a.slot] = user.look[a.slot] === id ? '' : id;
    saveUser(); paintHero();
    toast(user.look[a.slot] === id ? '已戴上 ' + a.name : '已取下 ' + a.name);
    openShop('acc');
  }

  function openBag() {
    ensureProfile(user);
    const keys = Object.keys(ITEMS).filter(k => (user.bag[k] || 0) > 0);
    let html = '<h3>背包<button class="icon-btn" data-close-drawer type="button">✕</button></h3>';
    if (!keys.length) {
      html += '<div style="font-size:12px;color:#e8bda6;padding:6px 0 10px">背包是空的，去商城看看道具</div>';
    }
    html += '<div class="shop-grid">' + keys.map(k => {
      const it = ITEMS[k];
      return '<div class="sku"><div class="thumb">' + it.icon + '</div><div class="body">' +
        '<div class="nm">' + it.name + ' ×' + user.bag[k] + '</div><div class="ds">' + it.desc + '</div></div>' +
        '<button class="btn sm gold" data-use="' + k + '" type="button">使用</button></div>';
    }).join('') + '</div>';
    html += '<div style="font-size:10px;color:#b98a76;margin-top:10px">生效中的增益会显示在大厅人物下方</div>';
    openDrawer(html);
    drawerBody.querySelectorAll('[data-use]').forEach(b => {
      b.onclick = () => useItem(b.dataset.use);
    });
  }

  function useItem(k) {
    ensureProfile(user);
    if (!user.bag[k]) return;
    if (k === 'item_double') {
      const now = Date.now();
      user.buff.doubleUntil = Math.max(now, user.buff.doubleUntil || 0) + 30 * 60000;
    } else if (k === 'item_shield') {
      user.buff.shield = (user.buff.shield || 0) + 1;
    } else if (k === 'item_lucky') {
      user.buff.lucky = (user.buff.lucky || 0) + 1;
    }
    user.bag[k]--;
    if (!user.bag[k]) delete user.bag[k];
    saveUser(); refreshCoins(); paintLobby(); openBag();
    toast(ITEMS[k].name + ' 已生效');
  }

  function openCustom() {
    ensureProfile(user);
    const L = user.look;
    const btn = (key, v, on, inner, style) =>
      '<button data-set="' + key + '" data-v="' + v + '"' + (on ? ' class="on"' : '') +
      (style ? ' style="' + style + '"' : '') + ' type="button">' + inner + '</button>';

    let hairBtns = '';
    for (let i = 0; i < HAIRS.length; i++) {
      if (HAIRS[i].sex !== L.sex) continue;
      hairBtns += btn('hair', i, (L.hair | 0) === i, HAIRS[i].name);
    }
    const skinBtns = SKINS.map((c, i) => btn('skin', i, (L.skin | 0) === i, '', 'background:' + c)).join('');
    const colorBtns = HAIR_COLORS.map((c, i) => btn('hairColor', i, (L.hairColor | 0) === i, '', 'background:' + c)).join('');

    openDrawer(
      '<h3>换装<button class="icon-btn" data-close-drawer type="button">✕</button></h3>' +
      '<div class="custom-preview" id="cPrev"></div>' +
      '<div class="field" style="margin-bottom:8px"><span>性别</span><div class="seg">' +
        btn('sex', 'm', L.sex === 'm', '男') + btn('sex', 'f', L.sex === 'f', '女') + '</div></div>' +
      '<div class="field" style="margin-bottom:8px"><span>体型</span><div class="seg">' +
        Object.keys(BODIES).map(k => btn('body', k, L.body === k, BODIES[k].label)).join('') + '</div></div>' +
      '<div class="field" style="margin-bottom:8px"><span>肤色</span><div class="seg sw">' + skinBtns + '</div></div>' +
      '<div class="field" style="margin-bottom:8px"><span>发型</span><div class="seg">' + hairBtns + '</div></div>' +
      '<div class="field" style="margin-bottom:8px"><span>发色</span><div class="seg sw">' + colorBtns + '</div></div>' +
      '<div class="row-btns"><button class="btn ghost" id="csShop" type="button">去商城买衣服 / 饰品</button></div>'
    );
    const prev = el('cPrev');
    const draw = () => { prev.innerHTML = avatarSvg(user.look, 'idle'); };
    draw();

    drawerBody.querySelectorAll('[data-set]').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.set, v = b.dataset.v;
        if (k === 'sex') {
          user.look.sex = v;
          const cur = HAIRS[user.look.hair | 0];
          if (!cur || cur.sex !== v) user.look.hair = v === 'f' ? 3 : 0;
        } else if (k === 'skin' || k === 'hair' || k === 'hairColor') {
          user.look[k] = +v;
        } else {
          user.look[k] = v;
        }
        saveUser();
        drawerBody.querySelectorAll('[data-set="' + k + '"]').forEach(x => x.classList.toggle('on', x === b));
        draw(); paintHero();
        if (k === 'sex') openCustom();
      };
    });
    el('csShop').onclick = () => openShop('skin');
  }

  function openProfile() {
    if (!user) return;
    const st = user.stats || { games: 0, wins: 0, best: 0 };
    openDrawer(
      '<h3>个人资料<button class="icon-btn" data-close-drawer type="button">✕</button></h3>' +
      '<div class="stat-grid">' +
        '<div><span>玩家 ID</span><b>' + user.id + '</b></div>' +
        '<div><span>金币</span><b>' + fmt(user.coins) + '</b></div>' +
        '<div><span>总局数</span><b>' + st.games + '</b></div>' +
        '<div><span>胜率</span><b>' + (st.games ? Math.round(st.wins / st.games * 100) + '%' : '—') + '</b></div>' +
      '</div>' +
      '<div class="field">昵称<input id="pfName" maxlength="12" value="' + esc(user.nickname) + '"></div>' +
      '<div class="field" style="margin-bottom:4px">邮箱</div>' +
      '<div style="font-size:12.5px;color:#ffe3c8;margin-bottom:12px">' + esc(user.email) + '</div>' +
      '<div class="field" style="margin-bottom:4px">头像</div>' +
      '<div class="avatar-pick" id="pfAvatar"></div>' +
      '<div class="row-btns"><button class="btn gold" id="pfSave" type="button">保存修改</button></div>'
    );
    const box = el('pfAvatar');
    AVATARS.forEach(a => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = a;
      if (a === user.avatar) b.classList.add('on');
      b.onclick = () => {
        user.avatar = a;
        saveUser();
        box.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.textContent === a));
        paintLobby();
      };
      box.appendChild(b);
    });
    el('pfSave').onclick = () => {
      const n = el('pfName').value.trim();
      if (n.length < 2 || n.length > 12) { toast('昵称需要 2–12 个字符'); return; }
      user.nickname = n;
      saveUser();
      paintLobby();
      closeDrawer();
      toast('已保存');
    };
  }

  function openRank() {
    const list = Object.keys(users).map(k => users[k])
      .sort((a, b) => (b.stats && b.stats.best || b.coins) - (a.stats && a.stats.best || a.coins))
      .slice(0, 10);
    let html = '<h3>排行榜 · 最高金币<button class="icon-btn" data-close-drawer type="button">✕</button></h3><div class="rank-list">';
    if (!list.length) html += '<div style="font-size:12px;color:#d9ab94">还没有记录</div>';
    list.forEach((u, i) => {
      const v = (u.stats && u.stats.best) || u.coins;
      html += '<div class="rank-row' + (user && u.id === user.id ? ' me' : '') + '">' +
        '<div class="idx' + (i < 3 ? ' top' : '') + '">' + (i + 1) + '</div>' +
        '<div class="ava">' + (u.avatar || '🐯') + '</div>' +
        '<div class="nm">' + esc(u.nickname) + '</div>' +
        '<div class="cs">' + fmt(v) + '</div></div>';
    });
    html += '</div><div style="font-size:10.5px;color:#b98a76;margin-top:12px">排行榜统计本机所有账号的历史最高金币</div>';
    openDrawer(html);
  }

  function openGear() {
    openDrawer(
      '<h3>设置<button class="icon-btn" data-close-drawer type="button">✕</button></h3>' +
      '<div class="field" style="margin-bottom:14px">登录账号</div>' +
      '<div style="font-size:12.5px;color:#ffe3c8;line-height:1.7;margin-bottom:16px">' +
        esc(user.nickname) + '<br><span style="color:#d9ab94;font-size:11.5px">' + esc(user.email) + ' · ID ' + user.id + '</span>' +
      '</div>' +
      '<div class="row-btns"><button class="btn ghost" id="stLogout" type="button">退出登录</button></div>' +
      '<div class="row-btns"><button class="btn ghost" id="stExp" type="button">备份账号</button>' +
      '<button class="btn ghost" id="stImp" type="button">恢复账号</button></div>' +
      '<div class="row-btns"><button class="btn ghost" id="stWipe" type="button" style="color:#ff9b8a">清空本机数据</button></div>' +
      '<div style="font-size:10.5px;color:#' + (STORE.ok ? 'b98a76' : 'ffa98f') + ';margin-top:10px;line-height:1.6">' +
        '存储状态：' + (STORE.ok ? '正常 · ' + esc(STORE.origin) : '不可用 · ' + esc(STORE.why)) +
      '</div>' +
      '<div style="font-size:10.5px;color:#b98a76;margin-top:8px;line-height:1.6">' +
        '本游戏纯本地运行：账号、密码哈希、金币都存在这台机器的浏览器里，清空后无法恢复。换浏览器、换电脑、清缓存前先用「备份账号」存一份。' +
      '</div>'
    );
    el('stLogout').onclick = () => {
      localStorage.removeItem(K_SESSION);
      user = null;
      closeDrawer();
      showScreen('auth');
    };
    el('stExp').onclick = openBackup;
    el('stImp').onclick = openRestore;
    el('stWipe').onclick = () => {
      if (!window.confirm('确定清空本机所有账号与金币数据？此操作不可恢复。')) return;
      localStorage.removeItem(K_USERS);
      localStorage.removeItem(K_SESSION);
      users = {};
      user = null;
      closeDrawer();
      showScreen('auth');
      toast('已清空');

  function backupCode(u) {
    const o = {};
    BK_FIELDS.forEach(k => { if (u[k] !== undefined && u[k] !== null) o[k] = u[k]; });
    const json = JSON.stringify(o);
    let b64 = '';
    try { b64 = btoa(unescape(encodeURIComponent(json))); } catch (e) { b64 = ''; }
    return 'DDZ1-' + (b64 || json);
  }
  function parseBackup(s) {
    s = String(s || '').trim();
    if (!s) return null;
    if (s.indexOf('DDZ1-') === 0) s = s.slice(5).trim();
    let json = s;
    if (s.charAt(0) !== '{') {
      try { json = decodeURIComponent(escape(atob(s))); } catch (e) { return null; }
    }
    try {
      const o = JSON.parse(json);
      if (!o || !o.id || !o.hash || !o.salt) return null;
      return o;
    } catch (e) { return null; }
  }
