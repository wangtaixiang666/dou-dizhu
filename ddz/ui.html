  const Fireworks = (function () {
    const cv = el('fwCanvas');
    if (!cv || !cv.getContext) return { start: function () { }, stop: function () { }, active: function () { return false; } };
    const ctx = cv.getContext('2d');
    const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const HUES = [
      ['#fff2c4', '#ffb648'],   // 香槟金
      ['#ffe0b0', '#ff6a3c'],   // 橙红
      ['#ffd0e2', '#ff4f86'],   // 品红
      ['#ffe6a8', '#ffcf5c'],   // 明黄
      ['#fed9ff', '#c07bff']    // 一点紫调，避免全暖色发闷
    ];
    let W = 0, H = 0, dpr = 1, raf = 0, running = false, T = 0;
    let parts = [], rockets = [], nextAt = 0, lastDraw = 0;
    /* 尺寸系数：窄屏上烟花要跟着缩小，否则一朵就占掉半个屏幕 */
    let S = 1;

    function resize() {
      const r = cv.getBoundingClientRect();
      const w = Math.max(1, Math.round(r.width));
      const h = Math.max(1, Math.round(r.height));
      S = Math.max(0.52, Math.min(1.1, Math.min(w, h) / 760));
      if (w === W && h === H) return;   // 尺寸没变就别重置画布（会闪一下）
      dpr = Math.min(1.5, window.devicePixelRatio || 1);
      W = w;
      H = h;
      cv.width = Math.round(W * dpr);
      cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function launch() {
      /* 同屏最多两枚在飞、粒子数超过上限就不再补发，避免满屏开花 */
      if (rockets.length >= 2 || parts.length > 150) return;
      const k = Math.random();
      let x;
      /* 留出约 12% 边距，避免炸开时被画布边缘切掉 */
      if (k < 0.46) x = W * (0.13 + Math.random() * 0.17);
      else if (k < 0.92) x = W * (0.70 + Math.random() * 0.17);
      else x = W * (0.36 + Math.random() * 0.28);   /* 偶尔在中路高处补一发，增加纵深 */
      rockets.push({
        x: x, px: x,
        y: H * 0.94, py: H * 0.94,
        vy: -(H * (0.72 + Math.random() * 0.34)),
        ty: H * (0.10 + Math.random() * 0.19),
        c: HUES[(Math.random() * HUES.length) | 0]
      });
    }

    function burst(x, y, c) {
      /* 一朵烟花的粒子数与炸开直径都跟着 S 走：窄屏小一点、稀一点，别糊满屏 */
      const n = reduce ? 18 : Math.round((52 + Math.random() * 18) * S);
      const power = 0.76 + Math.random() * 0.3;   // 每发的炸开直径略有差异
      const vs = 76 * S;
      for (let i = 0; i < n; i++) {
        const ang = Math.random() * Math.PI * 2;
        /* 46% 落在壳层（炸开的边缘），其余按面积均匀铺满内部，避免炸成空心的圆圈 */
        const shell = Math.random() < 0.46;
        const rad = shell ? 0.86 + Math.random() * 0.14 : Math.sqrt(Math.random()) * 0.96;
        const sp = rad * (0.88 + Math.random() * 0.24) * power;
        parts.push({
          x: x, y: y,
          vx: Math.cos(ang) * sp * vs, vy: Math.sin(ang) * sp * vs,
          life: 1, dec: 0.0042 + Math.random() * 0.005,
          c: Math.random() < 0.66 ? c[0] : c[1],
          r: (1.1 + Math.random() * 1.5) * S,
          ph: Math.random() * 6.28
        });
      }
      /* 炸点闪光 */
      parts.push({ x: x, y: y, vx: 0, vy: 0, life: 1, dec: 5.6, c: '#fffaf0', r: 6.4 * S, flash: 1 });
    }

    /* 单帧绘制：rAF 与看门狗共用。
       注意：rAF 的 now 是「帧起始时刻」，可能早于 performance.now()，
       两者交替调用会让 dt 变负 → damp>1 → 粒子速度指数爆炸（拉出全屏长线）。
       所以这里只认自己的单调时钟，并对 dt 做上下限夹紧。 */
    let prevT = 0, frameN = 0;
    function draw(forceDt) {
      const now = performance.now();
      lastDraw = now;
      let dt;
      if (forceDt) { dt = forceDt; }
      else {
        const raw = prevT ? (now - prevT) / 1000 : 1 / 60;
        dt = Math.min(0.05, Math.max(0.001, raw));
        prevT = now;
      }
      const damp = Math.pow(0.986, dt * 60);
      T += dt;
      /* 兜底自检：画布尺寸和容器对不上就会被 CSS 拉伸（粒子变糊变大），每 20 帧核一次 */
      if ((frameN++ % 20) === 0 && (cv.clientWidth !== W || cv.clientHeight !== H)) resize();
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';

      if (now >= nextAt) {
        launch();
        if (!reduce && Math.random() < 0.18) setTimeout(launch, 320 + Math.random() * 340);
        nextAt = now + (reduce ? 3200 : 1000 + Math.random() * 1000);
      }

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.y += r.vy * dt;
        const tl = 56 * S;
        const tail = ctx.createLinearGradient(r.x, r.y, r.x, r.y + tl);
        tail.addColorStop(0, 'rgba(255,246,220,.92)');
        tail.addColorStop(0.34, 'rgba(255,200,124,.5)');
        tail.addColorStop(1, 'rgba(255,150,80,0)');
        ctx.globalAlpha = 1;
        ctx.strokeStyle = tail;
        ctx.lineWidth = 2.4 * S;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x, r.y + tl);
        ctx.stroke();
        const hr = 5 * S;
        const head = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, hr);
        head.addColorStop(0, 'rgba(255,252,236,1)');
        head.addColorStop(0.5, 'rgba(255,214,140,0.7)');
        head.addColorStop(1, 'rgba(255,160,90,0)');
        ctx.fillStyle = head;
        ctx.beginPath(); ctx.arc(r.x, r.y, hr, 0, 6.2832); ctx.fill();
        if (r.y <= r.ty) { burst(r.x, r.y, r.c); rockets.splice(i, 1); }
      }

      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        const px = p.x, py = p.y;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= damp;
        p.vy = p.vy * damp + 115 * dt;
        /* 安全阀：任何异常都不允许速度失控（否则拖尾会拉成贯穿全屏的长线） */
        const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (spd > 420) { const k = 420 / spd; p.vx *= k; p.vy *= k; }
        p.life -= p.dec * dt;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        const a = Math.pow(p.life, 1.5) * (0.84 + 0.16 * Math.sin(T * 26 + (p.ph || 0)));
        if (p.flash) {
          /* 炸点闪光：一团快速扩散的暖白光 */
          const fr = p.r + (1 - p.life) * 46;
          const g = ctx.createRadialGradient(px, py, 0, px, py, fr);
          g.addColorStop(0, 'rgba(255,252,236,' + (0.95 * a).toFixed(3) + ')');
          g.addColorStop(0.42, 'rgba(255,206,132,' + (0.5 * a).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(255,150,80,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(px, py, fr, 0, 6.2832); ctx.fill();
          continue;
        }
        const rr = Math.max(0.6, p.r * (0.45 + p.life * 0.85));
        /* 拖尾：沿速度方向反推一小段，做出流星线 */
        const tx = p.x - p.vx * 0.055, ty2 = p.y - p.vy * 0.055;
        ctx.globalAlpha = Math.min(1, a * 1.15);
        ctx.strokeStyle = p.c;
        ctx.lineWidth = rr * 1.35;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(tx, ty2); ctx.lineTo(p.x, p.y); ctx.stroke();
        /* 柔光 */
        ctx.globalAlpha = a * 0.2;
        ctx.beginPath(); ctx.arc(p.x, p.y, rr * 3.4, 0, 6.2832); ctx.fill();
        /* 芯点 */
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(p.x, p.y, rr * 0.9, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function frame() {
      if (!running) return;
      draw();
      raf = requestAnimationFrame(frame);
    }

    /* 某些环境（离屏/受限 iframe）rAF 会被节流甚至不回调，用定时器兜底保证还在动 */
    const watchdog = setInterval(function () {
      if (!running) return;
      if (performance.now() - lastDraw > 220) draw();
    }, 180);

    let rzT = null;
    window.addEventListener('resize', function () {
      if (!running) return;
      clearTimeout(rzT);
      rzT = setTimeout(resize, 120);
    });
    /* 预览面板展开/收起、字体回流都不会触发 window.resize，
       画布尺寸跟不上就会被 CSS 拉伸放大（粒子变糊变大），所以直接盯元素本身 */
    if (window.ResizeObserver) {
      try {
        new ResizeObserver(function () { if (running) resize(); }).observe(cv);
      } catch (e) { }
    }

    return {
      start: function () {
        if (running) return;
        running = true;
        resize();
        parts = []; rockets = [];
        lastDraw = 0; prevT = 0;
        nextAt = performance.now() - 1;
        raf = requestAnimationFrame(frame);
      },
      stop: function () {
        if (!running) return;
        running = false;
        cancelAnimationFrame(raf);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, cv.width, cv.height);
      },
      /* __live 供回归用 */
      _watchdog: watchdog,
      debug: function () {
        let mv = 0;
        for (let i = 0; i < parts.length; i++) {
          const s = Math.sqrt(parts[i].vx * parts[i].vx + parts[i].vy * parts[i].vy);
          if (s > mv) mv = s;
        }
        return "r=" + rockets.length + " p=" + parts.length + " maxv=" + Math.round(mv) + " next=" + Math.round(nextAt);
      },
      /* 离线复现：按固定步长推进若干秒后定格，用于截图校验（不影响正常播放） */
      _sim: function (sec) {
        for (let i = 0, n = Math.round((sec || 1) * 60); i < n; i++) draw(1 / 60);
      },
      _launch: function () { launch(); },
      _freeze: function () {
        running = false;
        cancelAnimationFrame(raf);
      },
      active: function () { return running; }
    };
  })();

  /* ================= 启动 ================= */
  renderModes();
  function boot() {
    paintStoreBar();
    const sid = readJSON(K_SESSION, null);
    if (sid && users[sid]) {
      user = users[sid];
      ensureProfile(user);
      saveUser();
      paintLobby();
      showScreen('lobby');
      scheduleIdleMood();
    } else {
      showScreen('auth');
    }
  }
  boot();

  /* 调试接口（供自动化测试用） */
  window.__ddz = {
    get game() { return game; },
    get model() { return getModel(); },
    get user() { return user; },
    get mode() { return mode; },
    get store() { return STORE; },
    get fw() { return Fireworks; },
    get users() { return users; },
    enterMode: enterMode,
    startRound: startRound,
    say: say,
    setSeatMood: setSeatMood,
    checkLowCards: checkLowCards,
    hashTest: function (pw, salt) { return derive(pw, salt); },
    sha256Hex: function (s) { return hexOf(sha256(bytesOf(s))); }
  };
})();
</script>
</body>
</html>
