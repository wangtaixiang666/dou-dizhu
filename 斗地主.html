<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>斗地主 · 本地版</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --g1:#c0392b; --g2:#6d1410; --g3:#2a0706;
    --gold:#f7c95c; --gold-d:#dc9a1e; --gold-l:#ffeab4;
    --ink:#fff7ee; --dim:#e3b8a2;
    --red:#ff6b52; --line:rgba(255,255,255,.09);
  }
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--ink); overflow:hidden;
    background:radial-gradient(120% 90% at 50% -10%, #b02a1f 0%, #6f1611 46%, #3a0b07 100%);
    -webkit-font-smoothing:antialiased;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(60% 45% at 50% 0%, rgba(255,220,140,.12), transparent 70%),
      radial-gradient(120% 90% at 50% 118%, rgba(0,0,0,.34), transparent 62%),
      radial-gradient(80% 60% at 50% 46%, rgba(255,110,70,.07), transparent 72%);
  }
  .app{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:12px}
  /* ---------- 存储不可用提示条 ---------- */
  .storebar{
    position:fixed;left:0;right:0;top:0;z-index:400;
    display:flex;align-items:center;gap:8px;justify-content:center;
    padding:7px 14px;font-size:11.5px;line-height:1.4;font-weight:600;
    color:#ffe2d2;background:linear-gradient(180deg,#7d241a,#5a150e);
    border-bottom:1px solid rgba(255,150,110,.5);
    box-shadow:0 6px 18px -8px rgba(0,0,0,.9);
  }
  .storebar b{color:#ffc9a8}
  .storebar .sk{flex:0 0 auto;font-size:13px}
  .storebar.soft{
    background:linear-gradient(180deg,#7a4a12,#54300a);
    border-bottom-color:rgba(255,196,120,.45);color:#ffe9c8;
  }
  .storebar.soft b{color:#ffd79a}
  .storebar .x{
    flex:0 0 auto;margin-left:6px;width:18px;height:18px;border-radius:50%;
    background:rgba(0,0,0,.24);border:1px solid rgba(255,255,255,.2);
    color:#ffe9c8;font-size:10px;line-height:1;cursor:pointer;font-family:inherit;
  }
  .storebar .x:hover{background:rgba(0,0,0,.4)}
  body.storefail .app{padding-top:44px}
  body.storefail .storebar{display:flex !important}
  .screen{width:100%;height:100%;display:flex;flex-direction:column;min-height:0}
  .hidden{display:none !important}

  /* ---------- 通用控件 ---------- */
  .btn{
    font-family:inherit;font-size:13px;font-weight:700;color:#5a3a06;
    border:0;border-radius:11px;padding:9px 18px;cursor:pointer;white-space:nowrap;
    background:linear-gradient(180deg,var(--gold-l),var(--gold) 45%,var(--gold-d));
    box-shadow:0 3px 0 #a06f0c, 0 6px 14px -6px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.7);
    transition:transform .08s, box-shadow .08s, filter .15s;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 #a06f0c, 0 3px 8px -6px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.6)}
  .btn:disabled{filter:grayscale(.75) brightness(.62);cursor:not-allowed;box-shadow:0 1px 0 rgba(0,0,0,.4)}
  .btn.ghost{
    color:#ffe8d2;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)
  }
  .btn.ghost:active{transform:translateY(1px)}
  .btn.block{width:100%;padding:12px;font-size:15px;letter-spacing:4px}
  .btn.sm{padding:7px 14px;font-size:12px;border-radius:9px}
  .icon-btn{
    width:38px;height:38px;flex:0 0 auto;border-radius:11px;cursor:pointer;font-size:16px;
    color:#ffe8d2;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.14)}
  .icon-btn:active{transform:scale(.94)}
  .icon-btn.off{opacity:.42;filter:grayscale(1)}

  .coin-ico{
    width:17px;height:17px;border-radius:50%;flex:0 0 auto;display:inline-block;
    background:radial-gradient(circle at 35% 30%, #fff3c4, #f9c94f 45%, #c8880f 100%);
    box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55), 0 1px 3px rgba(0,0,0,.45);
    position:relative;
  }
  .coin-ico::after{
    content:"";position:absolute;inset:4px;border-radius:50%;
    border:1.5px solid rgba(140,88,0,.55);
  }
  .coin-pill{
    display:flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:20px;
    background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.26));
    border:1px solid rgba(255,214,120,.28);font-size:13px;font-weight:800;color:#ffe6a8;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07)
  }
  .coin-pill.sm{font-size:12px;padding:5px 10px 5px 8px}

  /* ---------- 登录：春节场景 ---------- */
  #scrAuth{
    position:relative;align-items:center;justify-content:center;
    overflow-y:auto;overflow-x:hidden;padding:18px 8px 22px;
    background:
      radial-gradient(120% 74% at 50% -6%, rgba(255,158,96,.18), transparent 62%),
      radial-gradient(64% 44% at 50% 106%, rgba(255,118,58,.16), transparent 72%);
  }
  .fw-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .auth-wrap{position:relative;z-index:3;width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}

  /* 灯笼：悬在厅堂上方，暖光呼吸 + 慢摆 */
  .a-lantern{
    position:absolute;top:-8px;width:58px;height:118px;z-index:2;pointer-events:none;
    transform-origin:50% 0;animation:sway 6.6s ease-in-out infinite;
    filter:drop-shadow(0 12px 24px rgba(0,0,0,.62)) drop-shadow(0 0 22px rgba(255,118,58,.45));
  }
  .a-lantern.l{left:15%}
  .a-lantern.r{right:15%;animation-delay:-3.3s}
  .a-lantern svg{width:100%;height:92px;display:block}
  .a-lantern .tas{
    position:relative;display:block;width:6px;height:16px;margin:0 auto;border-radius:3px;
    background:linear-gradient(180deg,#ffe3a4,#e0a63c 60%,#a86f18);
    box-shadow:0 0 12px rgba(255,180,100,.55);
    animation:tasSwing 3.1s ease-in-out infinite;transform-origin:50% 0;
  }
  .a-lantern .tas::after{
    content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
    width:12px;height:18px;
    background:repeating-linear-gradient(90deg,#f0b64a 0 1.6px,transparent 1.6px 4px);
    clip-path:polygon(18% 0,82% 0,62% 100%,38% 100%);
  }
  .a-lantern::after{
    content:"";position:absolute;left:50%;top:34px;width:190px;height:190px;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,138,70,.26),rgba(255,120,60,.08) 42%,transparent 68%);
    animation:lampPulse 3.8s ease-in-out infinite;
  }
  .a-lantern.r::after{animation-delay:-1.9s}
  @keyframes lampPulse{0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.16)}}
  @keyframes tasSwing{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

  /* 抱对联的人物 */
  .a-fig{
    position:absolute;bottom:74px;z-index:2;width:286px;height:406px;pointer-events:none;
  }
  .a-fig.l{left:clamp(2px,3.6vw,72px)}
  .a-fig.r{right:clamp(2px,3.6vw,72px)}
  .a-fig::before{
    content:"";position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    width:246px;height:74px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 72%);
  }
  .a-fig .fig{
    position:absolute;left:0;bottom:0;width:238px;height:357px;
    animation:figBob 5.6s ease-in-out infinite;transform-origin:50% 100%;
  }
  .a-fig.r .fig{left:auto;right:0;animation-delay:-1.8s}
  @keyframes figBob{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-5px) rotate(.5deg)}}
  .a-fig .fig .av{width:100%;height:100%;filter:drop-shadow(0 16px 24px rgba(0,0,0,.55))}

  /* 春联 */
  .duilian{
    position:absolute;bottom:96px;width:70px;height:252px;z-index:2;
    display:flex;align-items:center;justify-content:center;border-radius:3px;
    border:1.5px solid #ecbc5c;
    background:
      repeating-linear-gradient(0deg, rgba(255,214,140,.09) 0 1px, transparent 1px 17px),
      radial-gradient(circle at 28% 16%, rgba(255,226,160,.26), transparent 46%),
      linear-gradient(180deg,#d02f21,#a8180f 54%,#7c0d07);
    box-shadow:0 12px 24px -10px rgba(0,0,0,.9),
      inset 0 0 0 3px rgba(84,6,4,.32), inset 0 0 20px rgba(0,0,0,.3);
    transform-origin:50% 92%;
  }
  .a-fig.l .duilian{left:188px;animation:dipL 6.6s ease-in-out infinite}
  .a-fig.r .duilian{right:188px;animation:dipR 6.6s ease-in-out infinite}
  @keyframes dipL{0%,100%{transform:rotate(4.5deg)}50%{transform:rotate(5.6deg) translateY(-3px)}}
  @keyframes dipR{0%,100%{transform:rotate(-4.5deg)}50%{transform:rotate(-5.6deg) translateY(-3px)}}
  .duilian span{
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:34px;line-height:1.06;letter-spacing:7px;font-weight:900;
    color:#ffe7a6;text-shadow:0 2px 0 #6f0a05, 0 0 14px rgba(255,196,96,.55);
  }
  .duilian::before,.duilian::after{
    content:"";position:absolute;left:-3px;right:-3px;height:9px;border-radius:2px;
    background:linear-gradient(180deg,#ffe6ad,#e6ac42 58%,#b0761c);
    box-shadow:0 1px 4px rgba(0,0,0,.55);
  }
  .duilian::before{top:-6px}
  .duilian::after{bottom:-6px;height:7px}

  /* 厅堂团花（衬在卡片后面，填补中部空白） */
  .a-hall{
    position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);
    width:min(74vw,660px);aspect-ratio:1/1;z-index:0;pointer-events:none;opacity:.85;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480' viewBox='0 0 480 480'><g fill='none' stroke='%23ffd08a' stroke-width='1.3'><circle cx='240' cy='240' r='230' stroke-opacity='.16'/><circle cx='240' cy='240' r='221' stroke-opacity='.07'/><circle cx='240' cy='240' r='172' stroke-opacity='.10' stroke-dasharray='1 11' stroke-linecap='round'/><circle cx='240' cy='240' r='120' stroke-opacity='.06'/><circle cx='240' cy='240' r='58' stroke-opacity='.05'/><g stroke-opacity='.11'><path d='M240 108 l24 24 -24 24 -24 -24 z'/><path d='M240 372 l24 -24 -24 -24 -24 24 z'/><path d='M108 240 l24 24 -24 24 -24 -24 z'/><path d='M372 240 l24 24 -24 24 -24 -24 z'/></g></g></svg>") center/contain no-repeat,
      radial-gradient(circle, rgba(255,150,80,.13), transparent 66%);
  }
  /* 地台：元宝铜钱云纹 */
  .a-ground{
    position:absolute;left:0;right:0;bottom:0;height:112px;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(26,4,3,.34) 58%,rgba(16,2,2,.66));
  }
  .a-ground svg{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:min(1180px,100%);height:auto}

  /* 底部卖点 */
  .a-tags{
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:10.5px;color:#e9bfa0;letter-spacing:.6px;opacity:.92;
  }
  .a-tags i{width:3px;height:3px;border-radius:50%;background:rgba(247,201,92,.62)}
  /* 下载入口：让别人把这个单文件存到自己电脑上玩 */
  .dl-pill{
    display:inline-flex;align-items:center;gap:6px;align-self:center;
    margin-top:-2px;padding:7px 15px;border-radius:999px;
    border:1px solid rgba(255,206,132,.4);background:rgba(255,206,132,.09);
    color:#ffdca2;font-size:12px;letter-spacing:.4px;text-decoration:none;
    transition:background .18s ease,border-color .18s ease,color .18s ease,transform .18s ease;
  }
  .dl-pill:hover{background:rgba(255,206,132,.2);border-color:rgba(255,206,132,.72);color:#fff3d8;transform:translateY(-1px)}
  .dl-pill svg{width:13px;height:13px;flex:none;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .dl-pill b{font-weight:700;color:#ffe8b6}
  @media (max-width:1080px){
    .a-fig{width:224px;height:318px;bottom:62px}
    .a-fig .fig{width:186px;height:279px}
    .duilian{width:56px;height:200px;bottom:82px}
    .a-fig.l .duilian{left:150px}
    .a-fig.r .duilian{right:150px}
    .duilian span{font-size:27px;letter-spacing:5px}
    .a-lantern{width:48px;height:102px}
    .a-lantern svg{height:80px}
    .a-lantern.l{left:11.5%}
    .a-lantern.r{right:11.5%}
  }
  @media (max-width:980px){
    /* 中等宽度：人物放大到接近满尺寸，对联挂在身侧（不遮脸、不挡腿） */
    .a-fig{width:190px;height:300px;bottom:22px}
    .a-fig.l{left:4px}
    .a-fig.r{right:4px}
    .a-fig .fig{width:188px;height:282px}
    .duilian{width:42px;height:136px;bottom:38px}
    .a-fig.l .duilian{left:130px}
    .a-fig.r .duilian{right:130px}
    .duilian span{font-size:19px;letter-spacing:3px}
    .a-lantern{width:44px;height:94px}
    .a-lantern svg{height:74px}
    .a-lantern.l{left:10%}
    .a-lantern.r{right:10%}
  }
  @media (max-width:820px){
    /* 网页内嵌面板通常只有 700~800 宽：卡片收窄腾出边，人保持够大 */
    .auth-wrap{max-width:332px}
    .a-fig{width:182px;height:292px;bottom:18px}
    .a-fig.l{left:2px}
    .a-fig.r{right:2px}
    .a-fig::before{width:172px;height:52px}
    .a-fig .fig{width:182px;height:276px}
    .a-fig .fig .av{filter:drop-shadow(0 12px 20px rgba(0,0,0,.62)) drop-shadow(0 0 20px rgba(255,170,96,.3))}
    .duilian{width:38px;height:128px;bottom:34px}
    .a-fig.l .duilian{left:124px}
    .a-fig.r .duilian{right:124px}
    .duilian span{font-size:17px;letter-spacing:2.6px}
    .a-lantern{width:42px;height:90px}
    .a-lantern svg{height:70px}
    .a-lantern.l{left:7%}
    .a-lantern.r{right:7%}
  }
  @media (max-width:660px){
    /* 再窄一档：卡片收窄腾出边，人物继续缩小但仍留在场上 */
    .auth-wrap{max-width:318px}
    .a-fig{width:140px;height:226px;bottom:16px}
    .a-fig::before{width:132px;height:40px}
    .a-fig .fig{width:140px;height:210px}
    .duilian{width:32px;height:94px;bottom:10px}
    .a-fig.l .duilian{left:74px}
    .a-fig.r .duilian{right:74px}
    .duilian span{font-size:14px;letter-spacing:2px}
    #scrAuth .hint{font-size:11px;line-height:1.5}
    .a-lantern{width:32px;height:70px}
    .a-lantern svg{height:54px}
    .a-lantern.l{left:5%}
    .a-lantern.r{right:5%}
  }
  @media (max-width:570px){
    /* 手机竖屏真的放不下，才隐藏 */
    .a-fig,.a-lantern{display:none}
    .a-ground{height:86px}
  }
  @media (prefers-reduced-motion:reduce){
    .a-lantern,.a-lantern .tas,.a-fig,.a-fig .fig,.duilian{animation:none !important}
  }
  .brand-big{text-align:center;transform:translateY(-4px);position:relative}

  .brand-big .logo{
    font-size:34px;font-weight:900;letter-spacing:8px;color:#ffe7ad;
    text-shadow:0 2px 0 #8a5b06, 0 10px 24px rgba(0,0,0,.55);
  }
  .brand-big .sub{font-size:11.5px;color:var(--dim);letter-spacing:2px;margin-top:6px}
  .auth-card{
    background:linear-gradient(180deg,rgba(64,12,10,.96),rgba(38,7,6,.96));
    border:1px solid rgba(255,210,120,.22);border-radius:20px;padding:16px;
    box-shadow:0 28px 60px -24px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .tabs{display:flex;gap:6px;background:rgba(0,0,0,.3);padding:4px;border-radius:12px;margin-bottom:14px}
  .tab{
    flex:1;padding:8px;border:0;border-radius:9px;background:transparent;cursor:pointer;
    font-family:inherit;font-size:13px;font-weight:700;color:#d9ab94;transition:.15s
  }
  .tab.on{background:linear-gradient(180deg,var(--gold-l),var(--gold) 50%,var(--gold-d));color:#5a3a06;box-shadow:0 2px 8px -3px rgba(0,0,0,.6)}
  .form{display:flex;flex-direction:column;gap:10px}
  .form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#e6bca4;font-weight:600}
  .form input{
    font-family:inherit;font-size:14px;color:#fff6ea;padding:11px 12px;border-radius:10px;
    background:rgba(0,0,0,.26);border:1px solid rgba(255,206,132,.2);outline:none;transition:.15s
  }
  .form input::placeholder{color:#b98a76}
  .form input:focus{border-color:rgba(247,201,92,.55);box-shadow:0 0 0 3px rgba(247,201,92,.1)}
  .err{font-size:11.5px;color:#ff9b8a;min-height:15px;line-height:15px}
  .hint{font-size:10.5px;color:#b98a76;text-align:center;line-height:1.5}
  .avatar-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin:2px 0;justify-items:center}
  .avatar-pick button{
    width:38px;height:38px;border-radius:50%;font-size:19px;cursor:pointer;
    background:rgba(255,255,255,.06);border:2px solid transparent;transition:.15s;line-height:1
  }
  .avatar-pick button.on{border-color:var(--gold);background:rgba(247,201,92,.2);transform:scale(1.06)}

  /* ---------- 大厅 ---------- */
  #scrLobby{gap:12px;max-width:980px;margin:0 auto;position:relative}
  #scrLobby::before{
    content:"";position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);
    width:min(84vw,620px);height:min(84vw,620px);pointer-events:none;z-index:0;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480' viewBox='0 0 480 480'><g fill='none' stroke='%23ffd08a' stroke-width='1.4'><circle cx='240' cy='240' r='228' stroke-opacity='.14'/><circle cx='240' cy='240' r='219' stroke-opacity='.06'/><circle cx='240' cy='240' r='168' stroke-opacity='.12' stroke-dasharray='1 10' stroke-linecap='round'/><circle cx='240' cy='240' r='96' stroke-opacity='.06'/><g stroke-opacity='.10'><path d='M240 120 l22 22 -22 22 -22 -22 z'/><path d='M240 360 l22 -22 -22 -22 -22 22 z'/><path d='M120 240 l22 22 -22 22 -22 -22 z'/><path d='M360 240 l22 22 -22 22 -22 -22 z'/></g></g></svg>") center/contain no-repeat
  }
  #scrLobby > *{position:relative;z-index:1}
  .lobby-top{display:flex;align-items:center;gap:10px}
  .user-card{
    display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:32px;
    background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.24));
    border:1px solid rgba(255,210,120,.24);cursor:pointer;color:inherit;font-family:inherit;
    transition:.15s;min-width:0
  }
  .user-card:hover{border-color:rgba(255,210,120,.5)}
  .ava{
    width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:22px;line-height:1;flex:0 0 auto;
    background:radial-gradient(circle at 35% 25%,#d3563f,#7d1d14);
    box-shadow:0 0 0 2px rgba(247,201,92,.75), 0 3px 8px rgba(0,0,0,.5)
  }
  .uinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
  .uname{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
  .uid{font-size:10px;color:#d9ab94;letter-spacing:.4px}
  .uid b{color:#ffe3c8;font-variant-numeric:tabular-nums}
  .lobby-main{flex:1;min-height:0;display:flex;flex-direction:column;gap:16px;overflow-y:auto;padding-bottom:4px}
  .welcome{padding:2px 4px 0}

    flex:1;min-height:0;position:relative;overflow:hidden;

    border-radius:24px;padding:20px 22px 16px;
    background:
      linear-gradient(176deg,rgba(255,214,160,.16),rgba(255,214,160,0) 22%),
      repeating-linear-gradient(93deg, rgba(255,214,160,.045) 0 1px, rgba(0,0,0,.05) 1px 3px, rgba(0,0,0,0) 3px 11px),
      linear-gradient(180deg,#8b4c26 0%,#6c3216 18%,#4d2211 52%,#33150b 82%,#24100a 100%);

      0 28px 64px -32px rgba(0,0,0,.95),
      inset 0 2px 0 rgba(255,222,176,.30),
      inset 0 -4px 12px rgba(0,0,0,.6),
      inset 0 0 46px rgba(0,0,0,.42);
  }
  /* 桌面木纹高光 */
  .table::before{
    content:"";position:absolute;inset:0;pointer-events:none;z-index:0;border-radius:23px;
    background:
      radial-gradient(120% 60% at 50% -14%,rgba(255,196,120,.16),transparent 62%),
      repeating-linear-gradient(90deg,rgba(255,240,210,.04) 0 2px,transparent 2px 13px);
    mix-blend-mode:screen;opacity:.6;
  }
  /* 桌沿鎏金铜钱 */
  .table::after{
    content:"";position:absolute;inset:16px;z-index:0;pointer-events:none;border-radius:16px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='52' height='52' viewBox='0 0 52 52'><g fill='none' stroke='%23ffd08a' stroke-width='1.2'><circle cx='26' cy='26' r='11' stroke-opacity='.22'/><rect x='21.5' y='21.5' width='9' height='9' stroke-opacity='.22'/><g stroke-opacity='.12'><path d='M26 9 v5 M26 38 v5 M9 26 h5 M38 26 h5'/></g></g></svg>");
    background-position:14px 12px, calc(100% - 14px) 12px, 14px calc(100% - 12px), calc(100% - 14px) calc(100% - 12px);
    background-size:34px 34px;
    background-repeat:no-repeat;
  }
  .table > *{min-width:0;position:relative;z-index:1}
  .table > .t-scene{z-index:0;position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:23px}
  /* 桌面木沿（内圈抛光） */
  .t-rim{
    position:absolute;inset:9px;border-radius:19px;
    background:
      linear-gradient(178deg,rgba(255,214,160,.24) 0%,rgba(255,214,160,.04) 16%,rgba(0,0,0,.16) 100%),
      linear-gradient(180deg,#62300f,#3f1c0a 58%,#2a1006);
    box-shadow:
      inset 0 1px 0 rgba(255,226,180,.34),
      inset 0 -2px 6px rgba(0,0,0,.6),
      0 3px 10px rgba(0,0,0,.45);
  }
  /* 台呢 */
  .t-felt{
    position:absolute;inset:16px;border-radius:14px;overflow:hidden;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' seed='7'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.5'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480' viewBox='0 0 480 480'><g fill='none' stroke='%23ffd08a'><circle cx='240' cy='240' r='226' stroke-width='2' stroke-opacity='.22'/><circle cx='240' cy='240' r='214' stroke-width='1' stroke-opacity='.10'/><circle cx='240' cy='240' r='164' stroke-width='1.4' stroke-opacity='.18' stroke-dasharray='1 11' stroke-linecap='round'/><circle cx='240' cy='240' r='88' stroke-width='1' stroke-opacity='.10'/><g stroke-width='1.6' stroke-opacity='.20'><path d='M240 116 l26 26 -26 26 -26 -26 z'/><path d='M240 364 l26 -26 -26 -26 -26 26 z'/><path d='M116 240 l26 26 -26 26 -26 -26 z'/><path d='M364 240 l26 26 -26 26 -26 -26 z'/></g><g stroke-width='1' stroke-opacity='.10'><circle cx='240' cy='240' r='128'/><circle cx='240' cy='240' r='58'/></g></g></svg>"),
      radial-gradient(64% 50% at 50% 30%,rgba(255,150,104,.26),rgba(255,150,104,0) 72%),
      radial-gradient(30% 34% at 8% 2%,rgba(255,196,120,.18),transparent 70%),
      radial-gradient(30% 34% at 92% 2%,rgba(255,196,120,.18),transparent 70%),
      radial-gradient(126% 118% at 50% 42%,#b02e22 0%,#8f2019 38%,#681410 72%,#480b08 100%);
    background-position:0 0, center, 0 0, 0 0, 0 0, 0 0;
    background-size:180px 180px, min(64%,460px) auto, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
    background-repeat:repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat;
    background-blend-mode:overlay, normal, normal, normal, normal, normal;
    box-shadow:
      inset 0 0 0 1px rgba(255,206,132,.24),
      inset 0 0 0 5px rgba(0,0,0,.22),
      inset 0 0 0 6px rgba(255,206,132,.10),
      inset 0 18px 42px rgba(0,0,0,.46),
      inset 0 -14px 34px rgba(0,0,0,.38),
      inset 0 0 120px rgba(0,0,0,.30);
  }
  /* 台呢织纹 */
  .t-felt::after{
    content:"";position:absolute;inset:0;
    background:
      repeating-linear-gradient(0deg,rgba(255,255,255,.017) 0 1px,transparent 1px 2px),
      repeating-linear-gradient(90deg,rgba(0,0,0,.03) 0 1px,transparent 1px 2px);
  }
  .t-glow{
    position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:80%;height:300px;

  .t-lamp{position:absolute;top:0;width:34px;height:66px;filter:drop-shadow(0 8px 16px rgba(0,0,0,.65)) drop-shadow(0 0 14px rgba(255,150,90,.35))}

  .table-main{flex:1;min-width:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;grid-template-columns:minmax(0,1fr)}

  .handfan{position:absolute;pointer-events:none;z-index:4}

      repeating-linear-gradient(45deg, rgba(255,206,132,.26) 0 1px, transparent 1px 6px),
      repeating-linear-gradient(-45deg, rgba(255,206,132,.12) 0 1px, transparent 1px 6px),

    box-shadow:inset 2px 0 0 rgba(255,232,190,.28), 0 3px 7px rgba(0,0,0,.5);
    transform:rotate(calc(-19deg + var(--i) * 7.6deg));transform-origin:50% 100%

  /* ---------- 吉庆点缀 ---------- */

  }

  }
  .lantern.l1{left:-2px}
  .lantern.l2{right:-2px;animation-delay:-2.6s}
  @keyframes sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}

  @media (prefers-reduced-motion:reduce){.lantern{animation:none}}

  }

  /* ================= 人物立绘 ================= */
  .av{display:block;width:100%;height:100%;overflow:visible}
  .av-head-only{width:100%;height:100%}
  .av .av-all{transform-box:fill-box;transform-origin:50% 100%;animation:avbreathe 4.4s ease-in-out infinite}
  @keyframes avbreathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1.6px) scaleY(1.012)}}
  .av .av-sway{transform-box:fill-box;transform-origin:50% 96%;animation:avsway 6.4s ease-in-out infinite}
  @keyframes avsway{
    0%,100%{transform:rotate(-1.8deg) translateY(0)}
    35%{transform:rotate(1.4deg) translateY(-1.2px)}
    70%{transform:rotate(-.4deg) translateY(.6px)}
  }
  .av .av-head{transform-box:fill-box;transform-origin:50% 92%;transition:transform .42s cubic-bezier(.2,1.2,.4,1)}
  .av .av-eyes{transform-box:fill-box;transform-origin:center;animation:avblink 6.2s infinite}
  @keyframes avblink{0%,41.5%,44.5%,96.4%,100%{transform:scaleY(1)}42.4%,43.6%,97.4%,98.6%{transform:scaleY(.06)}}
  .av .av-tuft{transform-box:fill-box;transform-origin:0% 100%;animation:avtuft 3.2s ease-in-out infinite}
  @keyframes avtuft{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
  .av .av-arm{transform-box:fill-box;transform-origin:50% 4%;transition:transform .34s cubic-bezier(.2,1.2,.4,1)}
  .av .av-armL{animation:avarmL 4.2s ease-in-out infinite}
  @keyframes avarmL{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(2.2deg)}}
  .av .m,.av .b{display:none}
  .av .eye-happy,.av .eye-smug{display:none}
  .av[data-mood="happy"] .eye-open,.av[data-mood="smug"] .eye-open{display:none}
  .av[data-mood="happy"] .eye-happy{display:block}
  .av[data-mood="smug"] .eye-smug{display:block}
  .av[data-mood="smug"] .m-smug,.av[data-mood="smug"] .b-smug{display:block}
  .av[data-mood="smug"] .av-head{transform:rotate(7deg) translateY(-4px)}
  .av[data-mood="smug"] .av-eyes{animation:none}
  .av[data-mood="smug"] .av-all{animation:avsmug 2.2s ease-in-out infinite}
  @keyframes avsmug{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(.8deg)}}
  /* 出牌 / 抢地主：抬手 */
  .av.throwing .av-armR{transform:rotate(-78deg) translateY(-6px)}
  .av.throwing .av-armL{transform:rotate(12deg)}
  .av.doing .av-head{transform:rotate(-8deg) translateY(-3px)}
  .av[data-mood="idle"] .m-idle,.av[data-mood="think"] .m-think,
  .av[data-mood="happy"] .m-happy,.av[data-mood="sad"] .m-sad,.av[data-mood="angry"] .m-angry,
  .av[data-mood="play"] .m-happy{display:block}
  .av[data-mood="idle"] .b-idle,.av[data-mood="think"] .b-idle,
  .av[data-mood="happy"] .b-happy,.av[data-mood="sad"] .b-sad,.av[data-mood="angry"] .b-angry,
  .av[data-mood="play"] .b-happy{display:block}
  .av[data-mood="happy"] .av-all{animation:avhop .82s ease-in-out infinite}
  @keyframes avhop{0%,100%{transform:translateY(0) scaleY(1)}42%{transform:translateY(-12px) scaleY(1.03)}70%{transform:translateY(0) scaleY(.97)}}
  .av[data-mood="happy"] .av-armL{animation:avcheerL .82s ease-in-out infinite}
  @keyframes avcheerL{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(16deg)}}
  .av[data-mood="play"] .av-all{animation:avnod 1.7s ease-in-out infinite}
  @keyframes avnod{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-3px) rotate(-1.5deg)}}
  .av[data-mood="sad"] .av-head{transform:translateY(7px) rotate(-5deg)}
  .av[data-mood="sad"] .av-all{animation:avsag 3.4s ease-in-out infinite}
  @keyframes avsag{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
  .av[data-mood="angry"] .av-head{transform:translateY(-2px) scale(1.03)}
  .av[data-mood="angry"] .av-all{animation:avshake .28s ease-in-out infinite}
  @keyframes avshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}}
  .av[data-mood="think"] .av-head{transform:rotate(-6deg) translateY(-2px)}
  .av[data-mood="think"] .av-sway{animation:none}
  .av .av-tear{opacity:0}
  .av[data-mood="sad"] .av-tear{opacity:.9;animation:avtear 2.6s infinite}
  @keyframes avtear{0%{transform:translateY(0);opacity:0}30%{opacity:.9}100%{transform:translateY(14px);opacity:0}}
  .av-head-only .av-tuft{animation:none}

    position:absolute;left:50%;bottom:100%;transform:translateX(-50%) translateY(-3px);
    width:max-content;padding:3px 11px;border-radius:20px;font-size:11px;font-weight:900;letter-spacing:.5px;

  @keyframes bubIn{from{opacity:0;transform:translate(-50%,2px) scale(.92)}to{opacity:1;transform:translate(-50%,-8px) scale(1)}}
  .seat .bubble{bottom:auto;top:100%;transform:translate(-50%,8px);animation:bubIn2 .18s ease-out}

  @keyframes bubIn2{from{opacity:0;transform:translate(-50%,2px) scale(.92)}to{opacity:1;transform:translate(-50%,8px) scale(1)}}

  .me{position:relative}

  .chatpanel{
    position:absolute;right:10px;bottom:92px;width:min(304px,88vw);z-index:24;display:none;
    background:linear-gradient(180deg,#7d1a13,#3a0907);border:1px solid rgba(247,201,92,.34);

  }

    text-align:left;font-family:inherit;font-size:11.5px;padding:7px 10px;border-radius:9px;cursor:pointer;
    background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.08);color:#ffe8d2
  }
  .chat-quick button:hover{background:rgba(247,201,92,.14);border-color:rgba(247,201,92,.3)}
  .chat-emo{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .chat-emo button{
    font-size:21px;padding:5px 0;border-radius:9px;line-height:1.2;cursor:pointer;
    background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.08)

    .w-sub{font-size:11px}
    .icon-btn{width:34px;height:34px;font-size:14px}

    .seat{min-width:0;flex:1 1 0}

    .seat .who{font-size:10.5px;gap:4px}
    .seat .who .role{font-size:8px;padding:0 4px}
    .seat .cnt{font-size:9.5px;margin-top:2px}

    .center{gap:6px}
    .tip{font-size:10px}

    .bottomcards .c.small .s{font-size:7.5px}
    .plays{min-height:70px;gap:4px;max-width:100%}

<script>/* 斗地主规则引擎 —— Node 与浏览器共用（挂到 globalThis.DDZ） */
(function () {
  'use strict';
  const G = globalThis;
  const DDZ = (G.DDZ = G.DDZ || {});

  /* ========== 牌型 ========== */
  const T = {
    SINGLE: 1, PAIR: 2, TRIO: 3, TRIO1: 4, TRIO2: 5, STRAIGHT: 6, PAIRS: 7,
    PLANE: 8, PLANE1: 9, PLANE2: 10, FOUR2: 11, FOUR4: 12, BOMB: 13, ROCKET: 14
  };
  const TYPE_NAME = {
    1: '单张', 2: '对子', 3: '三张', 4: '三带一', 5: '三带二', 6: '顺子', 7: '连对',
    8: '飞机', 9: '飞机带单', 10: '飞机带对', 11: '四带二', 12: '四带两对', 13: '炸弹', 14: '王炸'
  };
  DDZ.T = T;
  DDZ.TYPE_NAME = TYPE_NAME;

  /* ========== 牌的编码 ==========
     id 0..51 -> 点数 3..15（15 = 2）；id 52 = 小王；id 53 = 大王
     counts 用长度 18 的 Int8Array，下标即点数 */
  const RANK_LABEL = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A', 15: '2', 16: '小王', 17: '大王' };
  const SUITS = ['♠', '♥', '♣', '♦'];

  function cardRank(id) { return id < 52 ? 3 + (id >> 2) : (id === 52 ? 16 : 17); }
  function rankLabel(r) { return RANK_LABEL[r] || String(r); }
  function cardLabel(id) {
    const r = cardRank(id);
    if (r >= 16) return rankLabel(r);
    return SUITS[id & 3] + rankLabel(r);
  }
  function newCounts() { return new Int8Array(18); }
  function total(c) { let n = 0; for (let r = 3; r <= 17; r++) n += c[r]; return n; }

  DDZ.cardRank = cardRank;
  DDZ.rankLabel = rankLabel;
  DDZ.cardLabel = cardLabel;
  DDZ.newCounts = newCounts;
  DDZ.total = total;

  function contiguous(rs) {
    for (let i = 1; i < rs.length; i++) if (rs[i] !== rs[i - 1] + 1) return false;
    return true;
  }

  /* ========== 牌型识别 ========== */
  /* 返回 null 或 {t, r: 主点数, n: 总张数} */
  function analyze(c) {
    let n = 0;
    const rs = [];
    for (let r = 3; r <= 17; r++) { const k = c[r]; if (k) { n += k; rs.push(r); } }
    if (n === 0) return null;

    if (n === 2 && c[16] === 1 && c[17] === 1) return { t: T.ROCKET, r: 17, n: 2 };

    if (rs.length === 1) {
      const k = c[rs[0]];
      if (k === 1) return { t: T.SINGLE, r: rs[0], n: 1 };
      if (k === 2) return { t: T.PAIR, r: rs[0], n: 2 };
      if (k === 3) return { t: T.TRIO, r: rs[0], n: 3 };
      if (k === 4) return { t: T.BOMB, r: rs[0], n: 4 };
      return null;
    }

    /* 三带一 / 三带二 */
    if (n === 4 && rs.length === 2) {
      const a = c[rs[0]], b = c[rs[1]];
      if (a === 3 && b === 1) return { t: T.TRIO1, r: rs[0], n: 4 };
      if (a === 1 && b === 3) return { t: T.TRIO1, r: rs[1], n: 4 };
      return null;
    }
    if (n === 5 && rs.length === 2) {
      const a = c[rs[0]], b = c[rs[1]];
      if (a === 3 && b === 2) return { t: T.TRIO2, r: rs[0], n: 5 };
      if (a === 2 && b === 3) return { t: T.TRIO2, r: rs[1], n: 5 };
      return null;
    }

    /* 顺子：连续单张，>=5 张，最大 A（14），不含 2 与大小王 */
    if (n >= 5 && rs.length === n && contiguous(rs) && rs[rs.length - 1] <= 14) {
      return { t: T.STRAIGHT, r: rs[0], n: n };
    }
    /* 连对：连续对子，>=3 对 */
    if (n >= 6 && (n & 1) === 0 && rs.length === n / 2 && contiguous(rs) && rs[rs.length - 1] <= 14) {
      let ok = true;
      for (let i = 0; i < rs.length; i++) if (c[rs[i]] !== 2) { ok = false; break; }
      if (ok) return { t: T.PAIRS, r: rs[0], n: n };
    }
    /* 纯飞机：连续三张，>=2 组 */
    if (n >= 6 && n % 3 === 0 && rs.length === n / 3 && contiguous(rs) && rs[rs.length - 1] <= 14) {
      let ok = true;
      for (let i = 0; i < rs.length; i++) if (c[rs[i]] !== 3) { ok = false; break; }
      if (ok) return { t: T.PLANE, r: rs[0], n: n };
    }

    /* 四带二（4+2 单）/ 四带两对（4+2 对） */
    if (n === 6 || n === 8) {
      let four = -1;
      for (let i = 0; i < rs.length; i++) if (c[rs[i]] === 4) { four = rs[i]; break; }
      if (four > 0) {
        const rest = [];
        for (let i = 0; i < rs.length; i++) {
          if (rs[i] === four) continue;
          for (let k = 0; k < c[rs[i]]; k++) rest.push(rs[i]);
        }
        if (n === 6 && rest.length === 2) return { t: T.FOUR2, r: four, n: 6 };
        if (n === 8 && rest.length === 4) {
          const m = {};
          for (let i = 0; i < 4; i++) m[rest[i]] = (m[rest[i]] || 0) + 1;
          const v = Object.keys(m);
          if (v.length === 2 && m[v[0]] === 2 && m[v[1]] === 2) return { t: T.FOUR4, r: four, n: 8 };
        }
      }
    }

    /* 飞机带单 / 带对 */
    for (let k = 2; k <= 6; k++) {
      const withPair = n === 5 * k;
      if (n !== 4 * k && !withPair) continue;
      for (let s = 3; s + k - 1 <= 14; s++) {
        let ok = true;
        for (let i = 0; i < k; i++) if (c[s + i] < 3) { ok = false; break; }
        if (!ok) continue;
        const rem = c.slice();
        for (let i = 0; i < k; i++) rem[s + i] -= 3;
        let remTotal = 0;
        const remRanks = [];
        for (let r = 3; r <= 17; r++) if (rem[r] > 0) { remTotal += rem[r]; remRanks.push(r); }
        if (withPair) {
          if (remTotal !== 2 * k || remRanks.length !== k) continue;
          let allPairs = true;
          for (let i = 0; i < remRanks.length; i++) if (rem[remRanks[i]] !== 2) { allPairs = false; break; }
          if (allPairs) return { t: T.PLANE2, r: s, n: n };
        } else {
          if (remTotal !== k) continue;
          let okk = true;
          for (let i = 0; i < remRanks.length; i++) if (rem[remRanks[i]] >= 3) { okk = false; break; }
          if (okk) return { t: T.PLANE1, r: s, n: n };
        }
      }
    }
    return null;
  }
  DDZ.analyze = analyze;

  /* a 能否压过 b（b 为 null 表示自由出牌） */
  function beats(a, b) {
    if (!b) return !!a;
    if (!a) return false;
    if (a.t === T.ROCKET) return true;
    if (b.t === T.ROCKET) return false;
    if (a.t === T.BOMB && b.t !== T.BOMB) return true;
    if (b.t === T.BOMB && a.t !== T.BOMB) return false;
    if (a.t !== b.t) return false;
    if (a.n !== b.n) return false;
    return a.r > b.r;
  }
  DDZ.beats = beats;

  /* ========== 带牌候选 ========== */
  /* 三带一的带牌：优先散牌、再拆对、点数小的优先 */
  function kickSingles(c, ex, limit) {
    const cand = [];
    for (let r = 3; r <= 17; r++) {
      if (r === ex || c[r] === 0) continue;
      cand.push({ r: r, w: c[r] === 1 ? 0 : c[r] === 2 ? 1 : c[r] === 3 ? 2 : 3 });
    }
    cand.sort(function (a, b) { return a.w - b.w || a.r - b.r; });
    const out = [];
    for (let i = 0; i < cand.length && out.length < limit; i++) out.push(cand[i].r);
    return out;
  }

  function kickPairs(c, ex, limit) {
    const cand = [];
    for (let r = 3; r <= 17; r++) {
      if (r === ex || c[r] < 2) continue;
      cand.push({ r: r, w: c[r] === 2 ? 0 : c[r] === 3 ? 1 : 2 });
    }
    cand.sort(function (a, b) { return a.w - b.w || a.r - b.r; });
    const out = [];
    for (let i = 0; i < cand.length && out.length < limit; i++) out.push(cand[i].r);
    return out;
  }

  /* 飞机/四带二 需要一次取 k 张散牌：返回若干组候选 */
  function kickSinglesMulti(rem, k, limit) {
    const cards = [];
    for (let r = 3; r <= 17; r++) {
      for (let i = 0; i < rem[r]; i++) cards.push({ r: r, w: rem[r] === 1 ? 0 : rem[r] === 2 ? 1 : 2 });
    }
    /* 拆三张当单牌会产生歧义牌型，尽量排除 */
    const safe = cards.filter(function (x) { return x.w <= 1; });
    const pool = safe.length >= k ? safe : cards;
    pool.sort(function (a, b) { return a.w - b.w || a.r - b.r; });
    const out = [];
    for (let t = 0; t < limit; t++) {
      const set = [];
      for (let i = t; i < k + t && i < pool.length; i++) set.push(pool[i].r);
      if (set.length === k) out.push(set);
    }
    return out;
  }

  function kickPairsMulti(rem, k, limit) {
    const cand = [];
    for (let r = 3; r <= 17; r++) if (rem[r] >= 2) cand.push({ r: r, w: rem[r] === 2 ? 0 : 1 });
    cand.sort(function (a, b) { return a.w - b.w || a.r - b.r; });
    const out = [];
    for (let t = 0; t < limit; t++) {
      const set = [];
      for (let i = t; i < k + t && i < cand.length; i++) set.push(cand[i].r);
      if (set.length === k) out.push(set);
    }
    return out;
  }

  /* ========== 合法出牌枚举 ========== */
  function genFree(c, out) {
    const rk = [];
    for (let r = 3; r <= 17; r++) if (c[r] > 0) rk.push(r);

    for (let i = 0; i < rk.length; i++) {
      const r = rk[i];
      let m = new Int8Array(18); m[r] = 1; out.push(m);
      if (c[r] >= 2) { m = new Int8Array(18); m[r] = 2; out.push(m); }
      if (c[r] >= 3) {
        m = new Int8Array(18); m[r] = 3; out.push(m);
        const ks = kickSingles(c, r, 2);
        for (let j = 0; j < ks.length; j++) { const m2 = new Int8Array(18); m2[r] = 3; m2[ks[j]] = 1; out.push(m2); }
        const kp = kickPairs(c, r, 2);
        for (let j = 0; j < kp.length; j++) { const m2 = new Int8Array(18); m2[r] = 3; m2[kp[j]] = 2; out.push(m2); }
      }
      if (c[r] === 4) { m = new Int8Array(18); m[r] = 4; out.push(m); }
    }
    if (c[16] && c[17]) { const m = new Int8Array(18); m[16] = 1; m[17] = 1; out.push(m); }

    /* 顺子 */
    for (let len = 5; len <= 12; len++) {
      for (let s = 3; s + len - 1 <= 14; s++) {
        let ok = true;
        for (let i = 0; i < len; i++) if (c[s + i] < 1) { ok = false; break; }
        if (!ok) continue;
        const m = new Int8Array(18);
        for (let i = 0; i < len; i++) m[s + i] = 1;
        out.push(m);
      }
    }
    /* 连对 */
    for (let len = 3; len <= 10; len++) {
      for (let s = 3; s + len - 1 <= 14; s++) {
        let ok = true;
        for (let i = 0; i < len; i++) if (c[s + i] < 2) { ok = false; break; }
        if (!ok) continue;
        const m = new Int8Array(18);
        for (let i = 0; i < len; i++) m[s + i] = 2;
        out.push(m);
      }
    }
    /* 飞机（纯 / 带单 / 带对） */
    for (let k = 2; k <= 6; k++) {
      for (let s = 3; s + k - 1 <= 14; s++) {
        let ok = true;
        for (let i = 0; i < k; i++) if (c[s + i] < 3) { ok = false; break; }
        if (!ok) continue;
        const base = new Int8Array(18);
        for (let i = 0; i < k; i++) base[s + i] = 3;
        out.push(base);
        const rem = c.slice();
        for (let i = 0; i < k; i++) rem[s + i] -= 3;
        const ss = kickSinglesMulti(rem, k, 2);
        for (let j = 0; j < ss.length; j++) {
          const m = base.slice(); for (let q = 0; q < k; q++) m[ss[j][q]]++;
          out.push(m);
        }
        const pp = kickPairsMulti(rem, k, 1);
        for (let j = 0; j < pp.length; j++) {
          const m = base.slice(); for (let q = 0; q < k; q++) m[pp[j][q]] += 2;
          out.push(m);
        }
      }
    }
    /* 四带二 */
    for (let i = 0; i < rk.length; i++) {
      const r = rk[i];
      if (c[r] !== 4) continue;
      const rem = c.slice(); rem[r] = 0;
      const s1 = kickSinglesMulti(rem, 2, 1);
      for (let j = 0; j < s1.length; j++) {
        const m = new Int8Array(18); m[r] = 4;
        for (let q = 0; q < 2; q++) m[s1[j][q]]++;
        out.push(m);
      }
      const p1 = kickPairsMulti(rem, 2, 1);
      for (let j = 0; j < p1.length; j++) {
        const m = new Int8Array(18); m[r] = 4;
        for (let q = 0; q < 2; q++) m[p1[j][q]] += 2;
        out.push(m);
      }
    }
  }

  function genBeat(c, last, out) {
    const t = last.t, R = last.r, N = last.n;

    if (t !== T.ROCKET && t !== T.BOMB) {
      if (t === T.SINGLE) {
        for (let r = R + 1; r <= 17; r++) if (c[r] >= 1) { const m = new Int8Array(18); m[r] = 1; out.push(m); }
      } else if (t === T.PAIR) {
        for (let r = R + 1; r <= 17; r++) if (c[r] >= 2) { const m = new Int8Array(18); m[r] = 2; out.push(m); }
      } else if (t === T.TRIO) {
        for (let r = R + 1; r <= 17; r++) if (c[r] >= 3) { const m = new Int8Array(18); m[r] = 3; out.push(m); }
      } else if (t === T.TRIO1 || t === T.TRIO2) {
        const need = t === T.TRIO1 ? 1 : 2;
        for (let r = R + 1; r <= 17; r++) {
          if (c[r] < 3) continue;
          const ks = need === 1 ? kickSingles(c, r, 1) : kickPairs(c, r, 1);
          if (!ks.length) continue;
          const m = new Int8Array(18); m[r] = 3; m[ks[0]] = need;
          out.push(m);
        }
      } else if (t === T.STRAIGHT) {
        for (let s = R + 1; s + N - 1 <= 14; s++) {
          let ok = true;
          for (let i = 0; i < N; i++) if (c[s + i] < 1) { ok = false; break; }
          if (!ok) continue;
          const m = new Int8Array(18);
          for (let i = 0; i < N; i++) m[s + i] = 1;
          out.push(m);
        }
      } else if (t === T.PAIRS) {
        const len = N / 2;
        for (let s = R + 1; s + len - 1 <= 14; s++) {
          let ok = true;
          for (let i = 0; i < len; i++) if (c[s + i] < 2) { ok = false; break; }
          if (!ok) continue;
          const m = new Int8Array(18);
          for (let i = 0; i < len; i++) m[s + i] = 2;
          out.push(m);
        }
      } else if (t === T.PLANE || t === T.PLANE1 || t === T.PLANE2) {
        const k = t === T.PLANE ? N / 3 : t === T.PLANE1 ? N / 4 : N / 5;
        for (let s = R + 1; s + k - 1 <= 14; s++) {
          let ok = true;
          for (let i = 0; i < k; i++) if (c[s + i] < 3) { ok = false; break; }
          if (!ok) continue;
          const base = new Int8Array(18);
          for (let i = 0; i < k; i++) base[s + i] = 3;
          if (t === T.PLANE) { out.push(base); continue; }
          const rem = c.slice();
          for (let i = 0; i < k; i++) rem[s + i] -= 3;
          if (t === T.PLANE1) {
            const ss = kickSinglesMulti(rem, k, 1);
            for (let j = 0; j < ss.length; j++) {
              const m = base.slice();
              for (let q = 0; q < k; q++) m[ss[j][q]]++;
              out.push(m);
            }
          } else {
            const pp = kickPairsMulti(rem, k, 1);
            for (let j = 0; j < pp.length; j++) {
              const m = base.slice();
              for (let q = 0; q < k; q++) m[pp[j][q]] += 2;
              out.push(m);
            }
          }
        }
      } else if (t === T.FOUR2 || t === T.FOUR4) {
        for (let r = R + 1; r <= 17; r++) {
          if (c[r] !== 4) continue;
          const rem = c.slice(); rem[r] = 0;
          if (t === T.FOUR2) {
            const s1 = kickSinglesMulti(rem, 2, 1);
            for (let j = 0; j < s1.length; j++) {
              const m = new Int8Array(18); m[r] = 4;
              for (let q = 0; q < 2; q++) m[s1[j][q]]++;
              out.push(m);
            }
          } else {
            const p1 = kickPairsMulti(rem, 2, 1);
            for (let j = 0; j < p1.length; j++) {
              const m = new Int8Array(18); m[r] = 4;
              for (let q = 0; q < 2; q++) m[p1[j][q]] += 2;
              out.push(m);
            }
          }
        }
      }
    }

    /* 王炸压无可压 */
    if (t === T.ROCKET) return;

    /* 炸弹（含压炸弹） */
    for (let r = 3; r <= 17; r++) {
      if (c[r] !== 4) continue;
      if (t === T.BOMB && r <= R) continue;
      const m = new Int8Array(18); m[r] = 4; out.push(m);
    }
    /* 王炸 */
    if (c[16] && c[17]) {
      const m = new Int8Array(18); m[16] = 1; m[17] = 1; out.push(m);
    }
  }

  /* 待压牌可以是 null / 原始 counts / 已解析对象，统一成已解析对象 */
  function normLast(last) {
    if (!last) return null;
    if (last.t !== undefined) return last;
    return analyze(last);
  }

  function genMoves(c, last) {
    last = normLast(last);
    const out = [];
    if (!last) genFree(c, out);
    else genBeat(c, last, out);
    return out;
  }
  DDZ.genMoves = genMoves;

  /* 校验一手牌是否在手牌里且能压 last */
  function isLegal(c, m, last) {
    for (let r = 3; r <= 17; r++) if (m[r] > c[r]) return false;
    const a = analyze(m);
    if (!a) return false;
    return beats(a, normLast(last));
  }
  DDZ.isLegal = isLegal;

  /* ========== 手牌拆分（最少手数近似） ========== */
  /* 返回拆分出的组（每组是一个 counts），用于启发式出牌与特征 */
  function decompose(c) {
    const rem = c.slice();
    const groups = [];
    const mk = function (pairs) {
      const m = new Int8Array(18);
      for (let i = 0; i < pairs.length; i++) m[pairs[i][0]] += pairs[i][1];
      for (let r = 3; r <= 17; r++) rem[r] -= m[r];
      groups.push(m);
    };

    if (rem[16] && rem[17]) mk([[16, 1], [17, 1]]);
    for (let r = 3; r <= 15; r++) if (rem[r] === 4) mk([[r, 4]]);

    /* 飞机（连续三张） */
    for (let k = 6; k >= 2; k--) {
      for (let s = 3; s + k - 1 <= 14; s++) {
        let ok = true;
        for (let i = 0; i < k; i++) if (rem[s + i] < 3) { ok = false; break; }
        if (!ok) continue;
        const pr = [];
        for (let i = 0; i < k; i++) pr.push([s + i, 3]);
        mk(pr);
      }
    }
    /* 顺子：从长到短 */
    for (let len = 12; len >= 5; len--) {
      let found = true;
      while (found) {
        found = false;
        for (let s = 3; s + len - 1 <= 14; s++) {
          let ok = true;
          for (let i = 0; i < len; i++) if (rem[s + i] < 1) { ok = false; break; }
          if (!ok) continue;
          const pr = [];
          for (let i = 0; i < len; i++) pr.push([s + i, 1]);
          mk(pr); found = true; break;
        }
      }
    }
    /* 连对 */
    for (let len = 10; len >= 3; len--) {
      let found = true;
      while (found) {
        found = false;
        for (let s = 3; s + len - 1 <= 14; s++) {
          let ok = true;
          for (let i = 0; i < len; i++) if (rem[s + i] < 2) { ok = false; break; }
          if (!ok) continue;
          const pr = [];
          for (let i = 0; i < len; i++) pr.push([s + i, 2]);
          mk(pr); found = true; break;
        }
      }
    }
    /* 三张 / 对子 / 单张 */
    for (let r = 3; r <= 17; r++) if (rem[r] >= 3) mk([[r, 3]]);
    for (let r = 3; r <= 17; r++) if (rem[r] >= 2) mk([[r, 2]]);
    for (let r = 3; r <= 17; r++) if (rem[r] >= 1) mk([[r, 1]]);
    return groups;
  }
  DDZ.decompose = decompose;

  function handCount(c) {
    let n = 0;
    const g = decompose(c);
    n = g.length;
    /* 三张/飞机若有带牌可并入手数，这里做一次折算 */
    let trios = 0, singles = 0, pairs = 0;
    for (let i = 0; i < g.length; i++) {
      const a = analyze(g[i]);
      if (!a) continue;
      if (a.t === T.TRIO || a.t === T.PLANE) trios++;
      else if (a.t === T.SINGLE) singles++;
      else if (a.t === T.PAIR) pairs++;
    }
    return Math.max(1, n);
  }
  DDZ.handCount = handCount;

  /* 叫分用的手牌强度（0..1 粗估） */
  function handStrength(c) {
    let s = 0;
    if (c[17]) s += 0.16;
    if (c[16]) s += 0.10;
    if (c[16] && c[17]) s += 0.10;
    for (let r = 3; r <= 15; r++) if (c[r] === 4) s += 0.20;
    s += Math.max(0, (c[15] - 0) * 0.10);   /* 2 */
    s += Math.max(0, (c[14] - 0) * 0.05);   /* A */
    s += 0.30 * (1 - Math.min(1, (handCount(c) - 6) / 10));
    return Math.max(0, Math.min(1, s));
  }
  DDZ.handStrength = handStrength;

  /* ========== 对局 ========== */
  function shuffleDeal(rand) {
    const deck = new Int8Array(54);
    for (let i = 0; i < 54; i++) deck[i] = i;
    for (let i = 53; i > 0; i--) {
      const j = (rand() * (i + 1)) | 0;
      const t = deck[i]; deck[i] = deck[j]; deck[j] = t;
    }
    const hands = [newCounts(), newCounts(), newCounts()];
    const ids = [[], [], []];
    for (let i = 0; i < 51; i++) {
      const id = deck[i], seat = i % 3;
      hands[seat][cardRank(id)]++;
      ids[seat].push(id);
    }
    return { hands: hands, ids: ids, bottom: [deck[51], deck[52], deck[53]] };
  }

  class Game {
    constructor(opts) {
      opts = opts || {};
      this.rand = opts.rand || Math.random;
      const d = shuffleDeal(this.rand);
      this.hands = d.hands;
      this.ids = d.ids;
      this.bottom = d.bottom;
      this.landlord = -1;
      this.bids = [0, 0, 0];
      this.bidTurn = 0;
      this.bidCount = 0;
      this.bestBid = 0;
      this.bestSeat = -1;
      this.turn = 0;
      this.lastMove = null;
      this.lastSeat = -1;
      this.passes = 0;
      this.played = newCounts();
      this.multiplier = 1;
      this.base = 1;
      this.phase = 'bid';
      this.winner = -1;
      this.moveCount = [0, 0, 0];
      this.bombCount = 0;
      this.history = [];
      this.redealCount = 0;
    }

    clone() { return Object.assign(Object.create(Game.prototype), this, {
      hands: this.hands.map(function (h) { return h.slice(); }),
      ids: this.ids.map(function (a) { return a.slice(); }),
      bids: this.bids.slice(),
      moveCount: this.moveCount.slice(),
      played: this.played.slice(),
      history: this.history.slice()
    }); }

    handSize(seat) { return total(this.hands[seat]); }

    /* ---- 叫分 ---- */
    bid(seat, score) {
      if (this.phase !== 'bid' || seat !== this.bidTurn) return false;
      if (score > 0 && score <= this.bestBid) return false;
      this.bids[seat] = score;
      if (score > this.bestBid) { this.bestBid = score; this.bestSeat = seat; }
      this.bidCount++;
      if (score === 3) { this._setLandlord(seat); return true; }
      if (this.bidCount >= 3) {
        if (this.bestSeat < 0) { this.phase = 'redeal'; }
        else this._setLandlord(this.bestSeat);
        return true;
      }
      this.bidTurn = (this.bidTurn + 1) % 3;
      return true;
    }

    _setLandlord(seat) {
      this.landlord = seat;
      const b = this.bottom;
      for (let i = 0; i < 3; i++) {
        this.hands[seat][cardRank(b[i])]++;
        this.ids[seat].push(b[i]);
      }
      this.base = Math.max(1, this.bestBid);
      this.multiplier = 1;
      this.turn = seat;
      this.lastMove = null;
      this.lastSeat = -1;
      this.passes = 0;
      this.phase = 'play';
    }

    /* ---- 出牌 ---- */
    legalMoves(seat) {
      if (this.phase !== 'play' || seat !== this.turn) return [];
      return genMoves(this.hands[seat], this.lastSeat === seat ? null : this.lastMove);
    }

    canPass() {
      return this.lastMove !== null && this.lastSeat !== this.turn;
    }

    play(seat, move) {
      if (this.phase !== 'play' || seat !== this.turn) return false;
      const last = this.lastSeat === seat ? null : this.lastMove;
      if (!isLegal(this.hands[seat], move, last)) return false;
      const a = analyze(move);

      for (let r = 3; r <= 17; r++) {
        if (move[r]) {
          this.hands[seat][r] -= move[r];
          this.played[r] += move[r];
        }
      }
      /* 同步 id 列表（仅 UI 需要，训练时可忽略） */
      this._removeIds(seat, move);

      this.lastMove = move;
      this.lastSeat = seat;
      this.passes = 0;
      this.moveCount[seat]++;
      if (a.t === T.BOMB || a.t === T.ROCKET) { this.multiplier *= 2; this.bombCount++; }
      this.history.push({ seat: seat, move: move, t: a.t });

      if (total(this.hands[seat]) === 0) {
        this.phase = 'over';
        this.winner = seat;
        this._settle();
        return true;
      }
      this.turn = (seat + 1) % 3;
      return true;
    }

    _removeIds(seat, move) {
      const arr = this.ids[seat];
      if (!arr || !arr.length) return;
      const need = new Int8Array(18);
      for (let r = 3; r <= 17; r++) need[r] = move[r];
      const keep = [];
      for (let i = 0; i < arr.length; i++) {
        const r = cardRank(arr[i]);
        if (need[r] > 0) { need[r]--; } else keep.push(arr[i]);
      }
      this.ids[seat] = keep;
    }

    pass(seat) {
      if (this.phase !== 'play' || seat !== this.turn) return false;
      if (this.lastMove === null || this.lastSeat === seat) return false;
      this.passes++;
      this.history.push({ seat: seat, move: null, t: 0 });
      this.turn = (seat + 1) % 3;
      if (this.passes >= 2) {
        this.lastMove = null;
        this.lastSeat = -1;
        this.passes = 0;
      }
      return true;
    }

    _settle() {
      const L = this.landlord;
      const landlordWin = this.winner === L;
      /* 春天 */
      let spring = false;
      if (landlordWin) {
        const f1 = (L + 1) % 3, f2 = (L + 2) % 3;
        if (this.moveCount[f1] === 0 && this.moveCount[f2] === 0) spring = true;
      } else {
        if (this.moveCount[L] === 1) spring = true;
      }
      if (spring) this.multiplier *= 2;
      this.spring = spring;
      this.landlordWin = landlordWin;
      this.landlordSeat = L;
      this.score = this.base * this.multiplier;
    }

    isFarmerWin(seat) { return this.phase === 'over' && this.winner !== this.landlord; }
  }

  DDZ.Game = Game;

  /* ========== 工具：把 counts 转成 id 列表（UI 用） ========== */
  DDZ.countsToIds = function (idsAvailable, move) {
    const need = new Int8Array(18);
    for (let r = 3; r <= 17; r++) need[r] = move[r];
    const out = [];
    for (let i = 0; i < idsAvailable.length; i++) {
      const r = cardRank(idsAvailable[i]);
      if (need[r] > 0) { need[r]--; out.push(idsAvailable[i]); }
    }
    return out;
  };

  /* 一手牌排序显示：点数降序，同点数按花色 */
  DDZ.sortIds = function (ids) {
    return ids.slice().sort(function (a, b) {
      const ra = cardRank(a), rb = cardRank(b);
      if (ra !== rb) return rb - ra;
      return (a & 3) - (b & 3);
    });
  };
})();
</script>
<script>/* 启发式机器人 —— 训练对手 / 评测基线 / 简单难度 AI */
(function () {
  'use strict';
  const G = globalThis;
  const DDZ = (G.DDZ = G.DDZ || {});
  const T = DDZ.T;
  const analyze = DDZ.analyze;
  const handCount = DDZ.handCount;
  const total = DDZ.total;

  function partner(seat, landlord) {
    /* 农民队友 */
    if (seat === landlord) return -1;
    for (let i = 0; i < 3; i++) if (i !== seat && i !== landlord) return i;
    return -1;
  }

  function isTeammate(seat, other, landlord) {
    return seat !== landlord && other !== landlord && seat !== other;
  }

  /* 出完这一手之后的“手数代价” */
  function handCost(hand, move) {
    const after = hand.slice();
    for (let r = 3; r <= 17; r++) after[r] -= move[r];
    return { count: handCount(after), remain: total(after), after: after };
  }

  function scoreMove(hand, move, before, urgent) {
    const a = analyze(move);
    const c = handCost(hand, move);
    let s = c.count * 12;
    /* 理想情况：本手消耗掉一手，手数应减 1 */
    s += Math.max(0, c.count - (before - 1)) * 16;
    s += a.r * 0.35;                       /* 同等结构下出小牌 */
    s -= total(move) * 0.9;                /* 倾向一次多走牌 */
    if (a.t === T.BOMB) s += urgent ? 18 : 55;
    if (a.t === T.ROCKET) s += urgent ? 24 : 80;
    if (c.remain === 0) s -= 2000;
    return s;
  }

  function chooseBid(game, seat) {
    const st = DDZ.handStrength(game.hands[seat]);
    const need = game.bestBid + 1;
    let want = st < 0.34 ? 0 : st < 0.48 ? 1 : st < 0.62 ? 2 : 3;
    if (want < need) return 0;
    return want;
  }

  function chooseMove(game, seat) {
    const hand = game.hands[seat];
    const last = game.lastSeat === seat ? null : game.lastMove;
    const moves = DDZ.genMoves(hand, last);
    if (moves.length === 0) return null;

    const landlord = game.landlord;
    const before = handCount(hand);
    const mySize = total(hand);

    /* 最紧迫的对手还剩几张 */
    let minOpp = 99;
    for (let i = 0; i < 3; i++) {
      if (i === seat) continue;
      if (i === landlord || seat === landlord) {
        if (isTeammate(seat, i, landlord)) continue;
        minOpp = Math.min(minOpp, total(game.hands[i]));
      }
    }
    const urgent = minOpp <= 2 || mySize <= 5;

    /* 能一次走完就走 */
    for (const m of moves) {
      if (total(m) === mySize) return m;
    }

    /* 领出：直接在所有候选里挑代价最小的 */
    if (!last) {
      let best = null, bestS = 1e9;
      for (const m of moves) {
        const s = scoreMove(hand, m, before, urgent);
        if (s < bestS) { bestS = s; best = m; }
      }
      return best;
    }

    /* 跟牌 */
    const teammateLed = isTeammate(seat, game.lastSeat, landlord);
    /* 队友出的牌，一般不去压，除非自己能走完（上面已处理） */
    if (teammateLed && !urgent) {
      /* 队友只剩很少牌时不压；队友牌多且我这边能安全接管时考虑压 */
      if (total(game.hands[game.lastSeat]) <= mySize) return null;
    }

    let best = null, bestS = 1e9, bestPenalty = 0;
    for (const m of moves) {
      const a = analyze(m);
      const c = handCost(hand, m);
      const penalty = c.count - (before - 1);
      const s = scoreMove(hand, m, before, urgent);
      if (s < bestS) { bestS = s; best = m; bestPenalty = penalty; }
      /* 压队友时更保守：只有明显更好才接管 */
      if (teammateLed && penalty > 0 && s > bestS + 20) continue;
    }

    if (!best) return null;
    /* 需要拆结构且局面不紧张 -> 宁可不出 */
    if (bestPenalty >= 2 && !urgent) return null;
    const ba = analyze(best);
    if ((ba.t === T.BOMB || ba.t === T.ROCKET) && !urgent) {
      /* 炸弹留着，除非对面快走完 */
      return null;
    }
    return best;
  }

  DDZ.HeuristicBot = {
    name: 'heuristic',
    chooseBid: chooseBid,
    chooseMove: chooseMove
  };
})();
</script>
<script>/* 特征工程 + 价值网络（单隐层 MLP）+ 1 步搜索策略 */
(function () {
  'use strict';
  const G = globalThis;
  const DDZ = (G.DDZ = G.DDZ || {});
  const T = DDZ.T;
  const analyze = DDZ.analyze;
  const total = DDZ.total;
  const handCount = DDZ.handCount;

  /* ---------- 状态视图（以 me 为视角，不含对手手牌内容） ---------- */
  function stateFor(game, me) {
    const sizes = [total(game.hands[0]), total(game.hands[1]), total(game.hands[2])];
    const freeLead = game.lastMove === null || game.lastSeat === me;
    return {
      me: me,
      hand: game.hands[me],
      sizes: sizes,
      landlord: game.landlord,
      turn: game.turn,
      lastMove: freeLead ? null : game.lastMove,
      played: game.played,
      mult: game.multiplier,
      isLeading: freeLead
    };
  }

  /* 我出了 move 之后的状态（仍以我为视角评估） */
  function afterMove(st, move, nextSeat) {
    const hand = st.hand.slice();
    for (let r = 3; r <= 17; r++) hand[r] -= move[r];
    const sizes = st.sizes.slice();
    sizes[st.me] -= total(move);
    return {
      me: st.me, hand: hand, sizes: sizes, landlord: st.landlord,
      turn: nextSeat, lastMove: move, played: st.played, mult: st.mult,
      isLeading: false
    };
  }

  /* 我选择过牌之后的状态 */
  function afterPass(st, nextSeat) {
    return {
      me: st.me, hand: st.hand, sizes: st.sizes, landlord: st.landlord,
      turn: nextSeat, lastMove: st.lastMove, played: st.played, mult: st.mult,
      isLeading: false
    };
  }

  /* ---------- 特征 ---------- */
  const hcCache = new Map();
  function handCountCached(hand) {
    const key = hand.slice(3).join('');
    let v = hcCache.get(key);
    if (v === undefined) {
      v = handCount(hand);
      if (hcCache.size > 60000) hcCache.clear();
      hcCache.set(key, v);
    }
    return v;
  }

  function buildFeatures(st) {
    const f = [];
    const me = st.me, hand = st.hand, sizes = st.sizes, L = st.landlord;
    const mine = sizes[me];
    const nxt = (me + 1) % 3, prv = (me + 2) % 3;
    const amLandlord = me === L;

    f.push(mine / 20);
    f.push(sizes[nxt] / 20);
    f.push(sizes[prv] / 20);
    f.push(amLandlord ? 1 : 0);
    f.push(st.turn === me ? 1 : 0);
    f.push((st.turn === me && st.isLeading) ? 1 : 0);

    const lm = st.lastMove;
    const la = lm ? analyze(lm) : null;
    f.push(lm ? total(lm) / 20 : 0);
    f.push(la ? la.r / 17 : 0);
    for (let t = 1; t <= 14; t++) f.push(la && la.t === t ? 1 : 0);

    for (let r = 3; r <= 17; r++) f.push(hand[r] / 4);
    for (let r = 3; r <= 17; r++) f.push(st.played[r] / 4);

    let bombs = 0, jok = 0, maxr = 3, singles = 0, pairs = 0;
    for (let r = 3; r <= 15; r++) if (hand[r] === 4) bombs++;
    if (hand[16]) jok++;
    if (hand[17]) jok++;
    for (let r = 17; r >= 3; r--) if (hand[r]) { maxr = r; break; }
    for (let r = 3; r <= 17; r++) { if (hand[r] === 1) singles++; else if (hand[r] === 2) pairs++; }

    f.push(bombs / 2);
    f.push(jok / 2);
    f.push(maxr / 17);
    f.push(Math.min(12, handCountCached(hand)) / 12);
    f.push(mine <= 2 ? 1 : 0);
    f.push(mine <= 4 ? 1 : 0);
    f.push(singles / 8);
    f.push(pairs / 6);
    f.push((hand[16] && hand[17]) ? 1 : 0);

    /* 离我最近的危险对手 */
    let minOpp = 99;
    for (let i = 0; i < 3; i++) {
      if (i === me) continue;
      if (amLandlord === (i === L)) continue; /* 同阵营跳过 */
      if (sizes[i] < minOpp) minOpp = sizes[i];
    }
    f.push(minOpp <= 2 ? 1 : 0);
    f.push(minOpp <= 5 ? 1 : 0);

    /* 队友（农民视角）手牌数 */
    let mate = -1;
    if (!amLandlord) for (let i = 0; i < 3; i++) if (i !== me && i !== L) mate = i;
    f.push(mate >= 0 ? sizes[mate] / 20 : 0);

    f.push(Math.log2(Math.max(1, st.mult)) / 3);
    return Float32Array.from(f);
  }

  const DIM = buildFeatures({
    me: 0, hand: new Int8Array(18), sizes: [17, 17, 17], landlord: 0,
    turn: 0, lastMove: null, played: new Int8Array(18), mult: 1, isLeading: true
  }).length;

  DDZ.FEATURE_DIM = DIM;
  DDZ.buildFeatures = buildFeatures;
  DDZ.stateFor = stateFor;
  DDZ.afterMove = afterMove;
  DDZ.afterPass = afterPass;

  /* ---------- MLP ---------- */
  function randn() {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }

  class MLP {
    constructor(dim, hidden) {
      this.dim = dim;
      this.hidden = hidden;
      this.W1 = new Float32Array(hidden * dim);
      this.b1 = new Float32Array(hidden);
      this.W2 = new Float32Array(hidden);
      this.b2 = new Float32Array(1);
      const s1 = Math.sqrt(2 / dim), s2 = Math.sqrt(2 / hidden);
      for (let i = 0; i < this.W1.length; i++) this.W1[i] = randn() * s1;
      for (let i = 0; i < this.W2.length; i++) this.W2[i] = randn() * s2;
      this._h = new Float32Array(hidden);
    }

    forward(x) {
      const h = this.hidden, dim = this.dim, hbuf = this._h;
      const W1 = this.W1, b1 = this.b1, W2 = this.W2;
      for (let j = 0; j < h; j++) {
        let s = b1[j];
        const off = j * dim;
        for (let i = 0; i < dim; i++) s += W1[off + i] * x[i];
        hbuf[j] = s > 0 ? s : 0;
      }
      let o = this.b2[0];
      for (let j = 0; j < h; j++) o += W2[j] * hbuf[j];
      return 1 / (1 + Math.exp(-o));
    }

    toJSON() {
      return {
        dim: this.dim, hidden: this.hidden,
        W1: Array.from(this.W1), b1: Array.from(this.b1),
        W2: Array.from(this.W2), b2: Array.from(this.b2)
      };
    }

    static fromJSON(o) {
      const m = new MLP(o.dim, o.hidden);
      m.W1.set(o.W1); m.b1.set(o.b1); m.W2.set(o.W2); m.b2.set(o.b2);
      return m;
    }
  }
  DDZ.MLP = MLP;

  /* ---------- Adam 训练器 ---------- */
  class Trainer {
    constructor(net, lr) {
      this.net = net;
      this.lr = lr === undefined ? 0.003 : lr;
      const shapes = [
        ['W1', net.W1.length], ['b1', net.b1.length],
        ['W2', net.W2.length], ['b2', net.b2.length]
      ];
      this.m = {}; this.v = {};
      for (const [k, n] of shapes) { this.m[k] = new Float32Array(n); this.v[k] = new Float32Array(n); }
      this.t = 0;
      this.gW1 = new Float32Array(net.W1.length);
      this.gb1 = new Float32Array(net.b1.length);
      this.gW2 = new Float32Array(net.W2.length);
      this.gb2 = new Float32Array(1);
    }

    /* 单条样本累加梯度 */
    _accum(x, y, hbuf, dh) {
      const net = this.net, dim = net.dim, H = net.hidden;
      const W1 = net.W1, b1 = net.b1, W2 = net.W2;
      for (let j = 0; j < H; j++) {
        let s = b1[j];
        const off = j * dim;
        for (let i = 0; i < dim; i++) s += W1[off + i] * x[i];
        hbuf[j] = s > 0 ? s : 0;
      }
      let o = net.b2[0];
      for (let j = 0; j < H; j++) o += W2[j] * hbuf[j];
      const p = 1 / (1 + Math.exp(-o));
      const d = p - y;                       /* BCE + sigmoid 的梯度 */
      for (let j = 0; j < H; j++) {
        this.gW2[j] += d * hbuf[j];
        dh[j] = d * W2[j] * (hbuf[j] > 0 ? 1 : 0);
      }
      this.gb2[0] += d;
      for (let j = 0; j < H; j++) {
        const dj = dh[j];
        if (dj === 0) continue;
        const off = j * dim;
        for (let i = 0; i < dim; i++) this.gW1[off + i] += dj * x[i];
        this.gb1[j] += dj;
      }
      return p;
    }

    _adam(arr, grad, mk, vk, n) {
      const lr = this.lr, b1 = 0.9, b2 = 0.999, eps = 1e-8;
      const t = this.t;
      const c1 = 1 - Math.pow(b1, t), c2 = 1 - Math.pow(b2, t);
      for (let i = 0; i < n; i++) {
        const g = grad[i];
        mk[i] = b1 * mk[i] + (1 - b1) * g;
        vk[i] = b2 * vk[i] + (1 - b2) * g * g;
        arr[i] -= lr * (mk[i] / c1) / (Math.sqrt(vk[i] / c2) + eps);
      }
    }

    /* X: Float32Array(n*dim)，y: Uint8Array(n) */
    trainEpoch(X, y, n, batchSize) {
      const dim = this.net.dim, H = this.net.hidden;
      const order = new Int32Array(n);
      for (let i = 0; i < n; i++) order[i] = i;
      for (let i = n - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        const t = order[i]; order[i] = order[j]; order[j] = t;
      }
      const hbuf = new Float32Array(H), dh = new Float32Array(H);
      let loss = 0;
      for (let start = 0; start < n; start += batchSize) {
        const end = Math.min(n, start + batchSize);

          const p = this._accum(x, y[idx], hbuf, dh);
          const pc = Math.min(1 - 1e-7, Math.max(1e-7, p));
          loss -= y[idx] ? Math.log(pc) : Math.log(1 - pc);
        }
        this.t++;
        const cnt = end - start;
        for (let i = 0; i < this.gW1.length; i++) this.gW1[i] /= cnt;
        for (let i = 0; i < this.gb1.length; i++) this.gb1[i] /= cnt;
        for (let i = 0; i < this.gW2.length; i++) this.gW2[i] /= cnt;
        this.gb2[0] /= cnt;
        this._adam(this.net.W1, this.gW1, this.m.W1, this.v.W1, this.net.W1.length);
        this._adam(this.net.b1, this.gb1, this.m.b1, this.v.b1, this.net.b1.length);
        this._adam(this.net.W2, this.gW2, this.m.W2, this.v.W2, this.net.W2.length);

  const EPS = 1e-4;

    const eps = opts.epsilon || 0;      /* 探索率（训练时用） */
    const usePass = opts.usePass !== false;
    /* 经验值：1 步贪心天然偏保守，需要额外的过牌门槛来抵消“让出主动权”的低估 */
    const passMargin = opts.passMargin === undefined ? 0.06 : opts.passMargin;
    const priorW = opts.prior === undefined ? 0.02 : opts.prior;

    return {
      name: opts.name || 'model',
      net: net,

      chooseBid: function (game, seat) {
        /* 叫分用简单强度估计，模型只负责打牌 */
        const st = DDZ.handStrength(game.hands[seat]);
        const need = game.bestBid + 1;
        let want = st < 0.36 ? 0 : st < 0.5 ? 1 : st < 0.64 ? 2 : 3;

        const mine = total(hand);
        /* 能一次走完直接走 */
        for (let i = 0; i < mv.length; i++) if (total(mv[i]) === mine) return mv[i];

        const st = stateFor(game, seat);
        const next = (seat + 1) % 3;

        if (eps > 0 && Math.random() < eps) {
          const pool = mv.slice();
          if (game.canPass() && usePass) pool.push(null);
          return pool[(Math.random() * pool.length) | 0];

        const before = handCountCached(hand);
        let bestS = -1e9, best = mv[0];
        for (let i = 0; i < mv.length; i++) {
          const m = mv[i];
          const s2 = afterMove(st, m, next);
          let s = net.forward(buildFeatures(s2));
          if (priorW !== 0) {
            /* 结构先验：拆散顺子/连对会抬高手数，网络价值接近时优先不拆 */

    return {
      name: 'random',
      chooseBid: function () { return 0; },
      chooseMove: function (game, seat) {
        const mv = DDZ.genMoves(game.hands[seat], game.lastSeat === seat ? null : game.lastMove);
        if (!mv.length) return null;
        if (game.canPass() && Math.random() < 0.35) return null;
        return mv[(Math.random() * mv.length) | 0];
      }
    };

<script>/* 对局运行器 + 评测 */
(function () {
  'use strict';
  const G = globalThis;
  const DDZ = (G.DDZ = G.DDZ || {});

  /* 三方策略对打一局。policies[seat] = {chooseBid, chooseMove}
     返回 null 表示流局（三家都不叫）或对局异常 */
  function playGame(policies, opts) {
    opts = opts || {};
    const rand = opts.rand || Math.random;
    const onMove = opts.onMove || null;
    const game = new DDZ.Game({ rand: rand });

    let guard = 0;
    while (game.phase === 'bid') {
      const seat = game.bidTurn;
      let sc = 0;
      try { sc = policies[seat].chooseBid(game, seat); } catch (e) { sc = 0; }
      if (!game.bid(seat, sc)) game.bid(seat, 0);
      if (++guard > 12) return null;
    }
    if (game.phase !== 'play') return null;   /* 流局 */

    guard = 0;
    while (game.phase === 'play') {
      const seat = game.turn;
      let mv = null;
      try { mv = policies[seat].chooseMove(game, seat); } catch (e) { mv = undefined; }

      if (mv === undefined) { mv = null; }

      if (mv) {
        if (!game.play(seat, mv)) {
          const ms = game.legalMoves(seat);
          if (ms.length) game.play(seat, ms[0]);
          else if (!game.pass(seat)) return null;
        }
      } else {
        if (!game.pass(seat)) {
          const ms = game.legalMoves(seat);
          if (ms.length) game.play(seat, ms[0]);
          else return null;
        }
      }
      if (onMove) onMove(game, seat, mv);
      if (++guard > 900) return null;
    }
    return game.phase === 'over' ? game : null;
  }

  DDZ.playGame = playGame;

  /* 让 policy 占据指定座位，其余座位用 opponent，统计 policy 所在阵营胜率 */
  function evalSeatRate(policy, opponent, games, seat, opts) {
    opts = opts || {};
    const rand = opts.rand || Math.random;
    let wins = 0, played = 0, redeal = 0;
    for (let i = 0; i < games; i++) {
      const pols = [opponent, opponent, opponent];
      pols[seat] = policy;
      const g = playGame(pols, { rand: rand });
      if (!g) { redeal++; continue; }
      played++;
      const isLandlord = g.landlord === seat;
      const myTeamWon = (g.winner === g.landlord) === isLandlord;
      if (myTeamWon) wins++;
    }
    return { wins: wins, played: played, redeal: redeal, rate: played ? wins / played : 0 };
  }

  /* 三个座位轮流，综合胜率（贴近“1 个玩家 + 2 个电脑”的部署形态） */
  DDZ.evaluate = function (policy, opponent, games, opts) {
    const per = Math.ceil(games / 3);
    let w = 0, n = 0, rd = 0;
    const detail = [];
    for (let seat = 0; seat < 3; seat++) {
      const r = evalSeatRate(policy, opponent, per, seat, opts);
      w += r.wins; n += r.played; rd += r.redeal;
      detail.push({ seat: seat, rate: r.rate, played: r.played });
    }
    return { rate: n ? w / n : 0, wins: w, played: n, redeal: rd, detail: detail };
  };

  /* 自对弈（三方同一策略），用于基线平衡检查 */
  DDZ.selfPlayRate = function (policy, games, opts) {
    let lw = 0, n = 0;
    for (let i = 0; i < games; i++) {
      const g = playGame([policy, policy, policy], opts || {});
      if (!g) continue;
      n++;
      if (g.winner === g.landlord) lw++;
    }
    return { landlordRate: n ? lw / n : 0, played: n };
  };
})();
</script>

  function sha256(msg) {
    const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    const l = msg.length, bl = Math.ceil((l + 9) / 64) * 64;
    const b = new Uint8Array(bl); b.set(msg); b[l] = 0x80;
    const bits = l * 8;
    for (let i = 0; i < 4; i++) b[bl - 1 - i] = (bits >>> (8 * i)) & 0xff;
    const w = new Uint32Array(64);
    const rotr = (x, n) => (x >>> n) | (x << (32 - n));
    for (let off = 0; off < bl; off += 64) {
      for (let i = 0; i < 16; i++) {
        w[i] = ((b[off + i * 4] << 24) | (b[off + i * 4 + 1] << 16) | (b[off + i * 4 + 2] << 8) | b[off + i * 4 + 3]) >>> 0;
      }
      for (let i = 16; i < 64; i++) {
        const s0 = (rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3)) >>> 0;
        const s1 = (rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10)) >>> 0;
        w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
      }
      let a = H[0], bb = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (let i = 0; i < 64; i++) {
        const S1 = (rotr(e,6) ^ rotr(e,11) ^ rotr(e,25)) >>> 0;
        const ch = ((e & f) ^ (~e & g)) >>> 0;
        const t1 = (h + S1 + ch + K256[i] + w[i]) >>> 0;
        const S0 = (rotr(a,2) ^ rotr(a,13) ^ rotr(a,22)) >>> 0;
        const mj = ((a & bb) ^ (a & c) ^ (bb & c)) >>> 0;
        const t2 = (S0 + mj) >>> 0;
        h = g; g = f; f = e; e = (d + t1) >>> 0;
        d = c; c = bb; bb = a; a = (t1 + t2) >>> 0;
      }
      H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + bb) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
      H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;

    for (let i = 0; i < 8; i++) {

    if (window.crypto && crypto.subtle && crypto.subtle.importKey) {

        const bits = await crypto.subtle.deriveBits(

  const SIGN_REWARDS = [400, 500, 600, 700, 800, 1000, 1500];
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function dayDiff(a, b) {
    return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000);
  }
  function signState() {
    const t = todayStr(), s = user.sign || { last: '', streak: 0 };
    if (s.last === t) return { done: true, day: Math.min(7, s.streak || 1) };
    const next = s.last && dayDiff(s.last, t) === 1 ? (s.streak || 0) + 1 : 1;
    return { done: false, day: Math.min(7, next) };
  }
  function buffHtml() {
    const out = [], now = Date.now();

      out.push('<span class="buff">金币 ×2 · ' + m + ' 分钟</span>');
    }
    if (user.buff.shield > 0) out.push('<span class="buff">护身符 ×' + user.buff.shield + '</span>');
    if (user.buff.lucky > 0) out.push('<span class="buff">幸运符 ×' + user.buff.lucky + '</span>');
    return out.join('');

  let modelNet = null;
  function getModel() {
    if (modelNet === null) {
      if (typeof WEIGHTS !== 'undefined' && WEIGHTS && WEIGHTS.W1 && WEIGHTS.W1.length > 0) {
        modelNet = D.MLP.fromJSON(WEIGHTS);
      } else { modelNet = false; }
    }
    return modelNet || null;
  }
  function policyFor(level) {
    if (level === 'hard' || level === 'grand') {
      const net = getModel();
      if (net) {
        return D.makeEnsemblePolicy(net, level === 'grand'
          ? { name: 'grand', passMargin: 0.01, epsilon: 0.02 }
          : { name: 'ensemble' });
      }
      return D.HeuristicBot;
    }
    if (level === 'easy') {
      const base = D.HeuristicBot;
      return {
        name: 'easy',
        chooseBid: function (g, s) { return Math.random() < 0.5 ? 0 : base.chooseBid(g, s); },
        chooseMove: function (g, s) {
          if (Math.random() < 0.38) {
            const ms = D.genMoves(g.hands[s], g.lastSeat === s ? null : g.lastMove);
            if (!ms.length) return null;
            if (g.canPass() && Math.random() < 0.5) return null;
            return ms[(Math.random() * ms.length) | 0];
          }
          return base.chooseMove(g, s);
        }
      };
    }
    return D.HeuristicBot;
  }

  let AC = null;
  function ac() {
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
    } catch (e) { AC = null; }
    return AC;
  }
  function sfx(kind) {
    const c = ac(); if (!c) return;
    const t = c.currentTime;
    try {
      if (kind === 'flick' || kind === 'deal') {
        const dur = 0.09;
        const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.6);
        const src = c.createBufferSource(); src.buffer = buf;
        const bp = c.createBiquadFilter(); bp.type = 'bandpass';
        bp.frequency.value = kind === 'deal' ? 1500 : 2200; bp.Q.value = 0.9;
        const g = c.createGain(); g.gain.value = kind === 'deal' ? 0.14 : 0.24;
        src.connect(bp); bp.connect(g); g.connect(c.destination);
        src.start(t);
        return;
      }
      if (kind === 'thud') {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(148, t);
        o.frequency.exponentialRampToValueAtTime(56, t + 0.18);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.22);
        return;
      }
      if (kind === 'bid' || kind === 'coin') {
        const base = kind === 'bid' ? 900 : 1220;
        [0, 0.075].forEach((dt, i) => {
          const o = c.createOscillator(), g = c.createGain();
          o.type = 'triangle'; o.frequency.value = base * (i ? 1.5 : 1);
          g.gain.setValueAtTime(0.0001, t + dt);
          g.gain.exponentialRampToValueAtTime(0.17, t + dt + 0.014);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.17);
          o.connect(g); g.connect(c.destination);
          o.start(t + dt); o.stop(t + dt + 0.2);
        });
        return;
      }
      if (kind === 'pass') {
        const o = c.createOscillator(), g = c.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(430, t);
        o.frequency.exponentialRampToValueAtTime(300, t + 0.13);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.09, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.19);
      }
    } catch (e) { }
  }

  function speak(text, seat) {

    try {

      u.lang = 'zh-CN';
      u.rate = 1.08;
      u.pitch = seat === 1 ? 0.78 : seat === 2 ? 1.44 : 1.02;
      u.volume = 0.95;
      const vs = S.getVoices().filter(v => /zh|Chinese|中文/i.test((v.lang || '') + (v.name || '')));
      if (vs.length) u.voice = vs[seat % vs.length];
      S.speak(u);
