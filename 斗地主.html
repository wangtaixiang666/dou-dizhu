  /* ---------- 剩牌告急（<=2 张）---------- */
  const LOW_LINES = {
    2: ['我就剩两张牌了！', '就两张，你说怎么拦？'],
    1: ['最后一张牌，接得住吗？', '一张牌，我赢定了！']
  };
  const LOW_TAUNT = {
    2: ['小心，他就剩两张了！', '别放他走，他两张牌了'],
    1: ['他就一张牌了，快压死他！']
  };
  let lowWarned = { 0: false, 1: false, 2: false };
  let lowTimer = null;

  function checkLowCards() {
    if (!game || game.phase !== 'play' || roundOver) return;
    if (lowTimer) return;
    lowTimer = setTimeout(() => {
      lowTimer = 0;
      if (!game || game.phase !== 'play' || roundOver) return;
      for (const s of [1, 2]) {
        const n = game.handSize(s);
        if (n > 0 && n <= 2 && !lowWarned[s]) {
          lowWarned[s] = true;
          say(s, LOW_LINES[n][(Math.random() * LOW_LINES[n].length) | 0]);
          setSeatMood(s, 'smug', 3200);
          speak(n === 2 ? '我就剩两张牌了' : '我就剩一张牌了', s);
          flashAvatar(s, 520);
          setMood(el('tbAv'), 'angry', 1300);
          el('thMood').textContent = '小心！他只剩 ' + n + ' 张';
        }
      }
      const hn = game.handSize(HUMAN);
      if (hn > 0 && hn <= 2 && !lowWarned[0]) {
        lowWarned[0] = true;
        const who = Math.random() < 0.5 ? 1 : 2;
        say(who, LOW_TAUNT[hn][(Math.random() * LOW_TAUNT[hn].length) | 0]);
        setSeatMood(who, 'smug', 2800);
        speak(hn === 2 ? '他就剩两张牌了' : '他就剩一张牌了', who);
      }
    }, 420);
  }

  /* ---------- 手持牌扇 ---------- */
  function fanHtml(n, max) {
    if (!n) return '';
    const k = Math.max(1, Math.min(max || 6, Math.ceil(n / 3)));
    let h = '';
    for (let i = 0; i < k; i++) h += '<i style="--i:' + i + '"></i>';
    return h;
  }

  function paintHandFans() {
    if (!game) return;
    const playing = !roundOver && (game.phase === 'play' || game.phase === 'bid');
    for (const s of [1, 2]) {
      const box = el('hand' + s);
      if (!box) continue;
      const n = playing ? game.handSize(s) : 0;
      box.innerHTML = fanHtml(n, 5);
      box.classList.toggle('hide', !n);
    }
    const hb = el('heroHand');
    if (hb) {
      const n = playing ? game.handSize(HUMAN) : 0;
      hb.innerHTML = fanHtml(n, 6);
      hb.classList.toggle('hide', !n);
    }
  }

  /* ---------- 飞牌 ---------- */
  function playSlot(seat) {
    return playsEl.querySelector('.playslot[data-seat="' + seat + '"]');
  }

  function flyCards(fromRect, targets, ids, seat) {
    const layer = el('flyLayer');
    if (!layer || !fromRect || !targets.length) return false;
    sfx('flick');
    ids.forEach((id, i) => {
      const t = targets[Math.min(i, targets.length - 1)];
      if (!t) return;
      const r = t.getBoundingClientRect();
      const c = cardEl(id, { small: true });
      c.classList.add('flyc');
      c.style.left = Math.round(fromRect.left + fromRect.width / 2 - 21) + 'px';
      c.style.top = Math.round(fromRect.top + fromRect.height / 2 - 30) + 'px';
      layer.appendChild(c);
      const dx = (r.left + r.width / 2) - (fromRect.left + fromRect.width / 2);
      const dy = (r.top + r.height / 2) - (fromRect.top + fromRect.height / 2);
      const rot = Math.random() * 32 - 16;
      c.animate([
        { transform: 'translate(0,0) rotate(' + (rot * 1.7) + 'deg) scale(.9)', opacity: 1, offset: 0 },
        { transform: 'translate(' + (dx * 0.5) + 'px,' + (dy * 0.5 - 34) + 'px) rotate(' + (rot * 0.5) + 'deg) scale(1.06)', opacity: 1, offset: 0.5 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(0deg) scale(1)', opacity: 1, offset: 1 }
      ], { duration: 330, delay: i * 32, easing: 'cubic-bezier(.3,.75,.35,1)', fill: 'forwards' }).onfinish = () => {
        c.remove();
        t.classList.remove('incoming');
        t.classList.add('landed');
      };
    });
    setTimeout(() => sfx('thud'), 330);
    return true;
  }

  function throwToTable(seat, ids, fromRect) {
    if (!ids || !ids.length) return;
    const slot = playSlot(seat);
    if (!slot) return;
    const targets = Array.prototype.slice.call(slot.querySelectorAll('.cards .c'));
    if (!targets.length) return;
    targets.forEach(t => t.classList.add('incoming'));
    requestAnimationFrame(() => {
      if (!flyCards(fromRect, targets, ids, seat)) targets.forEach(t => t.classList.remove('incoming'));
    });
    setTimeout(() => targets.forEach(t => t.classList.remove('incoming')), 1500);
  }

  function handRect(seat) {
    const n = seat === HUMAN ? el('heroHand') : el('hand' + seat);
    if (n && !n.classList.contains('hide')) return n.getBoundingClientRect();
    const f = seat === HUMAN ? el('tbAv') : el('seat' + seat);
    return f ? f.getBoundingClientRect() : null;
  }

  /* ---------- 抢地主：飞分牌 ---------- */
  function throwBidToken(seat, score) {
    const layer = el('flyLayer');
    const src = seat === HUMAN ? el('tbAv') : el('seat' + seat);
    const dst = el('bottomCards');
    if (!layer || !src || !dst) return;
    const a = src.getBoundingClientRect(), b = dst.getBoundingClientRect();
    const tok = document.createElement('div');
    tok.className = 'flytoken';
    tok.textContent = score > 0 ? score + ' 分' : '不叫';
    tok.style.left = Math.round(a.left + a.width / 2 - 26) + 'px';
    tok.style.top = Math.round(a.top + a.height * 0.4) + 'px';
    layer.appendChild(tok);
    const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
    const dy = (b.top - 26) - (a.top + a.height * 0.4);
    sfx('bid');
    flashAvatar(seat, 500);
    tok.animate([
      { transform: 'translate(0,0) scale(.6)', opacity: 0, offset: 0 },
      { transform: 'translate(' + (dx * 0.5) + 'px,' + (dy * 0.5 - 30) + 'px) scale(1.1)', opacity: 1, offset: 0.42 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.92)', opacity: 1, offset: 1 }
    ], { duration: 470, easing: 'cubic-bezier(.3,.8,.3,1)', fill: 'forwards' }).onfinish = () => {
      tok.animate([{ opacity: 1, transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.92)' },
                   { opacity: 0, transform: 'translate(' + dx + 'px,' + (dy - 16) + 'px) scale(.8)' }],
        { duration: 260, fill: 'forwards' });
      setTimeout(() => tok.remove(), 300);
    };
  }

  function isBombMove(mv) {
    if (!mv) return false;
    if (mv[16] && mv[17]) return true;
    for (let r = 3; r <= 15; r++) if (mv[r] === 4) return true;
    return false;
  }

  function buildChat() {
    const p = el('chatPanel');
    p.innerHTML =
      '<div class="chat-quick">' +
        QUICK_LINES.map((t, i) => '<button data-say="' + i + '" type="button">' + t + '</button>').join('') +
      '</div><div class="chat-emo">' +
        EMOJIS.map((e, i) => '<button data-emo="' + i + '" type="button">' + e + '</button>').join('') +
      '</div>';
    p.querySelectorAll('[data-say]').forEach(b => {
      b.onclick = () => { say(HUMAN, QUICK_LINES[+b.dataset.say]); p.classList.remove('show'); };
    });
    p.querySelectorAll('[data-emo]').forEach(b => {
      b.onclick = () => { say(HUMAN, EMOJIS[+b.dataset.emo], true); p.classList.remove('show'); };
    });
  }

  /* ================= 渲染 ================= */
  const handEl = el('hand'), playsEl = el('plays'), actionsEl = el('actions');
  const tipEl = el('tip'), overlay = el('overlay');

  function cardEl(id, opts) {
    opts = opts || {};
    const d = document.createElement('div');
    d.className = 'c' + (opts.small ? ' small' : '');
    d.dataset.id = String(id);
    const r = D.cardRank(id);
    const suit = ['♠', '♥', '♣', '♦'][id & 3];
    if (r >= 16) {
      d.classList.add('joker');
      if (r === 17) d.classList.add('red');
      d.innerHTML = '<span class="corner"><span class="r">' + (r === 16 ? '小王' : '大王') + '</span></span>';
    } else {
      if (suit === '♥' || suit === '♦') d.classList.add('red');
      d.innerHTML = '<span class="corner"><span class="r">' + D.rankLabel(r) + '</span><span class="s">' + suit + '</span></span>';
    }
    if (opts.onclick) d.addEventListener('click', opts.onclick);
    return d;
  }

  function renderHand() {
    handEl.innerHTML = '';
    const ids = D.sortIds(game.ids[HUMAN]);
    const myTurn = game.phase === 'play' && game.turn === HUMAN && !roundOver;
    for (const id of ids) {
      const c = cardEl(id, { onclick: myTurn ? () => toggleCard(id) : null });
      if (selected.has(id)) c.classList.add('sel');
      if (game.phase === 'play' && game.turn !== HUMAN) c.classList.add('dim');
      handEl.appendChild(c);
    }
    el('cnt0').textContent = game.handSize(HUMAN);
    layoutHand();
  }

  function layoutHand() {
    const wrap = handEl.parentElement;
    const cards = handEl.children;
    const n = cards.length;
    if (!n || !wrap || !wrap.clientWidth) return;
    const cw = cards[0].offsetWidth || 50;
    const avail = wrap.clientWidth - 4;
    let ov = Math.round(cw * 0.34);
    if (n > 1 && n * cw - (n - 1) * ov > avail) {
      ov = Math.ceil((n * cw - avail) / (n - 1));
    }
    if (ov < 0) ov = 0;
    handEl.style.setProperty('--ov', ov + 'px');
  }

  function toggleCard(id) {
    if (busy || roundOver) return;
    if (selected.has(id)) selected.delete(id); else selected.add(id);
    hintIdx = 0;
    renderHand();
    updateActions();
  }

  function renderSeats() {
    for (let s = 1; s <= 2; s++) {
      const hn = game.handSize(s);
      el('cnt' + s).textContent = hn;
      el('seat' + s).dataset.low = (game.phase === 'play' && !roundOver && hn > 0 && hn <= 2) ? '1' : '';
      const isL = game.landlord === s;
      const role = el('role' + s);
      role.textContent = isL ? '地主' : '农民';
      role.className = 'role' + (isL ? '' : ' farmer');
      el('seat' + s).classList.toggle('active', game.phase === 'play' && game.turn === s && !roundOver);
    }
    const r0 = el('role0');
    const isLH = game.landlord === HUMAN;
    r0.textContent = game.landlord < 0 ? '待定' : (isLH ? '地主' : '农民');
    r0.className = 'role' + (isLH || game.landlord < 0 ? '' : ' farmer');
    paintHandFans();
    checkLowCards();
  }

  function renderBottomCards() {
    const box = el('bottomCards');
    box.innerHTML = '<span class="lbl">底牌</span>';
    if (game.landlord < 0) {
      for (let i = 0; i < 3; i++) {
        const c = cardEl(0, { small: true });
        c.innerHTML = '';
        c.classList.add('cback');
        box.appendChild(c);
      }
      return;
    }
    for (const id of game.bottom) box.appendChild(cardEl(id, { small: true }));
  }

  function renderPlays() {
    playsEl.innerHTML = '';
    const order = [1, HUMAN, 2];
    const names = { 0: '我', 1: '电脑 A', 2: '电脑 B' };
    for (let i = 0; i < order.length; i++) {
      const s = order[i];
      const v = tableCards[s];
      /* 没有出牌记录的座位不渲染，但用显式列号占住位置，避免列位左右跳动 */
      if (v !== 'pass' && !(v && v.length)) continue;
      const slot = document.createElement('div');
      slot.className = 'playslot';
      slot.dataset.seat = String(s);
      slot.style.gridColumn = String(i + 1);
      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = names[s];
      slot.appendChild(nm);
      const wrap = document.createElement('div');
      wrap.className = 'cards';
      if (v === 'pass') {
        const p = document.createElement('div');
        p.className = 'passmark';
        p.textContent = '不出';
        wrap.appendChild(p);
      } else if (v && v.length) {
        const sorted = D.sortIds(v);
        for (const id of sorted) wrap.appendChild(cardEl(id, { small: true }));
      }
      slot.appendChild(wrap);
      playsEl.appendChild(slot);
    }
  }

  function updateActions() {
    actionsEl.innerHTML = '';
    if (roundOver) return;

    if (game.phase === 'bid') {
      if (game.bidTurn !== HUMAN) {
        const t = document.createElement('span');
        t.className = 'wait';
        t.textContent = '等待其他玩家叫分…';
        actionsEl.appendChild(t);
        return;
      }
      const box = document.createElement('div');
      box.className = 'bidbox';
      const need = game.bestBid + 1;
      const mk = (label, score) => {
        const b = document.createElement('button');
        b.className = 'btn ' + (score === 0 ? 'ghost' : 'gold');
        b.type = 'button';
        b.textContent = label;
        b.disabled = score > 0 && score < need;
        b.onclick = () => humanBid(score);
        box.appendChild(b);
      };
      mk('不叫', 0); mk('1 分', 1); mk('2 分', 2); mk('3 分', 3);
      actionsEl.appendChild(box);
      return;
    }

    if (game.phase !== 'play') return;
    if (game.turn !== HUMAN) {
      const t = document.createElement('span');
      t.className = 'wait';
      t.textContent = '等待出牌…';
      actionsEl.appendChild(t);
      return;
    }

    const hintBtn = document.createElement('button');
    hintBtn.className = 'btn ghost'; hintBtn.type = 'button';
    hintBtn.textContent = '提示'; hintBtn.onclick = humanHint;

    const clearBtn = document.createElement('button');
    clearBtn.className = 'btn ghost'; clearBtn.type = 'button';
    clearBtn.textContent = '重选';
    clearBtn.onclick = () => { selected.clear(); hintIdx = 0; renderHand(); updateActions(); };

    const passBtn = document.createElement('button');
    passBtn.className = 'btn ghost'; passBtn.type = 'button';
    passBtn.textContent = '不出';
    passBtn.disabled = !game.canPass();
    passBtn.onclick = humanPass;

    const playBtn = document.createElement('button');
    playBtn.className = 'btn gold'; playBtn.type = 'button';
    playBtn.textContent = '出牌';
    playBtn.disabled = selected.size === 0;
    playBtn.onclick = humanPlay;

    actionsEl.appendChild(hintBtn);
    actionsEl.appendChild(clearBtn);
    actionsEl.appendChild(passBtn);
    actionsEl.appendChild(playBtn);
  }

  function render() {
    renderSeats();
    renderBottomCards();
    renderPlays();
    renderHand();
    updateActions();
    refreshCoins();
  }

  /* ================= 叫分 ================= */
  function humanBid(score) {
    if (game.phase !== 'bid' || game.bidTurn !== HUMAN) return;
    game.bid(HUMAN, score);
    setMood(el('tbAv'), score > 0 ? 'smug' : 'think', 1500);
    throwBidToken(HUMAN, score);
    speak(score > 0 ? score + '分' : '不叫', HUMAN);
    callout(HUMAN, score > 0 ? score + ' 分' : '不叫');
    el('bid1').textContent = '';
    el('bid2').textContent = '';
    afterBid();
  }

  function afterBid() {
    if (game.phase === 'redeal') {
      toast('三家都不叫，重新发牌');
      setTimeout(() => startRound(), 900);
      return;
    }
    if (game.phase === 'play') {
      tableCards = [null, null, null];
      render();
      tipEl.innerHTML = '叫分 <b>' + game.base + '</b> 分 · ' + (game.landlord === HUMAN ? '你是地主，先出牌' : '电脑是地主，先出牌');
      scheduleStep(700);
      return;
    }
    render();
    scheduleStep(750);
  }

  /* ================= 主循环 ================= */
  function scheduleStep(delay) { setTimeout(step, delay === undefined ? 700 : delay); }

  function step() {
    if (roundOver || !game) return;
    if (game.phase === 'bid') {
      if (game.bidTurn === HUMAN) {
        render();
        setMood(el('tbAv'), 'think');
        el('thMood').textContent = '要不要叫？';
        return;
      }
      const seat = game.bidTurn;
      const p = policyFor(mode.ai);
      let sc = 0;
      try { sc = p.chooseBid(game, seat); } catch (e) { sc = 0; }
      if (!game.bid(seat, sc)) game.bid(seat, 0);
      el('bid' + seat).textContent = sc > 0 ? '（' + sc + ' 分）' : '（不叫）';
      throwBidToken(seat, sc);
      speak(sc > 0 ? sc + '分' : '不叫', seat);
      callout(seat, sc > 0 ? sc + ' 分' : '不叫');
      setSeatMood(seat, sc >= 3 ? 'smug' : sc > 0 ? 'happy' : 'think', 1500);
      afterBid();
      return;
    }
    if (game.phase === 'play') {
      if (game.turn === HUMAN) {
        render();
        if (!roundOver) { setMood(el('tbAv'), 'think'); el('thMood').textContent = '轮到你了'; }
        return;
      }
      const seat = game.turn;
      const p = policyFor(mode.ai);
      let mv = null;
      try { mv = p.chooseMove(game, seat); } catch (e) { mv = null; }
      applySeatMove(seat, mv);
      return;
    }
  }

  function applySeatMove(seat, mv) {
    busy = true;
    const srcRect = handRect(seat);
    if (mv === null || mv === undefined) {
      if (!game.pass(seat)) {
        const ms = game.legalMoves(seat);
        if (ms.length) mv = ms[0]; else { game.pass(seat); mv = null; }
      }
      tableCards[seat] = 'pass';
    }
    if (mv) {
      const played = D.countsToIds(game.ids[seat], mv);
      if (!game.play(seat, mv)) {
        const ms = game.legalMoves(seat);
        if (ms.length) {
          const m2 = ms[0];
          const p2 = D.countsToIds(game.ids[seat], m2);
          game.play(seat, m2);
          tableCards[seat] = p2;
        } else { game.pass(seat); tableCards[seat] = 'pass'; }
      } else {
        tableCards[seat] = played;
      }
    }
    const playedIds = tableCards[seat];
    const isPass = playedIds === 'pass';

    if (isPass) {
      sfx('pass');
    } else if (playedIds && playedIds.length) {
      const line = moveVoice(mv);
      callout(seat, line);
      speak(line, seat);
      setSeatMood(seat, isBombMove(mv) ? 'angry' : 'play', 1200);
      flashAvatar(seat, 470);
    }

    if (game.phase === 'over') {
      roundOver = true;
      render();
      if (!isPass) throwToTable(seat, playedIds, srcRect);
      setTimeout(() => { roundOver = false; busy = false; finish(); }, isPass ? 80 : 480);
      return;
    }
    busy = false;
    if (isPass) {
      if (Math.random() < 0.28) npcSay(seat, 'pass');
    } else if (mv && isBombMove(mv)) {
      if (Math.random() < 0.55) npcSay(seat, 'bomb');
      setMood(el('tbAv'), 'sad', 1000);
      el('thMood').textContent = '被炸了';
    }
    render();
    if (!isPass) throwToTable(seat, playedIds, srcRect);
    else setSeatMood(seat, 'think', 900);
    scheduleStep(560);
  }

  /* ================= 玩家操作 ================= */
  function selectedMove() {
    const m = new Int8Array(18);
    for (const id of selected) m[D.cardRank(id)]++;
    return m;
  }

  function humanPlay() {
    if (game.turn !== HUMAN || busy) return;
    if (!selected.size) return;
    const m = selectedMove();
    const last = game.lastSeat === HUMAN ? null : game.lastMove;
    const a = D.analyze(m);
    if (!a) { toast('这不是合法牌型'); return; }
    if (!D.beats(a, last ? D.analyze(last) : null)) { toast('压不过上家，换一手'); return; }
    const selEls = [];
    selected.forEach(id => {
      const node = handEl.querySelector('.c[data-id="' + id + '"]');
      if (node) selEls.push(node);
    });
    let fromRect = handRect(HUMAN);
    if (selEls.length) {
      const a0 = selEls[0].getBoundingClientRect();
      const a1 = selEls[selEls.length - 1].getBoundingClientRect();
      fromRect = {
        left: a0.left, top: Math.min(a0.top, a1.top),
        width: Math.max(a0.width, a1.right - a0.left),
        height: Math.max(a0.height, a1.height)
      };
    }
    const played = D.countsToIds(game.ids[HUMAN], m);
    if (!game.play(HUMAN, m)) { toast('出牌失败，请重试'); return; }
    tableCards[HUMAN] = played;
    selected.clear();
    hintIdx = 0;
    const line = moveVoice(m);
    setMood(el('tbAv'), isBombMove(m) ? 'smug' : 'play', 1100);
    el('thMood').textContent = isBombMove(m) ? '放炸弹' : '出牌';
    flashAvatar(HUMAN, 470);
    callout(HUMAN, line);
    speak(line, HUMAN);
    if (game.phase === 'over') {
      roundOver = true;
      render();
      throwToTable(HUMAN, played, fromRect);
      setTimeout(() => { roundOver = false; finish(); }, 480);
      return;
    }
    render();
    throwToTable(HUMAN, played, fromRect);
    scheduleStep(520);
  }

  function humanPass() {
    if (game.turn !== HUMAN || busy) return;
    if (!game.canPass()) { toast('你是本轮首出，必须出牌'); return; }
    game.pass(HUMAN);
    tableCards[HUMAN] = 'pass';
    selected.clear();
    sfx('pass');
    setMood(el('tbAv'), 'think', 900);
    callout(HUMAN, '不出');
    render();
    scheduleStep(520);
  }

  function humanHint() {
    if (game.turn !== HUMAN) return;
    const ms = game.legalMoves(HUMAN);
    if (!ms.length) { toast('没有能压过的牌，只能不出'); return; }
    lastLegal = ms.slice().sort((x, y) => {
      const ax = D.analyze(x), ay = D.analyze(y);
      if (ax.n !== ay.n) return ax.n - ay.n;
      return ax.r - ay.r;
    });
    if (hintIdx >= lastLegal.length) { hintIdx = 0; toast('已循环到最小一手'); }
    const m = lastLegal[hintIdx++];
    selected.clear();
    const ids = D.countsToIds(game.ids[HUMAN], m);
    for (const id of ids) selected.add(id);
    renderHand();
    updateActions();
  }

  /* ================= 结算 ================= */
  function finish() {
    roundOver = true;
    busy = false;
    render();

    const L = game.landlord;
    const landlordWon = game.winner === L;
    const iAmLandlord = HUMAN === L;
    const iWon = iAmLandlord === landlordWon;

    const share = iAmLandlord ? 2 : 1;
    const stake = mode.base * game.base * game.multiplier;
    let delta = stake * share * (iWon ? 1 : -1);
    if (!mode.coin) delta = 0;

    const extras = [];
    if (user) {
      ensureProfile(user);
      if (delta > 0 && user.buff.doubleUntil > Date.now()) {
        delta *= 2;
        extras.push('翻倍卡 ×2');
      }
      if (delta < 0 && user.buff.shield > 0) {
        user.buff.shield--;
        delta = Math.ceil(delta / 2);
        extras.push('护身符减半');
      }
      const lvBefore = levelOf(user.exp);
      user.exp = (user.exp || 0) + 30 + (iWon ? 25 : 0);
      const lvAfter = levelOf(user.exp);
      if (lvAfter > lvBefore) {
        const bonus = 200 * lvAfter;
        user.coins += bonus;
        extras.push('升到 Lv.' + lvAfter + ' · +' + bonus);
      }
    }

    let broke = false;
    if (user) {
      user.stats = user.stats || { games: 0, wins: 0, best: 0 };
      user.stats.games++;
      if (iWon) user.stats.wins++;
      if (delta !== 0) {
        const after = user.coins + delta;
        if (after < 0) { delta = -user.coins; broke = true; }   /* 赔不起就按剩余金币结算 */
        user.coins = Math.max(0, user.coins + delta);
        if (user.coins > (user.stats.best || 0)) user.stats.best = user.coins;
      }
      saveUser();
    }
    refreshCoins();

    if (iWon) { setMood(el('tbAv'), 'happy'); el('thMood').textContent = '赢麻了'; }
    else { setMood(el('tbAv'), 'sad'); el('thMood').textContent = '下次赢回来'; }
    if (iWon) npcSay(Math.random() < 0.5 ? 1 : 2, 'lose');
    else npcSay(game.winner === HUMAN ? 1 : game.winner, 'win');

    el('ovTitle').textContent = iWon ? '你赢了' : '你输了';
    const bits = [];
    bits.push(landlordWon ? '地主获胜' : '农民获胜');
    if (game.spring) bits.push((landlordWon ? '春天' : '反春天') + ' ×2');
    if (game.bombCount > 0) bits.push('炸弹 ' + game.bombCount + ' 次');
    if (mode.coin) {
      bits.push('底分 ' + mode.base + ' × 叫分 ' + game.base + ' × 倍数 ' + game.multiplier + ' × ' + share + ' 份');
    }
    if (broke) bits.push('金币不足，已按剩余金币结算');
    for (const x of extras) bits.push(x);
    el('ovSub').innerHTML = bits.join(' · ');

    const dEl = el('ovDelta');
    if (delta === 0) {
      dEl.className = 'delta zero';
      dEl.innerHTML = '—';
      el('ovBal').textContent = '当前金币 ' + fmt(user ? user.coins : 0);
    } else {
      dEl.className = 'delta ' + (delta > 0 ? 'win' : 'lose');
      dEl.innerHTML = fmtSigned(delta) + '<span class="u">金币</span>';
      el('ovBal').textContent = '余额 ' + fmt(user.coins) + ' 金币';
    }
    overlay.classList.add('show');
  }

  /* ================= 开局 ================= */
  function startRound() {
    overlay.classList.remove('show');
    roundOver = false;
    busy = false;
    selected.clear();
    hintIdx = 0;
    tableCards = [null, null, null];
    lowWarned = { 0: false, 1: false, 2: false };
    clearTimeout(lowTimer);
    lowTimer = 0;
    document.querySelectorAll('.callout, .flyc, .flytoken').forEach(n => n.remove());
    el('bid1').textContent = '';
    el('bid2').textContent = '';
    el('chatPanel').classList.remove('show');
    paintTableHero('idle', '准备中');
    game = new D.Game();
    tipEl.innerHTML = '叫分抢地主，最高分者当地主';
    render();
    if (game.bidTurn === HUMAN) return;
    scheduleStep(800);
  }

  /* ================= 抽屉 ================= */

  /* ================= 活动面板 ================= */
  function openSign() {
    ensureProfile(user);
    const ss = signState();
    let cells = '';
    for (let i = 0; i < 7; i++) {
      const day = i + 1;
      const got = ss.done ? day <= ss.day : day < ss.day;
      const today = !ss.done && day === ss.day;
      cells += '<div class="sign-cell' + (got ? ' got' : '') + (today ? ' today' : '') + '">' +
        '<div class="d">第 ' + day + ' 天</div><div class="r">' + SIGN_REWARDS[i] + '</div>' +
        '<div class="st">' + (got ? '已领' : today ? '可领' : '') + '</div></div>';
    }
    openDrawer(
      '<h3>每日签到<button class="icon-btn" data-close-drawer type="button">✕</button></h3>' +
      '<div style="font-size:11.5px;color:#e8bda6;margin-bottom:10px">连签奖励逐日递增，断签从第 1 天重来</div>' +
      '<div class="sign-grid">' + cells + '</div>' +
      '<div class="row-btns"><button class="btn gold" id="sgGo" type="button"' + (ss.done ? ' disabled' : '') + '>' +
        (ss.done ? '今日已签到' : '领取 ' + SIGN_REWARDS[ss.day - 1] + ' 金币') + '</button></div>'
    );
    const go = el('sgGo');
    if (go) go.onclick = () => {
      const st = signState();
      if (st.done) return;
      const gain = SIGN_REWARDS[st.day - 1];
      user.sign = { last: todayStr(), streak: st.day };
      user.coins += gain;
      saveUser(); refreshCoins(); paintLobby(); closeDrawer();
      toast('签到成功，+' + gain + ' 金币');
      setMood(el('heroAv'), 'happy', 1700);
    };
  }

  function openLevel() {
    ensureProfile(user);
    const lv = levelOf(user.exp);
    let rows = '';
    for (let i = 1; i <= 10; i++) {
      const need = (i - 1) * LEVEL_STEP;
      const got = (user.exp || 0) >= need;
      rows += '<div class="lvl-row' + (got ? ' done' : '') + '">' +
        '<span class="tag">Lv.' + i + '</span><span class="nm">' + levelTitle(i) + '</span>' +

      '<div style="font-size:11.5px;color:#e8bda6;margin-bottom:8px">每局 +30 经验，赢局再 +25。当前 Lv.' + lv + ' ' + levelTitle(lv) + '</div>' +
      '<div class="hero-exp" style="margin:0 0 12px"><i style="width:' +

  function priceOf(id) {
    if (id.indexOf('outfit_') === 0) { const o = OUTFITS[id.slice(7)]; return o ? o.price : 0; }
    if (ACC[id]) return ACC[id].price;
    if (ITEMS[id]) return ITEMS[id].price;
    return 0;
  }

  function openShop(tab) {
    tab = tab || 'skin';
    ensureProfile(user);
    let body = '';
    if (tab === 'skin') {
      body = Object.keys(OUTFITS).map(k => {
        const o = OUTFITS[k], id = 'outfit_' + k;
        const owned = o.price === 0 || owns(id);
        return skuRow(o.name, o.desc, o.price, owned, id, '衣服', o.cloth);
      }).join('');
    } else if (tab === 'acc') {
      body = Object.keys(ACC).map(k => {
        const a = ACC[k];
        return skuRow(a.icon + ' ' + a.name, a.desc, a.price, owns(k), k, '饰品', '');
      }).join('');
    } else {
      body = Object.keys(ITEMS).map(k => {
        const it = ITEMS[k], n = user.bag[k] || 0;
        return '<div class="sku"><div class="thumb">' + it.icon + '</div><div class="body">' +
          '<div class="nm">' + it.name + (n ? ' · 已有 ' + n : '') + '</div>' +
          '<div class="ds">' + it.desc + '</div><div class="pr">' + it.price + ' 金币</div></div>' +
          '<button class="btn sm gold" data-buy="' + k + '" type="button">购买</button></div>';
      }).join('');
    }
    openDrawer(
      '<h3>商城<button class="icon-btn" data-close-drawer type="button">✕</button></h3>' +
      '<div class="shop-tabs">' +
        '<button data-tab="skin" class="' + (tab === 'skin' ? 'on' : '') + '" type="button">衣服</button>' +
        '<button data-tab="acc" class="' + (tab === 'acc' ? 'on' : '') + '" type="button">饰品</button>' +
        '<button data-tab="item" class="' + (tab === 'item' ? 'on' : '') + '" type="button">道具</button>' +
      '</div><div class="shop-grid">' + body + '</div>' +
      '<div style="font-size:10px;color:#b98a76;margin-top:10px">余额 <b style="color:#ffe3b0">' +
        fmt(user.coins) + '</b> 金币 · 买到的衣服饰品在「换装」里穿</div>'
    );
    drawerBody.querySelectorAll('.shop-tabs button').forEach(b => {
      b.onclick = () => openShop(b.dataset.tab);
    });
    drawerBody.querySelectorAll('[data-buy]').forEach(b => {
      b.onclick = () => buy(b.dataset.buy);
    });
    drawerBody.querySelectorAll('[data-wear]').forEach(b => {
      b.onclick = () => wearOutfit(b.dataset.wear);
    });
    drawerBody.querySelectorAll('[data-dress]').forEach(b => {
      b.onclick = () => dressAcc(b.dataset.dress);
    });
  }

  function skuRow(name, desc, price, owned, id, cat, color) {
    const thumb = color
      ? '<div class="thumb" style="background:' + color + ';border-color:rgba(0,0,0,.18)"></div>'
      : '<div class="thumb">' + (ACC[id] ? ACC[id].icon : '🎁') + '</div>';
    const act = owned
      ? '<button class="btn sm ghost" data-' + (cat === '衣服' ? 'wear' : 'dress') + '="' + id + '" type="button">' +
          (cat === '衣服' ? '穿上' : '戴/取') + '</button>'
      : '<button class="btn sm gold" data-buy="' + id + '" type="button">购买</button>';
    return '<div class="sku">' + thumb + '<div class="body"><div class="nm">' + name + '</div>' +
      '<div class="ds">' + desc + '</div><div class="pr">' + (owned ? '已拥有' : price + ' 金币') + '</div></div>' + act + '</div>';
  }

  function buy(id) {
    const p = priceOf(id);
    if (!p) return;
    if (user.coins < p) { toast('金币不够，先去打几局'); return; }
    user.coins -= p;
    if (ITEMS[id]) {
      user.bag[id] = (user.bag[id] || 0) + 1;
      toast('已购买 ' + ITEMS[id].name);
      saveUser(); refreshCoins(); paintLobby();
      openShop('item');
    } else {
      if (user.owned.indexOf(id) < 0) user.owned.push(id);
      toast('已购买，可以穿上了');
      saveUser(); refreshCoins(); paintLobby();
      openShop(id.indexOf('outfit_') === 0 ? 'skin' : 'acc');
    }
  }

  function wearOutfit(id) {
    user.look.outfit = id.slice(7);
    saveUser(); paintHero();
    toast('已换上 ' + (OUTFITS[user.look.outfit] ? OUTFITS[user.look.outfit].name : ''));
  }

  function dressAcc(id) {
    const a = ACC[id];
    if (!a) return;
    user.look[a.slot] = user.look[a.slot] === id ? '' : id;
    saveUser(); paintHero();
    toast(user.look[a.slot] === id ? '已戴上 ' + a.name : '已取下 ' + a.name);
    openShop('acc');
  }

  function openBag() {
    ensureProfile(user);
    const keys = Object.keys(ITEMS).filter(k => (user.bag[k] || 0) > 0);
    let html = '<h3>背包<button class="icon-btn" data-close-drawer type="button">✕</button></h3>';
    if (!keys.length) {
      html += '<div style="font-size:12px;color:#e8bda6;padding:6px 0 10px">背包是空的，去商城看看道具</div>';
    }
    html += '<div class="shop-grid">' + keys.map(k => {
      const it = ITEMS[k];
      return '<div class="sku"><div class="thumb">' + it.icon + '</div><div class="body">' +
        '<div class="nm">' + it.name + ' ×' + user.bag[k] + '</div><div class="ds">' + it.desc + '</div></div>' +
        '<button class="btn sm gold" data-use="' + k + '" type="button">使用</button></div>';
    }).join('') + '</div>';
    html += '<div style="font-size:10px;color:#b98a76;margin-top:10px">生效中的增益会显示在大厅人物下方</div>';
    openDrawer(html);
    drawerBody.querySelectorAll('[data-use]').forEach(b => {
      b.onclick = () => useItem(b.dataset.use);
    });
  }

  function useItem(k) {
    ensureProfile(user);
    if (!user.bag[k]) return;
    if (k === 'item_double') {
      const now = Date.now();
      user.buff.doubleUntil = Math.max(now, user.buff.doubleUntil || 0) + 30 * 60000;
    } else if (k === 'item_shield') {
      user.buff.shield = (user.buff.shield || 0) + 1;
    } else if (k === 'item_lucky') {
      user.buff.lucky = (user.buff.lucky || 0) + 1;
    }
    user.bag[k]--;
    if (!user.bag[k]) delete user.bag[k];
    saveUser(); refreshCoins(); paintLobby(); openBag();
    toast(ITEMS[k].name + ' 已生效');
  }

    ensureProfile(user);
    const L = user.look;
    const btn = (key, v, on, inner, style) =>

      '<div class="field" style="margin-bottom:8px"><span>体型</span><div class="seg">' +

      '<div class="field" style="margin-bottom:8px"><span>肤色</span><div class="seg sw">' + skinBtns + '</div></div>' +

        const k = b.dataset.set, v = b.dataset.v;
        if (k === 'sex') {
          user.look.sex = v;
          const cur = HAIRS[user.look.hair | 0];
          if (!cur || cur.sex !== v) user.look.hair = v === 'f' ? 3 : 0;
        } else if (k === 'skin' || k === 'hair' || k === 'hairColor') {
          user.look[k] = +v;
        } else {
          user.look[k] = v;

      user.nickname = n;
      saveUser();
      paintLobby();

  /* ---- 账号备份 / 恢复：跨浏览器、跨机器、在预览窗口里也能把数据带出去 ---- */
  const BK_FIELDS = ['id', 'nickname', 'email', 'avatar', 'salt', 'algo', 'hash', 'coins', 'exp',
    'look', 'owned', 'bag', 'buff', 'stats', 'sign', 'createdAt', 'lastLogin'];

  function backupCode(u) {
    const o = {};
    BK_FIELDS.forEach(k => { if (u[k] !== undefined && u[k] !== null) o[k] = u[k]; });
    const json = JSON.stringify(o);
    let b64 = '';
    try { b64 = btoa(unescape(encodeURIComponent(json))); } catch (e) { b64 = ''; }
    return 'DDZ1-' + (b64 || json);
  }
  function parseBackup(s) {
    s = String(s || '').trim();
    if (!s) return null;
    if (s.indexOf('DDZ1-') === 0) s = s.slice(5).trim();
    let json = s;
    if (s.charAt(0) !== '{') {
      try { json = decodeURIComponent(escape(atob(s))); } catch (e) { return null; }
    }
    try {
      const o = JSON.parse(json);
      if (!o || !o.id || !o.hash || !o.salt) return null;
      return o;
    } catch (e) { return null; }
  }

  function downloadBackup(u) {
    const code = backupCode(u);
    const body = '斗地主本地版 · 账号备份\n昵称：' + u.nickname + '\nID：' + u.id +
      '\n备份时间：' + new Date().toLocaleString() +
      '\n\n（下面整段都要保留，恢复时粘回游戏「设置 → 恢复账号」）\n' + code;
    try {
      const blob = new Blob([body], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '斗地主账号-' + u.id + '.txt';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      return true;
    } catch (e) { return false; }
  }

      '<div style="font-size:11.5px;color:#d9ab94;line-height:1.65;margin-bottom:9px">' +

      '<button class="btn ghost" id="bkPick" type="button">选择文件</button></div>' +

    );

    el('bkPick').onclick = () => el('bkFile').click();
    el('bkFile').onchange = () => {
      const f = el('bkFile').files && el('bkFile').files[0];
      if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        const m = String(fr.result || '').match(/DDZ1-[A-Za-z0-9+/=]+/);
        ta.value = m ? m[0] : String(fr.result || '').trim();
        err.textContent = m ? '' : '文件里没找到备份代码';
      };
      fr.readAsText(f);
    };
    el('bkDo').onclick = () => {
      const o = parseBackup(ta.value);
      if (!o) { err.textContent = '这段代码不完整或不是备份码，请重新复制'; return; }
      const old = users[o.id];
      if (old) {
        /* 本机已有同一账号：金币、等级取较大值，已购物品取并集，避免恢复把进度改小 */
        o.coins = Math.max(old.coins || 0, o.coins || 0);
        o.exp = Math.max(old.exp || 0, o.exp || 0);
        const own = (old.owned || []).concat(o.owned || []);
        o.owned = own.filter((v, i) => own.indexOf(v) === i);
        const bag = Object.assign({}, old.bag || {});
        for (const k in (o.bag || {})) bag[k] = Math.max(bag[k] || 0, o.bag[k] || 0);
        o.bag = bag;
      }
      users[o.id] = o;
      user = o;
      ensureProfile(o);
      saveUser();
      closeDrawer();
      paintStoreBar();
      afterLogin();
    };
  }

  const Fireworks = (function () {
    const cv = el('fwCanvas');
    if (!cv || !cv.getContext) return { start: function () { }, stop: function () { }, active: function () { return false; } };
    const ctx = cv.getContext('2d');
    const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const HUES = [
      ['#fff2c4', '#ffb648'],   // 香槟金
      ['#ffe0b0', '#ff6a3c'],   // 橙红
      ['#ffd0e2', '#ff4f86'],   // 品红
      ['#ffe6a8', '#ffcf5c'],   // 明黄
      ['#fed9ff', '#c07bff']    // 一点紫调，避免全暖色发闷
    ];
    let W = 0, H = 0, dpr = 1, raf = 0, running = false, T = 0;
    let parts = [], rockets = [], nextAt = 0, lastDraw = 0;
    /* 尺寸系数：窄屏上烟花要跟着缩小，否则一朵就占掉半个屏幕 */
    let S = 1;

    function resize() {
      const r = cv.getBoundingClientRect();
      const w = Math.max(1, Math.round(r.width));
      const h = Math.max(1, Math.round(r.height));
      S = Math.max(0.52, Math.min(1.1, Math.min(w, h) / 760));
      if (w === W && h === H) return;   // 尺寸没变就别重置画布（会闪一下）
      dpr = Math.min(1.5, window.devicePixelRatio || 1);
      W = w;
      H = h;
      cv.width = Math.round(W * dpr);
      cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function launch() {
      /* 同屏最多两枚在飞、粒子数超过上限就不再补发，避免满屏开花 */
      if (rockets.length >= 2 || parts.length > 150) return;
      const k = Math.random();
      let x;
      /* 留出约 12% 边距，避免炸开时被画布边缘切掉 */
      if (k < 0.46) x = W * (0.13 + Math.random() * 0.17);
      else if (k < 0.92) x = W * (0.70 + Math.random() * 0.17);
      else x = W * (0.36 + Math.random() * 0.28);   /* 偶尔在中路高处补一发，增加纵深 */
      rockets.push({
        x: x, px: x,
        y: H * 0.94, py: H * 0.94,
        vy: -(H * (0.72 + Math.random() * 0.34)),
        ty: H * (0.10 + Math.random() * 0.19),
        c: HUES[(Math.random() * HUES.length) | 0]
      });
    }

    function burst(x, y, c) {
      /* 一朵烟花的粒子数与炸开直径都跟着 S 走：窄屏小一点、稀一点，别糊满屏 */
      const n = reduce ? 18 : Math.round((52 + Math.random() * 18) * S);
      const power = 0.76 + Math.random() * 0.3;   // 每发的炸开直径略有差异
      const vs = 76 * S;
      for (let i = 0; i < n; i++) {
        const ang = Math.random() * Math.PI * 2;
        /* 46% 落在壳层（炸开的边缘），其余按面积均匀铺满内部，避免炸成空心的圆圈 */
        const shell = Math.random() < 0.46;
        const rad = shell ? 0.86 + Math.random() * 0.14 : Math.sqrt(Math.random()) * 0.96;
        const sp = rad * (0.88 + Math.random() * 0.24) * power;
        parts.push({
          x: x, y: y,
          vx: Math.cos(ang) * sp * vs, vy: Math.sin(ang) * sp * vs,
          life: 1, dec: 0.0042 + Math.random() * 0.005,
          c: Math.random() < 0.66 ? c[0] : c[1],
          r: (1.1 + Math.random() * 1.5) * S,
          ph: Math.random() * 6.28
        });
      }
      /* 炸点闪光 */
      parts.push({ x: x, y: y, vx: 0, vy: 0, life: 1, dec: 5.6, c: '#fffaf0', r: 6.4 * S, flash: 1 });
    }

    /* 单帧绘制：rAF 与看门狗共用。
       注意：rAF 的 now 是「帧起始时刻」，可能早于 performance.now()，
       两者交替调用会让 dt 变负 → damp>1 → 粒子速度指数爆炸（拉出全屏长线）。
       所以这里只认自己的单调时钟，并对 dt 做上下限夹紧。 */
    let prevT = 0, frameN = 0;
    function draw(forceDt) {
      const now = performance.now();
      lastDraw = now;
      let dt;
      if (forceDt) { dt = forceDt; }
      else {
        const raw = prevT ? (now - prevT) / 1000 : 1 / 60;
        dt = Math.min(0.05, Math.max(0.001, raw));
        prevT = now;
      }
      const damp = Math.pow(0.986, dt * 60);
      T += dt;
      /* 兜底自检：画布尺寸和容器对不上就会被 CSS 拉伸（粒子变糊变大），每 20 帧核一次 */
      if ((frameN++ % 20) === 0 && (cv.clientWidth !== W || cv.clientHeight !== H)) resize();
      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'lighter';

      if (now >= nextAt) {
        launch();
        if (!reduce && Math.random() < 0.18) setTimeout(launch, 320 + Math.random() * 340);
        nextAt = now + (reduce ? 3200 : 1000 + Math.random() * 1000);
      }

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.y += r.vy * dt;
        const tl = 56 * S;
        const tail = ctx.createLinearGradient(r.x, r.y, r.x, r.y + tl);
        tail.addColorStop(0, 'rgba(255,246,220,.92)');
        tail.addColorStop(0.34, 'rgba(255,200,124,.5)');
        tail.addColorStop(1, 'rgba(255,150,80,0)');
        ctx.globalAlpha = 1;
        ctx.strokeStyle = tail;
        ctx.lineWidth = 2.4 * S;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(r.x, r.y);
        ctx.lineTo(r.x, r.y + tl);
        ctx.stroke();
        const hr = 5 * S;
        const head = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, hr);
        head.addColorStop(0, 'rgba(255,252,236,1)');
        head.addColorStop(0.5, 'rgba(255,214,140,0.7)');
        head.addColorStop(1, 'rgba(255,160,90,0)');
        ctx.fillStyle = head;
        ctx.beginPath(); ctx.arc(r.x, r.y, hr, 0, 6.2832); ctx.fill();
        if (r.y <= r.ty) { burst(r.x, r.y, r.c); rockets.splice(i, 1); }
      }

      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        const px = p.x, py = p.y;
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vx *= damp;
        p.vy = p.vy * damp + 115 * dt;
        /* 安全阀：任何异常都不允许速度失控（否则拖尾会拉成贯穿全屏的长线） */
        const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (spd > 420) { const k = 420 / spd; p.vx *= k; p.vy *= k; }
        p.life -= p.dec * dt;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        const a = Math.pow(p.life, 1.5) * (0.84 + 0.16 * Math.sin(T * 26 + (p.ph || 0)));
        if (p.flash) {
          /* 炸点闪光：一团快速扩散的暖白光 */
          const fr = p.r + (1 - p.life) * 46;
          const g = ctx.createRadialGradient(px, py, 0, px, py, fr);
          g.addColorStop(0, 'rgba(255,252,236,' + (0.95 * a).toFixed(3) + ')');
          g.addColorStop(0.42, 'rgba(255,206,132,' + (0.5 * a).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(255,150,80,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(px, py, fr, 0, 6.2832); ctx.fill();
          continue;
        }
        const rr = Math.max(0.6, p.r * (0.45 + p.life * 0.85));
        /* 拖尾：沿速度方向反推一小段，做出流星线 */
        const tx = p.x - p.vx * 0.055, ty2 = p.y - p.vy * 0.055;
        ctx.globalAlpha = Math.min(1, a * 1.15);
        ctx.strokeStyle = p.c;
        ctx.lineWidth = rr * 1.35;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(tx, ty2); ctx.lineTo(p.x, p.y); ctx.stroke();
        /* 柔光 */
        ctx.globalAlpha = a * 0.2;
        ctx.beginPath(); ctx.arc(p.x, p.y, rr * 3.4, 0, 6.2832); ctx.fill();
        /* 芯点 */
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(p.x, p.y, rr * 0.9, 0, 6.2832); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function frame() {
      if (!running) return;
      draw();
      raf = requestAnimationFrame(frame);
    }

    /* 某些环境（离屏/受限 iframe）rAF 会被节流甚至不回调，用定时器兜底保证还在动 */
    const watchdog = setInterval(function () {
      if (!running) return;
      if (performance.now() - lastDraw > 220) draw();
    }, 180);

    let rzT = null;
    window.addEventListener('resize', function () {
      if (!running) return;
      clearTimeout(rzT);
      rzT = setTimeout(resize, 120);
    });
    /* 预览面板展开/收起、字体回流都不会触发 window.resize，
       画布尺寸跟不上就会被 CSS 拉伸放大（粒子变糊变大），所以直接盯元素本身 */
    if (window.ResizeObserver) {
      try {
        new ResizeObserver(function () { if (running) resize(); }).observe(cv);
      } catch (e) { }
    }

    return {
      start: function () {
        if (running) return;
        running = true;
        resize();
        parts = []; rockets = [];
        lastDraw = 0; prevT = 0;
        nextAt = performance.now() - 1;
        raf = requestAnimationFrame(frame);
      },
      stop: function () {
        if (!running) return;
        running = false;
        cancelAnimationFrame(raf);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, cv.width, cv.height);
      },
      /* __live 供回归用 */
      _watchdog: watchdog,
      debug: function () {
        let mv = 0;
        for (let i = 0; i < parts.length; i++) {
          const s = Math.sqrt(parts[i].vx * parts[i].vx + parts[i].vy * parts[i].vy);
          if (s > mv) mv = s;
        }
        return "r=" + rockets.length + " p=" + parts.length + " maxv=" + Math.round(mv) + " next=" + Math.round(nextAt);
      },
      /* 离线复现：按固定步长推进若干秒后定格，用于截图校验（不影响正常播放） */
      _sim: function (sec) {
        for (let i = 0, n = Math.round((sec || 1) * 60); i < n; i++) draw(1 / 60);
      },
      _launch: function () { launch(); },
      _freeze: function () {
        running = false;
        cancelAnimationFrame(raf);
      },
      active: function () { return running; }
    };
  })();

  /* ================= 启动 ================= */
  renderModes();
  function boot() {
    paintStoreBar();
    const sid = readJSON(K_SESSION, null);
    if (sid && users[sid]) {
      user = users[sid];
      ensureProfile(user);
      saveUser();
      paintLobby();
      showScreen('lobby');
      scheduleIdleMood();
    } else {
      showScreen('auth');
    }
  }
  boot();

  /* 调试接口（供自动化测试用） */
  window.__ddz = {
    get game() { return game; },
    get model() { return getModel(); },
    get user() { return user; },
    get mode() { return mode; },
    get store() { return STORE; },
    get fw() { return Fireworks; },
    get users() { return users; },
    enterMode: enterMode,
    startRound: startRound,
    say: say,
    setSeatMood: setSeatMood,
    checkLowCards: checkLowCards,
    hashTest: function (pw, salt) { return derive(pw, salt); },
    sha256Hex: function (s) { return hexOf(sha256(bytesOf(s))); }
  };
})();
</script>
</body>
</html>
